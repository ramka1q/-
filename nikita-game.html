  // Действия триггеров: 'toggle:id1,id2' | 'open:id' | 'flag:name' | 'event:name' | функция
  fire(act, src) {
    if (!act) return;
    if (typeof act === 'function') { act(this, src); return; }
    for (const a of String(act).split(' ')) {
      const [op, arg] = a.split(':');
      const ids = arg ? arg.split(',') : [];
      if (op === 'toggle') for (const id of ids) this.toggle(id);
      if (op === 'open') for (const id of ids) { const w = this.walls.find(w => w.id === id); if (w) this.openDoor(w); }
      if (op === 'flag') for (const id of ids) this.flag(id);
      if (op === 'event' && this.def.events && this.def.events[arg]) this.def.events[arg](this, src);
    }
  }
  toggle(id) {
    for (const l of this.lasers) if (l.id === id) l.on = !l.on;
    for (const z of this.zones) if (z.id === id) z.off = !z.off;
    for (const w of this.walls) if (w.id === id && w.door) this.openDoor(w);
  }

  updateItems(dt) {
    const P = this.P, cam = this.cam;
    const act = Math.max(this.viewW || 2000, this.viewH || 2000) * 1.2 + P.r * 10;
    for (let i = 0; i < this.items.length; i++) {
      const it = this.items[i];
      if (it.dead) continue;
      if (it.flash > 0) it.flash -= dt;
      if (it.say) { it.say.t -= dt; if (it.say.t <= 0) it.say = null; }
      if (!it.beh) continue;
      if (!it.always && (Math.abs(it.x - cam.x) > act || Math.abs(it.y - cam.y) > act)) continue;
      const fn = BEH[it.beh];
      if (fn) fn(it, dt, this);
    }
    // уборка съеденных
    if (this.items.some(it => it.dead)) this.items = this.items.filter(it => !it.dead);
    if (this.needSort) { this.items.sort((a, b) => (a.layer || 0) - (b.layer || 0) || a.r - b.r); this.needSort = false; }
    for (const e of this.eating) e.t += dt;
    this.eating = this.eating.filter(e => e.t < 0.2);
  }
  // Движение существа с учётом стен
  moveActor(it, vx, vy, dt) {
    it.vx = vx; it.vy = vy;
    const ox = it.x, oy = it.y;
    it.x += (vx + (it.pushX || 0)) * dt; it.y += (vy + (it.pushY || 0)) * dt;
    if (this.def.pit && !it.fly && !this.platAt(it.x, it.y, -it.r * 0.3, true)) { it.x = ox; it.y = oy; return true; }
    return this.collideWalls(it);
  }

  // ============================================================
  //  ПЛАТФОРМЫ (паркур над пропастью)
  // ============================================================
  // Платформа под точкой; особые (батут, лифт, конвейер, решётка) важнее обычного пола
  platAt(x, y, m = 0, solidOnly = false) {
    let base = null;
    for (const p of this.plats) {
      if (p.gone) continue;
      const special = p.path || p.kind !== 'static';
      if (solidOnly && (p.path || p.kind === 'crumble' || p.kind === 'spring')) continue;
      let hit;
      if (p.shape === 'circ') hit = U.dist(x, y, p.x, p.y) < p.r + (p.kind === 'spring' ? Math.min(m, 0) : m);
      else hit = x > p.x - m && x < p.x + p.w + m && y > p.y - m && y < p.y + p.h + m;
      if (!hit) continue;
      if (special) return p;
      if (!base) base = p;
    }
    return base;
  }
  updatePlats(dt) {
    for (const p of this.plats) {
      p.dx = 0; p.dy = 0;
      if (p.path) {
        const k = (1 - Math.cos((this.time + (p.phase || 0)) * TAU / p.period)) / 2;
        const nx = U.lerp(p.path[0][0], p.path[1][0], k), ny = U.lerp(p.path[0][1], p.path[1][1], k);
        p.dx = nx - p.x; p.dy = ny - p.y; p.x = nx; p.y = ny;
      }
      if (p.kind === 'crumble') {
        if (p.gone) { p.gt -= dt; if (p.gt <= 0) { p.gone = false; p.ct = 0; } }
        else if (p.stood) {
          p.ct = (p.ct || 0) + dt;
          if (p.ct > (p.life || 0.9)) {
            p.gone = true; p.gt = 4; Sound.play('crunch');
            for (let i = 0; i < 14; i++) this.part('dot', p.x + Math.random() * p.w, p.y + Math.random() * p.h, (Math.random() - 0.5) * 60, (Math.random() - 0.5) * 60, Math.min(p.w, p.h) * 0.08, '#a0522d', 0.8);
          }
        } else p.ct = Math.max(0, (p.ct || 0) - dt * 0.5);
        p.stood = false;
      }
    }
  }
  playerPlatform(dt) {
    const P = this.P;
    if (P.falling > 0) { P.falling -= dt; if (P.falling <= 0) this.respawnFall(); return; }
    const air = P.dashT > 0 || P.air > 0;
    if (!air) P.launch = null;
    const p = this.platAt(P.x, P.y, P.r * 0.3);
    if (p && !air) {
      P.x += p.dx; P.y += p.dy;
      if (p.kind === 'crumble') { p.stood = true; if (p.ct > 0.2) this.tip('crumble', 'Ржавая решётка рассыпается! Не стой на месте!', '#ffa94d'); }
      if (p.kind === 'conveyor') { const s = P.r * BASE_SPD * (p.str || 0.5); this.pushX += p.cdx * s; this.pushY += p.cdy * s; }
      if (p.kind === 'spring') {
        P.air = p.air || 0.8; const sp = p.pow / P.air;
        P.launch = { vx: Math.cos(p.dir) * sp, vy: Math.sin(p.dir) * sp };
        Sound.play('pop'); Sound.play('dash'); this.cam.shake = 5;
        this.burst(p.x, p.y, 12, '#ffd43b', P.r * 3, P.r * 0.1);
      }
      if (p.kind === 'ice') this.onIce = true;
    } else if (!p && !air) {
      P.falling = 0.7; P.vx *= 0.2; P.vy *= 0.2; P.inv = Math.max(P.inv, 0.8);
      Sound.play('lose'); this.cam.shake = 6;
    }
  }
  respawnFall() {
    const P = this.P;
    P.x = this.checkpoint.x; P.y = this.checkpoint.y; P.vx = P.vy = 0;
    P.r = Math.max(this.minR, P.r * 0.95); P.rd = P.r;
    P.inv = 1.5; P.dashT = 0; P.air = 0; P.launch = null; P.dashCD = 0;
    this.stats.falls = (this.stats.falls || 0) + 1;
    this.toast('Никита упал в шахту! Обратно к чекпоинту (−5%)', '#ffa8a8', 2.2);
    if (this.def.onFall) this.def.onFall(this);
  }
  drawPlats(ctx, view, z, t) {
    // тени
    for (const p of this.plats) {
      if (p.gone) continue;
      const bx = p.shape === 'circ' ? p.x - p.r : p.x, by = p.shape === 'circ' ? p.y - p.r : p.y, bw = p.shape === 'circ' ? p.r * 2 : p.w, bh = p.shape === 'circ' ? p.r * 2 : p.h;
      if (bx > view.x + view.w + 200 || bx + bw < view.x - 200 || by > view.y + view.h + 200 || by + bh < view.y - 200) continue;
      const d = Math.min(bw, bh) * 0.12 + 30;
      ctx.fillStyle = 'rgba(0,0,0,0.45)';
      if (p.shape === 'circ') { ctx.beginPath(); ctx.arc(p.x + d * 0.5, p.y + d, p.r, 0, TAU); ctx.fill(); }
      else ctx.fillRect(bx + d * 0.5, by + d, bw, bh);
    }
    for (const p of this.plats) {
      const bx = p.shape === 'circ' ? p.x - p.r : p.x, by = p.shape === 'circ' ? p.y - p.r : p.y, bw = p.shape === 'circ' ? p.r * 2 : p.w, bh = p.shape === 'circ' ? p.r * 2 : p.h;
      if (bx > view.x + view.w || bx + bw < view.x || by > view.y + view.h || by + bh < view.y) continue;
      PlatDraw(ctx, p, z, t, this);
    }
  }

  updateProjs(dt) {
    const P = this.P;
    for (const p of this.projs) {
      p.life -= dt; p.t = (p.t || 0) + dt;
      if (p.homing) {
        const a = U.angle(p.x, p.y, P.x, P.y), cur = Math.atan2(p.vy, p.vx), sp = Math.hypot(p.vx, p.vy);
        const na = cur + U.clamp(U.angDiff(cur, a), -p.homing * dt, p.homing * dt);
        p.vx = Math.cos(na) * sp; p.vy = Math.sin(na) * sp;
      }
      p.x += p.vx * dt; p.y += p.vy * dt;
      if (p.trail && Math.random() < 0.5) this.part('dot', p.x, p.y, 0, 0, p.r * 0.5, p.trail, 0.4);
      // стены
      if (!p.noWall) for (const w of this.wallsNear(p.x, p.y, p.r)) if (this.wallBlocks(w, false) && U.circleRect(p.x, p.y, p.r, w.x, w.y, w.w, w.h)) { p.life = 0; break; }
      if (!this.inWorld(p.x, p.y)) p.life = 0;
      // Никита
      const d = U.dist(p.x, p.y, P.x, P.y);
      if (p.life > 0 && d < P.r + p.r) {
        if (p.edible === true && p.r <= P.r * EAT) { p.life = 0; this.score += 5; Sound.play('eat', 0.2); P.chomp = 1; this.burst(p.x, p.y, 4, p.col || '#fff', P.r, p.r * 0.5); }
        else {
          p.life = 0;
          if (p.eff === 'stun') this.stunPlayer(p.stunT || 1.4);
          else if (p.eff === 'slow') { if (P.pw.shield <= 0) { P.slow = 3; this.toast('Липкая жижа! Никита замедлен', '#94d82d', 1.2); } }
          else if (p.eff === 'freeze') { if (P.pw.shield <= 0) { P.freeze = 2.5; Sound.play('freeze'); this.toast('Заморозка!', '#a5d8ff', 1.2); } }
          if (p.hz) this.hurt(p.hz, p.x - p.vx, p.y - p.vy, 'proj');
        }
      }
      if (p.life <= 0 && p.onEnd) p.onEnd(this, p);
    }
    this.projs = this.projs.filter(p => p.life > 0);
  }
  shoot(x, y, ang, speed, o) {
    const p = Object.assign({ x, y, vx: Math.cos(ang) * speed, vy: Math.sin(ang) * speed, r: 5, life: 4, k: 'ball', col: '#fff', hz: 0.06 }, o);
    this.projs.push(p);
    return p;
  }

  updateLasers(dt) {
    const P = this.P;
    for (const l of this.lasers) {
      l.t = (l.t || 0) + dt;
      if (l.period) { const cyc = l.period[0] + l.period[1]; l.on = ((l.t + (l.phase || 0)) % cyc) < l.period[0]; }
      if (l.rotate) { l.a += l.rotate.spd * dt; l.x1 = l.rotate.cx; l.y1 = l.rotate.cy; l.x2 = l.rotate.cx + Math.cos(l.a) * l.rotate.len; l.y2 = l.rotate.cy + Math.sin(l.a) * l.rotate.len; }
      if (l.follow) { const f = this.byId[l.follow]; if (!f || f.dead) l.on = false; }
      if (!l.on) continue;
      if (l.safeR && P.r >= l.safeR) continue;
      const d = U.segDist(P.x, P.y, l.x1, l.y1, l.x2, l.y2);
      if (d < P.r + (l.w || 4)) { this.hurt(l.hz || 0.1, P.x - (l.y2 - l.y1) * 0.01, P.y + (l.x2 - l.x1) * 0.01, 'laser'); Sound.play('laser'); }
    }
  }
  updateWarns(dt) {
    for (const w of this.warns) { w.t += dt; if (w.t >= w.dur && !w.done) { w.done = true; if (w.cb) w.cb(this, w); } }
    this.warns = this.warns.filter(w => !w.done);
  }
  updateDoors(dt) {
    let changed = false;
    for (const w of this.walls) if (w.door && w.door.opening && w.door.open < 1) { w.door.open = Math.min(1, w.door.open + dt * 1.5); changed = true; }
    if (changed) this.wallsDirty = true;
  }

  // Подсыпаем еды подходящего размера, чтобы не застрять
  respawn(dt) {
    const def = this.def;
    if (!def.respawn || !def.respawn.length) return;
    this.respT = (this.respT || 0) - dt;
    if (this.respT > 0) return;
    this.respT = 0.9;
    const P = this.P;
    const R = Math.hypot(this.viewW || 1000, this.viewH || 1000) * 0.55;
    let n = 0;
    const R2 = R * 1.7;
    for (const it of this.items) {
      if (it.dead || !this.canEat(it) || it.r < P.r * 0.22) continue;
      if (Math.abs(it.x - P.x) < R2 && Math.abs(it.y - P.y) < R2) n++;
      if (n >= 18) return;
    }
    const lo = P.r * 0.3, hi = P.r * 0.85;
    const opts = def.respawn.filter(o => o[1] < hi && o[2] > lo);
    if (!opts.length) return;
    for (let k = 0; k < 4; k++) {
      const o = U.pick(opts);
      const r = U.rand(Math.max(lo, o[1]), Math.min(hi, o[2]));
      for (let tries = 0; tries < 8; tries++) {
        const a = Math.random() * TAU, d = R * (1.05 + Math.random() * 0.6);
        const x = P.x + Math.cos(a) * d, y = P.y + Math.sin(a) * d;
        if (!this.inWorld(x, y, r)) continue;
        if (this.wallsNear(x, y, r).some(w => this.wallBlocks(w, false) && U.circleRect(x, y, r, w.x, w.y, w.w, w.h))) continue;
        if (o[4] && !o[4](x, y, this, r)) continue;
        if (this.def.pit && !this.platAt(x, y, -r, true)) continue;
        const T = TYPES[o[0]] || {};
        this.spawn(o[0], x, y, r, Object.assign({ v: T.vN ? U.randInt(0, T.vN - 1) : 0 }, o[3] || {}));
        break;
      }
    }
  }

  updateParts(dt) {
    for (const p of this.parts) {
      p.life -= dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= 0.94; p.vy *= 0.94; p.rot += dt * 3;
      if (p.grav) p.vy += p.grav * dt;
    }
    this.parts = this.parts.filter(p => p.life > 0);
    for (const f of this.floats) f.t += dt;
    this.floats = this.floats.filter(f => f.t < 1.1);
  }

  updateCamera(dt, input) {
    const cam = this.cam, P = this.P;
    const sw = input.sw, sh = input.sh;
    const minDim = Math.min(sw, sh);
    let tz = (minDim * (this.def.camFrac || 0.05)) / P.rd;
    const wd = this.def.world;
    const fitZ = Math.max(sw / this.W, sh / this.H);
    if (!this.def.noClamp) tz = Math.max(tz, fitZ * 1.0);
    if (!cam.init) { cam.zoom = tz; cam.x = P.x; cam.y = P.y; cam.init = true; }
    cam.zoom = Math.exp(U.damp(Math.log(cam.zoom), Math.log(tz), 2.2, dt));
    // небольшое опережение по направлению движения
    const lead = P.r * 1.5;
    const tx = P.x + Math.cos(P.dir) * lead * P.spd01, ty = P.y + Math.sin(P.dir) * lead * P.spd01;
    cam.x = U.damp(cam.x, tx, 6, dt); cam.y = U.damp(cam.y, ty, 6, dt);
    this.viewW = sw / cam.zoom; this.viewH = sh / cam.zoom;
    if (!this.def.noClamp) {
      if (this.viewW < this.W) cam.x = U.clamp(cam.x, this.viewW / 2, this.W - this.viewW / 2); else cam.x = this.W / 2;
      if (this.viewH < this.H) cam.y = U.clamp(cam.y, this.viewH / 2, this.H - this.viewH / 2); else cam.y = this.H / 2;
    }
    cam.shake = Math.max(0, cam.shake - dt * 30);
    cam.sx = (Math.random() - 0.5) * cam.shake; cam.sy = (Math.random() - 0.5) * cam.shake;
  }

  // ============================================================
  //  РЕНДЕР МИРА
  // ============================================================
  render(ctx, sw, sh, t) {
    const cam = this.cam, z = cam.zoom;
    const view = { x: cam.x - sw / 2 / z, y: cam.y - sh / 2 / z, w: sw / z, h: sh / z };
    this.view = view;
    const bgs = LevelBG[this.def.bg];
    if (bgs && bgs.screen) bgs.screen(ctx, this, sw, sh, t);
    ctx.save();
    ctx.translate(sw / 2 + cam.sx, sh / 2 + cam.sy);
    ctx.scale(z, z);
    ctx.translate(-cam.x, -cam.y);
    ctx.lineJoin = 'round'; ctx.lineCap = 'round';
    // фон
    const bgf = LevelBG[this.def.bg] || LevelBG.plain;
    if (typeof bgf === 'function') bgf(ctx, this, view, z, t);
    else {
      bgf.world(ctx, this, view, z, t);
    }
    if (this.floor.length) BG.drawFloor(ctx, this.floor, view, z, t);
    if (this.plats.length) this.drawPlats(ctx, view, z, t);
    if (this.def.drawUnder) this.def.drawUnder(ctx, this, view, z, t);
    this.drawZones(ctx, view, z, t);
    this.drawTriggers(ctx, view, z, t);
    // предметы
    const P = this.P;
    const margin = 1.5;
    for (const it of this.items) {
      if (it.dead || it.hidden) continue;
      const rr = it.r * margin * (it.drawScale || 1);
      if (it.x + rr < view.x || it.x - rr > view.x + view.w || it.y + rr < view.y || it.y - rr > view.y + view.h) continue;
      this.drawItem(ctx, it, z, t);
    }
    for (const e of this.eating) {
      const k = e.t / 0.2, it = e.it;
      const x = U.lerp(e.sx, P.x, U.ease.inQuad(k)), y = U.lerp(e.sy, P.y + P.r * 0.4, U.ease.inQuad(k));
      ctx.save(); ctx.globalAlpha = 1 - k * 0.5;
      const sc = 1 - k * 0.85;
      if (it.draw) { ctx.translate(x, y); ctx.scale(sc, sc); ctx.translate(-it.x, -it.y); it.draw(ctx, it, t, z, this); }
      else Sprites.draw(ctx, it.spr || it.t, it.v, x, y, it.r * sc, it.rot + k * 3, z);
      ctx.restore();
    }
    this.drawWalls(ctx, view, z, t);
    this.drawLasers(ctx, view, z, t);
    this.drawWarns(ctx, z, t);
    this.drawProjs(ctx, z, t);
    // Никита
    const blinkHide = P.inv > 0 && Math.floor(t * 20) % 2 === 0 && P.hurtT < 0;
    let lift = 0, pscale = 1;
    if (this.def.pit) {
      if (P.falling > 0) { pscale = Math.max(0.05, P.falling / 0.7); }
      else if (P.air > 0 && P.launch) { lift = Math.sin(Math.PI * (1 - P.air / 0.8)) * P.r * 1.2; }
      else if (P.dashT > 0) { lift = Math.sin(Math.PI * (1 - P.dashT / 0.38)) * P.r * 0.7; }
      if (lift > 0) { ctx.save(); ctx.globalAlpha = 0.35; ell(ctx, P.x, P.y + P.r * 0.3, P.r * 0.9, P.r * 0.5, 0, '#000', null); ctx.restore(); }
    }
    if (pscale < 1) { ctx.save(); ctx.translate(P.x, P.y); ctx.rotate((1 - pscale) * 6); ctx.scale(pscale, pscale); ctx.translate(-P.x, -P.y); }
    if (!blinkHide) Chars.nikita(ctx, P.x, P.y - lift, P.rd * (1 + lift / (P.r * 6)), { t, chomp: P.chomp, dir: P.dir, speed: P.spd01, tint: P.color ? PAINT[P.color] : null, hurt: P.hurtT > 0, stun: P.stun > 0, shield: P.pw.shield > 0, dash: P.dashT > 0 });
    if (pscale < 1) ctx.restore();
    if (P.stun > 0) { ctx.save(); ctx.globalAlpha = 0.8; ctx.strokeStyle = '#e8c35c'; ctx.lineWidth = P.r * 0.06; for (let i = -3; i <= 3; i++) { ctx.beginPath(); ctx.moveTo(P.x + i * P.r * 0.3 - P.r, P.y - P.r); ctx.lineTo(P.x + i * P.r * 0.3 + P.r, P.y + P.r); ctx.stroke(); ctx.beginPath(); ctx.moveTo(P.x + i * P.r * 0.3 + P.r, P.y - P.r); ctx.lineTo(P.x + i * P.r * 0.3 - P.r, P.y + P.r); ctx.stroke(); } ctx.restore(); }
    if (P.freeze > 0) { ctx.save(); ctx.globalAlpha = 0.45; circ(ctx, P.x, P.y, P.rd * 1.05, '#a5d8ff', '#e7f5ff', P.r * 0.06); ctx.restore(); }
    if (this.def.drawOver) this.def.drawOver(ctx, this, view, z, t);
    this.drawParts(ctx, z, t);
    this.drawSays(ctx, z, t);
    ctx.restore();
    if (this.def.dark) this.drawDark(ctx, sw, sh, z, t);
  }

  drawItem(ctx, it, z, t) {
    if (it.draw) { it.draw(ctx, it, t, z, this); }
    else {
      let rot = it.rot;
      let x = it.x, y = it.y;
      if (it.bob) y += Math.sin(t * 3 + it.uid) * it.r * 0.1;
      if (it.wob) rot += Math.sin(t * 2 + it.uid) * 0.15;
      if (it.spin) rot = it.rot + t * it.spin;
      if (it.glow) { ctx.save(); ctx.globalAlpha = 0.3 + 0.15 * Math.sin(t * 4 + it.uid); circ(ctx, x, y, it.r * 1.5, it.glow, null); ctx.restore(); }
      Sprites.draw(ctx, it.spr || it.t, it.v, x, y, it.r * (it.drawScale || 1), rot, z);
    }
    if (it.flash > 0) { ctx.save(); ctx.globalAlpha = it.flash * 2; circ(ctx, it.x, it.y, it.r * 1.08, null, '#ff4d4d', Math.max(2 / z, it.r * 0.08)); ctx.restore(); }
  }

  drawWalls(ctx, view, z, t) {
    for (const w of this.walls) {
      if (w.dead) continue;
      if (w.x > view.x + view.w || w.x + w.w < view.x || w.y > view.y + view.h || w.y + w.h < view.y) continue;
      if (w.gate) { this.drawGate(ctx, w, z, t); continue; }
      let x = w.x, y = w.y, ww = w.w, hh = w.h;
      if (w.door) {
        const o = U.ease.inOutCubic(w.door.open || 0);
        if (o >= 1) continue;
        if (ww >= hh) { ww = w.w * (1 - o) / 2; this.drawWallRect(ctx, w, x, y, ww, hh, z, t); this.drawWallRect(ctx, w, x + w.w - ww, y, ww, hh, z, t); }
        else { hh = w.h * (1 - o) / 2; this.drawWallRect(ctx, w, x, y, ww, hh, z, t); this.drawWallRect(ctx, w, x, y + w.h - hh, ww, hh, z, t); }
        continue;
      }
      this.drawWallRect(ctx, w, x, y, ww, hh, z, t);
    }
  }
  drawWallRect(ctx, w, x, y, ww, hh, z, t) {
    const lw = Math.max(2 / z, Math.min(ww, hh) * 0.08);
    if (w.door) {
      const col = w.door.need && w.door.need.startsWith('key:') ? PAINT[w.door.need.slice(4)] : w.door.col || '#868e96';
      ctx.fillStyle = U.shade(col, -0.25); ctx.fillRect(x, y, ww, hh);
      ctx.save(); ctx.beginPath(); ctx.rect(x, y, ww, hh); ctx.clip();
      ctx.strokeStyle = U.shade(col, 0.3); ctx.lineWidth = Math.min(ww, hh) * 0.25;
      const s = Math.min(ww, hh) * 0.9;
      for (let k = -Math.max(ww, hh); k < Math.max(ww, hh) * 2; k += s * 1.5) { ctx.beginPath(); ctx.moveTo(x + k, y); ctx.lineTo(x + k - hh, y + hh); ctx.stroke(); }
      ctx.restore();
      ctx.strokeStyle = OL; ctx.lineWidth = lw; ctx.strokeRect(x, y, ww, hh);
      if (w.door.need && w.door.need.startsWith('key:') && ww > 0 && hh > 0) {
        const cx = w.x + w.w / 2, cy = w.y + w.h / 2, s2 = Math.min(w.w, w.h) * 0.7;
        if (U.pointInRect(cx, cy, x - 1, y - 1, ww + 2, hh + 2)) { rect(ctx, cx - s2 / 2, cy - s2 * 0.15, s2, s2 * 0.75, s2 * 0.1, '#ffd43b', OL, lw * 0.7); ctx.beginPath(); ctx.arc(cx, cy - s2 * 0.15, s2 * 0.3, Math.PI, 0); ctx.lineWidth = s2 * 0.12; ctx.strokeStyle = OL; ctx.stroke(); }
      }
      return;
    }
    const st = WALLSTYLE[w.style] || WALLSTYLE.lab;
    if (st.books) this.drawBooks(ctx, w, x, y, ww, hh, z);
    else {
      ctx.save(); ctx.beginPath(); ctx.rect(x, y, ww, hh); ctx.clip();
      BG.fillPattern(ctx, st.pat, st.T, x, y, ww, hh, z);
      if (w.ed && this.P.r >= w.ed * 0.85) { ctx.globalAlpha = 0.25 + 0.15 * Math.sin(t * 5); ctx.fillStyle = '#69db7c'; ctx.fillRect(x, y, ww, hh); }
      if (w.dash) { ctx.globalAlpha = 0.8; ctx.strokeStyle = '#1e1b2e'; ctx.lineWidth = Math.min(ww, hh) * 0.06; ctx.beginPath(); const cx = x + ww / 2, cy = y + hh / 2, m = Math.min(ww, hh) * 0.45; ctx.moveTo(cx - m, cy - m * 0.3); ctx.lineTo(cx - m * 0.2, cy + m * 0.1); ctx.lineTo(cx + m * 0.1, cy - m * 0.4); ctx.lineTo(cx + m * 0.5, cy + m * 0.4); ctx.stroke(); }
      ctx.restore();
    }
    ctx.strokeStyle = st.border; ctx.lineWidth = lw; ctx.strokeRect(x, y, ww, hh);
  }
  drawBooks(ctx, w, x, y, ww, hh, z) {
    ctx.fillStyle = '#5c3a1e'; ctx.fillRect(x, y, ww, hh);
    const horiz = ww >= hh, short = horiz ? hh : ww, long = horiz ? ww : hh;
    const s = short * 0.32;
    const v = this.view;
    const from = horiz ? Math.max(0, v.x - x) : Math.max(0, v.y - y), to = horiz ? Math.min(long, v.x + v.w - x) : Math.min(long, v.y + v.h - y);
    const i0 = Math.floor(from / s), i1 = Math.ceil(to / s);
    if (s * z < 1.5) { ctx.fillStyle = '#9c5a3c'; ctx.fillRect(x + short * 0.06, y + short * 0.06, ww - short * 0.12, hh - short * 0.12); return; }
    for (let i = i0; i < i1; i++) {
      const h = ((i * 7919 + w.uid * 31) % 97) / 97;
      const col = PAL.bright[(i * 3 + w.uid) % 7];
      const len = short * (0.7 + h * 0.25);
      if (horiz) { ctx.fillStyle = U.shade(col, -0.15); ctx.fillRect(x + i * s + 1, y + short - len - short * 0.04, s - 2, len); ctx.fillStyle = 'rgba(255,255,255,0.35)'; ctx.fillRect(x + i * s + s * 0.3, y + short - len * 0.8, s * 0.2, len * 0.5); }
      else { ctx.fillStyle = U.shade(col, -0.15); ctx.fillRect(x + short * 0.04, y + i * s + 1, len, s - 2); ctx.fillStyle = 'rgba(255,255,255,0.35)'; ctx.fillRect(x + len * 0.2, y + i * s + s * 0.3, len * 0.5, s * 0.2); }
    }
  }
  drawGate(ctx, w, z, t) {
    const col = PAINT[w.gate];
    const pass = this.P.color === w.gate;
    ctx.save();
    ctx.globalAlpha = pass ? 0.25 : 0.55 + 0.1 * Math.sin(t * 3);
    ctx.fillStyle = col; ctx.fillRect(w.x, w.y, w.w, w.h);
    ctx.globalAlpha = pass ? 0.3 : 0.8;
    ctx.beginPath(); ctx.rect(w.x, w.y, w.w, w.h); ctx.clip();
    ctx.strokeStyle = '#fff'; ctx.lineWidth = Math.min(w.w, w.h) * 0.15;
    const L = Math.max(w.w, w.h), off = (t * 60) % (L * 0.5);
    for (let k = -L; k < L * 2; k += L * 0.25) { ctx.beginPath(); ctx.moveTo(w.x + k + off, w.y); ctx.lineTo(w.x + k + off - w.h, w.y + w.h); ctx.stroke(); }
    ctx.restore();
    ctx.strokeStyle = U.shade(col, -0.4); ctx.lineWidth = Math.max(2 / z, Math.min(w.w, w.h) * 0.1); ctx.strokeRect(w.x, w.y, w.w, w.h);
  }

  drawZones(ctx, view, z, t) {
    for (const zn of this.zones) {
      const bx = zn.shape === 'circ' ? zn.x - zn.r : zn.x, by = zn.shape === 'circ' ? zn.y - zn.r : zn.y;
      const bw = zn.shape === 'circ' ? zn.r * 2 : zn.w, bh = zn.shape === 'circ' ? zn.r * 2 : zn.h;
      if (bx > view.x + view.w || bx + bw < view.x || by > view.y + view.h || by + bh < view.y) continue;
      ZoneDraw[zn.k] && ZoneDraw[zn.k](ctx, zn, z, t, this);
    }
  }
  drawTriggers(ctx, view, z, t) {
    for (const tr of this.triggers) {
      if (tr.hidden) continue;
      if (tr.x + tr.r * 2 < view.x || tr.x - tr.r * 2 > view.x + view.w || tr.y + tr.r * 2 < view.y || tr.y - tr.r * 2 > view.y + view.h) continue;
      TrigDraw[tr.k] && TrigDraw[tr.k](ctx, tr, z, t, this);
    }
  }
  drawLasers(ctx, view, z, t) {
    for (const l of this.lasers) {
      const w = l.w || 4;
      // эмиттеры
      for (const [x, y] of [[l.x1, l.y1], [l.x2, l.y2]]) if (!l.noEmit) { circ(ctx, x, y, w * 2.2, '#343a40', OL, w * 0.5); circ(ctx, x, y, w * 1.1, l.on ? (l.col || '#ff3b3b') : '#555', null); }
      if (!l.on) { ctx.save(); ctx.globalAlpha = 0.2; ctx.setLineDash([w * 2, w * 3]); line(ctx, l.x1, l.y1, l.x2, l.y2, l.col || '#ff3b3b', w * 0.5); ctx.restore(); continue; }
      const col = l.col || '#ff3b3b';
      ctx.save();
      ctx.globalAlpha = 0.35; line(ctx, l.x1, l.y1, l.x2, l.y2, col, w * 3.2 + Math.sin(t * 30) * w * 0.5);
      ctx.globalAlpha = 1; line(ctx, l.x1, l.y1, l.x2, l.y2, col, w * 1.4); line(ctx, l.x1, l.y1, l.x2, l.y2, '#fff', w * 0.5);
      ctx.restore();
    }
  }
  drawWarns(ctx, z, t) {
    for (const w of this.warns) {
      const k = U.clamp(w.t / w.dur, 0, 1);
      ctx.save();
      ctx.globalAlpha = 0.18 + 0.12 * Math.sin(t * 20);
      circ(ctx, w.x, w.y, w.r, w.col, null);
      ctx.globalAlpha = 0.5; circ(ctx, w.x, w.y, w.r * k, w.col, null);
      ctx.globalAlpha = 0.9; circ(ctx, w.x, w.y, w.r, null, w.col, Math.max(2 / z, w.r * 0.05));
      if (w.label) { ctx.fillStyle = '#fff'; ctx.font = `900 ${w.r * 0.5}px sans-serif`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(w.label, w.x, w.y); }
      ctx.restore();
    }
  }
  drawProjs(ctx, z, t) {
    for (const p of this.projs) ProjDraw[p.k] ? ProjDraw[p.k](ctx, p, z, t) : circ(ctx, p.x, p.y, p.r, p.col, OL, p.r * 0.2);
  }
  drawParts(ctx, z, t) {
    for (const p of this.parts) {
      const a = U.clamp(p.life / p.max, 0, 1);
      ctx.globalAlpha = a;
      if (p.k === 'dot') { ctx.fillStyle = p.col; ctx.beginPath(); ctx.arc(p.x, p.y, Math.max(p.s * (0.4 + a * 0.6), 0.5 / z), 0, TAU); ctx.fill(); }
      else if (p.k === 'ring') { ctx.strokeStyle = p.col; ctx.lineWidth = p.s * 0.15 * a + 1 / z; ctx.beginPath(); ctx.arc(p.x, p.y, p.s * (1 + (1 - a) * 3), 0, TAU); ctx.stroke(); }
      else if (p.k === 'star') { ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot); U.starPath(ctx, 0, 0, 5, p.s, p.s * 0.45); ctx.fillStyle = p.col; ctx.fill(); ctx.restore(); }
      else if (p.k === 'smoke') { ctx.fillStyle = p.col; ctx.beginPath(); ctx.arc(p.x, p.y, p.s * (1.6 - a * 0.6), 0, TAU); ctx.fill(); }
    }
    ctx.globalAlpha = 1;
    for (const f of this.floats) {
      const k = f.t / 1.1;
      ctx.save(); ctx.globalAlpha = 1 - k * k;
      const px = 18 / z * f.size;
      ctx.font = `900 ${px}px Rubik, sans-serif`; ctx.textAlign = 'center';
      ctx.lineWidth = px * 0.2; ctx.strokeStyle = OL; ctx.strokeText(f.text, f.x, f.y - k * px * 2.5);
      ctx.fillStyle = f.col; ctx.fillText(f.text, f.x, f.y - k * px * 2.5);
      ctx.restore();
    }
  }
  drawSays(ctx, z, t) {
    for (const it of this.items) {
      if (!it.say || it.dead) continue;
      const v = this.view;
      if (it.x < v.x - 50 / z || it.x > v.x + v.w + 50 / z || it.y < v.y || it.y > v.y + v.h + 200 / z) continue;
      const px = 15 / z;
      ctx.save();
      ctx.font = `700 ${px}px Rubik, sans-serif`;
      const lines = U.wrapText(ctx, it.say.text, 220 / z);

  drawRadio(ctx, L, sw, sh, t, sc) {

  drawMinimap(ctx, L, sw, sh, t, sc) {
    const maxS = (sw < 700 ? 110 : 170) * sc;

    const mw = asp >= 1 ? maxS : maxS * asp, mh = asp >= 1 ? maxS / asp : maxS;

    const k = mw / L.W;

      const cv = L.mmCv || document.createElement('canvas');
      cv.width = Math.ceil(mw); cv.height = Math.ceil(mh);
      const c = cv.getContext('2d');
      c.clearRect(0, 0, cv.width, cv.height);

      for (const z of L.zones) { const col = { lava: '#ff6b00', paint: PAINT[z.color], current: 'rgba(116,192,252,0.6)', conveyor: '#495057', ice: '#d0ebff', slow: '#94d82d', water: '#1971c2' }[z.k]; if (!col) continue; c.fillStyle = col; if (z.shape === 'circ') { c.beginPath(); c.arc(z.x * k, z.y * k, Math.max(1.5, z.r * k), 0, TAU); c.fill(); } else c.fillRect(z.x * k, z.y * k, Math.max(1, z.w * k), Math.max(1, z.h * k)); }
      for (const p of L.plats) {
        c.fillStyle = p.kind === 'crumble' ? '#a0522d' : p.kind === 'conveyor' ? '#495057' : p.path ? 'rgba(255,212,59,0.35)' : '#adb5bd';
        if (p.shape === 'circ') { c.beginPath(); c.arc(p.x * k, p.y * k, Math.max(2, p.r * k), 0, TAU); c.fillStyle = '#ffd43b'; c.fill(); }
        else if (p.path) { const x0 = Math.min(p.path[0][0], p.path[1][0]), y0 = Math.min(p.path[0][1], p.path[1][1]); c.fillRect(x0 * k, y0 * k, (Math.abs(p.path[1][0] - p.path[0][0]) + p.w) * k, (Math.abs(p.path[1][1] - p.path[0][1]) + p.h) * k); }
        else c.fillRect(p.x * k, p.y * k, Math.max(1, p.w * k), Math.max(1, p.h * k));
      }
      for (const w of L.walls) {
        if (w.dead) continue;
        if (w.door && w.door.open >= 1) continue;
        c.fillStyle = w.gate ? PAINT[w.gate] : w.door ? (w.door.need && w.door.need.startsWith('key:') ? PAINT[w.door.need.slice(4)] : '#adb5bd') : '#e9ecef';
        c.fillRect(w.x * k, w.y * k, Math.max(1, w.w * k), Math.max(1, w.h * k));
      }

    }
    this.panel(ctx, mx - 6, my - 6, mw + 12, mh + 12, 10);
    ctx.drawImage(L.mmCv, mx, my);
    // важные объекты
    for (const it of L.items) {
      if (it.dead) continue;
      let col = it.mm;
      if (!col && it.key) col = PAINT[it.key];
      if (!col && it.boss) col = '#ff4d4d';
      if (!col && it.who) col = CH[it.who] ? CH[it.who].color : '#fff';
      if (!col) continue;
      circ(ctx, mx + it.x * k, my + it.y * k, Math.max(2.5 * sc, it.r * k), col, OL, 1);
    }
    for (const tr of L.triggers) { if (tr.k === 'plate' || tr.k === 'button' || tr.k === 'hold' || tr.k === 'simon') circ(ctx, mx + tr.x * k, my + tr.y * k, 2.5 * sc, tr.active || tr.done || tr.state === 'done' ? '#69db7c' : '#ffd43b', null); if (tr.k === 'portal') circ(ctx, mx + tr.x * k, my + tr.y * k, 3 * sc, '#b197fc', null); }

const LEVELS = [];

function inPoly(x, y, p) {
  let c = false;
  for (let i = 0, j = p.length - 2; i < p.length; j = i, i += 2) {
    const xi = p[i], yi = p[i + 1], xj = p[j], yj = p[j + 1];
    if (((yi > y) !== (yj > y)) && (x < (xj - xi) * (y - yi) / (yj - yi) + xi)) c = !c;
  }
  return c;
}
// Цепочка круглых зон вдоль ломаной (реки лавы, течения)
function chainZones(b, k, pts, r, o = {}, gapAt = []) {
  const out = [];
  for (let i = 0; i < pts.length - 2; i += 2) {
    const x1 = pts[i], y1 = pts[i + 1], x2 = pts[i + 2], y2 = pts[i + 3];
    const L = U.dist(x1, y1, x2, y2), n = Math.max(1, Math.ceil(L / (r * 0.9)));
    for (let s = 0; s < n; s++) {
      const t = s / n, x = U.lerp(x1, x2, t), y = U.lerp(y1, y2, t);
      if (gapAt.some(g => U.dist(g[0], g[1], x, y) < g[2])) continue;
      out.push(b.zone(k, { x, y, r: r * (0.9 + 0.2 * Math.sin(x * 0.01 + y * 0.013)) }, Object.assign({}, o)));
    }
  }
  return out;
}
// Капля / колба / снаряд с неба с предупреждением
function skyDrop(L, x, y, R, dur, kind, opts = {}) {
  L.warn(x, y, R, dur, (L2, w) => {

    if (kind === 'ice') L2.zones.push({ k: 'ice', shape: 'circ', x: w.x, y: w.y, r: w.r, life: opts.life || 7 });
    if (U.dist(w.x, w.y, L2.P.x, L2.P.y) < w.r * 0.8 && opts.dmg) L2.hurt(opts.dmg, w.x, w.y, 'drop');
  }, opts.col || '#3bc9db', opts.label || '');
}
function nearPlayer(L, spread = 3) {
  const P = L.P;

    if (L.inWorld(x, y, P.r)) return [x, y];
  }
  return [P.x, P.y];
}

    if (c < cols - 1 && !vis[c + 1][r]) nb.push([c + 1, r]);
    if (r > 0 && !vis[c][r - 1]) nb.push([c, r - 1]);
    if (r < rows - 1 && !vis[c][r + 1]) nb.push([c, r + 1]);
    if (!nb.length) { stack.pop(); continue; }

// ============================================================
//  Движок комиксов
// ============================================================
const Comic = {
  pages: null, pi: 0, t: 0, onDone: null, trans: 0, prevPage: null, lastChars: 0,
  start(id, onDone) {
    this.pages = COMICS[id] || [];
    this.pi = 0; this.t = 0; this.onDone = onDone; this.trans = 0; this.prevPage = null;
    if (!this.pages.length) { onDone && onDone(); return; }
    this.schedule(this.pages[0]);
  },
  schedule(pg) {
    let t = 0.25;
    for (const p of pg.panels) {
      p._at = t;
      let bt = t + 0.5;
      for (const b of (p.bubbles || [])) { b._at = bt + (b.d || 0); b._dur = b.text.length / 42; bt = b._at + b._dur + 0.4; }
      if (p.title) { bt = t + 1.4; }
      p._done = Math.max(bt, t + 0.9);
      t = p._done + 0.1;
    }
    pg._end = t;
  },
  click() {
    if (!this.pages) return;
    const pg = this.pages[this.pi];
    if (this.trans > 0) return;
    if (this.t < pg._end - 0.05) {
      const next = pg.panels.find(p => p._at > this.t + 0.01);
      const cur = pg.panels.filter(p => p._at <= this.t).pop();
      if (cur && this.t < cur._done - 0.05) this.t = cur._done;
      else this.t = next ? next._at : pg._end;
      Sound.play('click');
      return;
    }
    this.nextPage();
  },
  nextPage() {
    Sound.play('page');
    if (this.pi + 1 >= this.pages.length) { const cb = this.onDone; this.pages = null; cb && cb(); return; }
    this.prevPage = { pg: this.pages[this.pi], t: this.t };
    this.pi++; this.t = 0; this.trans = 1;
    this.schedule(this.pages[this.pi]);
  },
  skip() { Sound.play('page'); const cb = this.onDone; this.pages = null; cb && cb(); },
  update(dt) {
    if (!this.pages) return;
    if (this.trans > 0) { this.trans = Math.max(0, this.trans - dt * 1.8); if (this.trans > 0.5) return; }
    this.t += dt;
  },

  pageRect(sw, sh) {
    const m = Math.min(sw, sh) * 0.04;
    let w = sw - m * 2, h = sh - m * 2 - 30;
    this.portrait = sh > sw * 1.15;
    if (this.portrait) return { x: m, y: m, w, h: h - 10 };
    const asp = 16 / 10;
    if (w / h > asp) w = h * asp; else h = w / asp;
    return { x: (sw - w) / 2, y: (sh - h) / 2 - 10, w, h };
  },
  // В портретном режиме панели выстраиваются столбиком
  panelRects(pg, R) {
    const gut = Math.min(R.w, R.h) * 0.018;
    if (!this.portrait) return pg.panels.map(p => { const [px, py, pw, ph] = p.rect; return { x: R.x + px * R.w + gut / 2, y: R.y + py * R.h + gut / 2, w: pw * R.w - gut, h: ph * R.h - gut }; });
    const hs = pg.panels.map(p => R.w * (p.rect[3] * 10) / (p.rect[2] * 16));
    const tot = hs.reduce((a, b) => a + b, 0);
    const k = Math.min(1.25, (R.h - gut * pg.panels.length) / tot);
    let y = R.y + Math.max(0, (R.h - tot * k - gut * pg.panels.length) / 2);
    return hs.map(h => { const r = { x: R.x + gut / 2, y, w: R.w - gut, h: h * k }; y += h * k + gut; return r; });
  },
  draw(ctx, sw, sh, gt) {
    // фон «стол с бумагой»
    const g = ctx.createLinearGradient(0, 0, sw, sh); g.addColorStop(0, '#2b1d4a'); g.addColorStop(1, '#14102b'); ctx.fillStyle = g; ctx.fillRect(0, 0, sw, sh);
    BG.skyStars(ctx, 0, 0, sw, sh, gt);
    if (!this.pages) return;
    const R = this.pageRect(sw, sh);
    const tr = this.trans;
    if (this.prevPage && tr > 0) {
      const k = U.ease.inCubic(1 - tr);
      ctx.save(); ctx.translate(R.x + R.w / 2, R.y + R.h / 2); ctx.rotate(-k * 0.5); ctx.scale(1 - k * 0.4, 1 - k * 0.4); ctx.translate(-k * sw * 0.8, k * sh * 0.2); ctx.globalAlpha = 1 - k;
      this.drawPage(ctx, this.prevPage.pg, { x: -R.w / 2, y: -R.h / 2, w: R.w, h: R.h }, this.prevPage.t, gt);
      ctx.restore();
    }
    if (tr < 0.6) {
      const k = U.ease.outBack(U.clamp(1 - tr / 0.6, 0, 1));
      ctx.save(); ctx.translate(R.x + R.w / 2, R.y + R.h / 2); ctx.rotate((1 - k) * 0.25); ctx.scale(0.7 + k * 0.3, 0.7 + k * 0.3); ctx.translate((1 - k) * sw * 0.5, 0); ctx.globalAlpha = U.clamp(k * 1.5, 0, 1);
      this.drawPage(ctx, this.pages[this.pi], { x: -R.w / 2, y: -R.h / 2, w: R.w, h: R.h }, this.t, gt);
      ctx.restore();
    }
    // подсказки
    const pg = this.pages[this.pi];
    const fs = U.clamp(Math.min(sh * 0.022, sw * 0.03), 11, 18);
    const small = sw < 640;
    ctx.save();
    if (this.t >= pg._end && tr === 0) {
      const a = 0.6 + 0.4 * Math.sin(gt * 5);
      ctx.globalAlpha = a;
      HUD.text(ctx, (this.pi + 1 >= this.pages.length ? 'Играть ▶' : 'Дальше ▶') + (small ? '' : '  (клик / пробел)'), R.x + R.w, R.y + R.h + fs * 1.6, fs * 1.15, '#ffe066', 'right');
    }
    ctx.globalAlpha = 0.8;
    HUD.text(ctx, small ? 'Пропустить ⏭' : 'Пропустить ⏭ (Esc)', R.x, R.y + R.h + fs * 1.6, fs, '#b8b5ff', 'left', OL, 700);
    HUD.text(ctx, (this.pi + 1) + ' / ' + this.pages.length, R.x + R.w / 2, R.y + R.h + fs * 1.6, fs, '#b8b5ff', 'center', OL, 700);
    ctx.restore();
    this.skipRect = { x: R.x, y: R.y + R.h + fs * 0.3, w: small ? 110 : 200, h: fs * 2.2 };
    // звук печати
    let chars = 0;
    for (const p of pg.panels) for (const b of (p.bubbles || [])) chars += U.clamp(Math.floor((this.t - b._at) * 42), 0, b.text.length);
    if (chars > this.lastChars && Math.random() < 0.5) Sound.play('type');
    this.lastChars = chars;
  },

  drawPage(ctx, pg, R, t, gt) {
    // бумага
    ctx.save();
    ctx.shadowColor = 'rgba(0,0,0,0.5)'; ctx.shadowBlur = 30; ctx.shadowOffsetY = 10;
    ctx.fillStyle = '#fdf6e3'; ctx.fillRect(R.x - 12, R.y - 12, R.w + 24, R.h + 24);
    ctx.restore();
    const rects = this.panelRects(pg, R);
    pg.panels.forEach((p, i) => {
      if (t < p._at) return;
      const k = U.clamp((t - p._at) / 0.5, 0, 1);
      this.drawPanel(ctx, p, rects[i], t - p._at, k, gt);
    });
  },

  drawPanel(ctx, p, r, lt, k, gt) {
    ctx.save();
    const e = U.ease.outBack(k);
    const cx = r.x + r.w / 2, cy = r.y + r.h / 2;
    switch (p.enter || 'zoom') {
      case 'left': ctx.translate(-(1 - e) * r.w * 0.6, 0); break;
      case 'right': ctx.translate((1 - e) * r.w * 0.6, 0); break;
      case 'top': ctx.translate(0, -(1 - e) * r.h * 0.6); break;
      case 'bottom': ctx.translate(0, (1 - e) * r.h * 0.6); break;
      case 'zoom': ctx.translate(cx, cy); ctx.scale(0.3 + 0.7 * e, 0.3 + 0.7 * e); ctx.rotate((1 - e) * 0.2); ctx.translate(-cx, -cy); break;
      case 'fade': break;
    }
    ctx.globalAlpha = U.clamp(k * 2, 0, 1);
    let shake = 0;
    if (p.fx && p.fx.includes('shake')) shake = Math.max(0, 1 - lt * 0.8) * r.h * 0.02 + r.h * 0.003;
    if (shake) ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
    // тень и рамка
    ctx.save(); ctx.shadowColor = 'rgba(0,0,0,0.35)'; ctx.shadowBlur = 8; ctx.shadowOffsetX = 4; ctx.shadowOffsetY = 4; ctx.fillStyle = '#fff'; ctx.fillRect(r.x, r.y, r.w, r.h); ctx.restore();
    ctx.save();
    ctx.beginPath(); ctx.rect(r.x, r.y, r.w, r.h); ctx.clip();
    // лёгкий «кен бёрнс»
    const kb = 1 + Math.min(lt, 12) * 0.004;
    ctx.translate(cx, cy); ctx.scale(kb, kb); ctx.translate(-cx, -cy);
    const bgf = BG.panel[p.bg || 'plain'] || BG.panel.plain;
    bgf(ctx, r.x, r.y, r.w, r.h, gt + lt, p.bgCol);
    if (p.fx && p.fx.includes('boom')) { const s = Math.min(1, lt * 2.5); ctx.save(); ctx.translate(cx, cy); ctx.rotate(lt * 0.5); U.starPath(ctx, 0, 0, 14, r.h * 0.45 * s, r.h * 0.25 * s); fs(ctx, '#ffd43b', OL, 4); U.starPath(ctx, 0, 0, 12, r.h * 0.28 * s, r.h * 0.15 * s); fs(ctx, '#ff6b00', null); ctx.restore(); }
    if (p.fx && p.fx.includes('smoke')) { for (let i = 0; i < 6; i++) { const kk = ((lt * 0.2 + i / 6) % 1); ctx.save(); ctx.globalAlpha = 0.4 * (1 - kk); circ(ctx, r.x + r.w * (0.2 + i * 0.12), r.y + r.h * (0.8 - kk * 0.7), r.h * (0.08 + kk * 0.1), '#495057', null); ctx.restore(); } }
    // реквизит
    for (const pr of (p.props || [])) this.drawProp(ctx, pr, r, lt, gt);
    // персонажи
    (p.actors || []).forEach((a, i) => this.drawActor(ctx, a, i, p, r, lt, gt));
    // заголовок главы
    if (p.title) this.drawTitle(ctx, p, r, lt, gt);
    // эффекты
    if (p.fx) {
      if (p.fx.includes('sparkle')) for (let i = 0; i < 14; i++) { const ph = (gt * 1.5 + i * 0.37) % 1; const x = r.x + r.w * ((i * 0.618) % 1), y = r.y + r.h * ((i * 0.381 + 0.1) % 1); ctx.save(); ctx.globalAlpha = Math.sin(ph * Math.PI); ctx.translate(x, y); ctx.rotate(gt); U.starPath(ctx, 0, 0, 4, r.h * 0.03, r.h * 0.008); fs(ctx, '#fff', null); ctx.restore(); }
      if (p.fx.includes('confetti')) for (let i = 0; i < 30; i++) { const y = r.y + ((gt * 0.15 * r.h + i * 47) % r.h); const x = r.x + r.w * ((i * 0.618) % 1) + Math.sin(gt * 2 + i) * 10; ctx.save(); ctx.translate(x, y); ctx.rotate(gt * 3 + i); ctx.fillStyle = PAL.bright[i % 7]; ctx.fillRect(-4, -2, 8, 4); ctx.restore(); }
      if (p.fx.includes('flash')) { const a = Math.max(0, 1 - lt * 1.5); if (a > 0) { ctx.fillStyle = `rgba(255,255,255,${a})`; ctx.fillRect(r.x, r.y, r.w, r.h); } }
    }
    ctx.restore();
    // пузыри поверх (без клипа — могут выходить за край)

    ctx.lineWidth = Math.max(3, r.h * 0.012); ctx.strokeStyle = OL; ctx.strokeRect(r.x, r.y, r.w, r.h);

  },

  animOffset(o, r, lt, gt, idx) {
    const d = { x: 0, y: 0, s: 1, rot: 0 };
    const at = lt - (o.d || 0);
    switch (o.anim) {
      case 'bob': d.y = Math.sin(gt * 3 + idx) * r.h * 0.012; break;
      case 'jump': d.y = -Math.abs(Math.sin(gt * 5 + idx)) * r.h * 0.05; break;
      case 'shake': d.x = (Math.random() - 0.5) * r.h * 0.012; d.y = (Math.random() - 0.5) * r.h * 0.006; break;
      case 'float': d.y = Math.sin(gt * 1.5 + idx) * r.h * 0.02; d.rot = Math.sin(gt + idx) * 0.08; break;
      case 'grow': d.s = U.ease.outElastic(U.clamp(at / 1, 0, 1)); break;
      case 'shrink': d.s = 1 - 0.75 * U.ease.inOutCubic(U.clamp(at / 2.2, 0, 1)); break;
      case 'spin': d.rot = gt * 3; break;
      case 'fly': { const k = U.clamp(at / 2.5, 0, 1); d.x = (o.dx || 1) * r.w * 0.45 * U.ease.outCubic(k); d.y = (o.dy || 0) * r.h * 0.45 * U.ease.outCubic(k); d.rot = at * 4; break; }
      case 'slideL': d.x = -(1 - U.ease.outBack(U.clamp(at / 0.6, 0, 1))) * r.w * 0.7; break;

  },
  drawActor(ctx, a, i, p, r, lt, gt) {

    if (a.who === 'blob') {
      const rr = a.s * r.h * d.s;
      ctx.save(); ctx.translate(x, y); ctx.rotate(d.rot);
      Chars.nikita(ctx, 0, 0, rr, { t: gt, chomp: a.chomp ? Math.abs(Math.sin(gt * 4)) : 0, dir: 0, speed: 0 });

    }
    const sc = r.h * 0.72 * (a.s || 1) / 100 * d.s;
    ctx.save(); ctx.translate(x, y); ctx.rotate(d.rot);
    Chars.draw(ctx, a.who, { x: 0, y: 0, scale: sc, t: gt + i * 1.3, pose: a.pose || 'stand', expr: a.expr || 'normal', flip: a.flip, talking, accName: a.accName, blush: a.blush });
    ctx.restore();
  },
  drawProp(ctx, pr, r, lt, gt) {
    const d = this.animOffset(pr, r, lt, gt, 3);
    const x = r.x + pr.x * r.w + d.x, y = r.y + pr.y * r.h + d.y, s = pr.s * r.h * d.s;
    ctx.save();
    if (pr.glow) { const g = ctx.createRadialGradient(x, y, 0, x, y, s * 2.5); g.addColorStop(0, U.rgba(pr.glow, 0.8)); g.addColorStop(1, U.rgba(pr.glow, 0)); ctx.fillStyle = g; ctx.fillRect(x - s * 3, y - s * 3, s * 6, s * 6); }

    if (pr.spr) Sprites.draw(ctx, pr.spr, pr.v || 0, x, y, s, (pr.rot || 0) + d.rot, 1);
    if (pr.item) {
      const fake = { x, y, r: s, rot: pr.rot || 0, heading: pr.rot !== undefined ? pr.rot : -Math.PI / 2, data: { st: 'roam', brush: gt * 10, tur: -Math.PI / 2 + Math.sin(gt) * 0.3, aim: Math.sin(gt) }, cone: { a: Math.PI / 2 + Math.sin(gt) * 0.5, w: 0.4, len: s * 4 }, uid: 1 };
      const fakeL = { canEat: () => false, flags: {} };
      if (pr.item === 'vacuum') Draws.vacuum(ctx, fake, gt, 1, fakeL);
      if (pr.item === 'tank') { fake.heading = 0; Draws.tank(ctx, fake, gt, 1, fakeL); }
      if (pr.item === 'jeep') Draws.jeep(ctx, Object.assign(fake, { rot: 0 }), gt, 1);
      if (pr.item === 'sub') Draws.sub(ctx, Object.assign(fake, { rot: Math.sin(gt) * 0.1 }), gt, 1);

  drawTitle(ctx, p, r, lt, gt) {

    if (p.sub) HUD.text(ctx, p.sub, 0, -big * 0.95, big * 0.42, '#fff', 'center', OL, 900);
    HUD.text(ctx, p.title, 0, big * 0.35, big, '#fff', 'center', OL, 900);
    ctx.restore();

      const a = U.clamp((lt - 0.8) * 2, 0, 1);

  },
  drawBubble(ctx, b, p, r, t, gt) {
    if (t < b._at) return;
    const lt = t - b._at;
    const n = U.clamp(Math.floor(lt * 42), 0, b.text.length);
    const pop = U.ease.outBack(U.clamp(lt / 0.25, 0, 1));

    const th = lines.length * fsz * 1.22 + fsz * 0.9;
    let bx, by;
    if (b.type === 'caption') { bx = r.x + (b.bx || 0.03) * r.w; by = r.y + (b.by || 0.04) * r.h; }
    else { bx = r.x + b.bx * r.w - tw / 2; by = r.y + b.by * r.h - th / 2; }

      rect(ctx, bx, by, tw, th, 4, '#fff3a3', OL, lw);
    } else if (b.type === 'shout') {
      ctx.beginPath();
      const N = 22;
      for (let i = 0; i <= N; i++) { const a = i / N * TAU; const rr = i % 2 ? 1.0 : 1.22; const px = ccx + Math.cos(a) * tw * 0.6 * rr, py = ccy + Math.sin(a) * th * 0.68 * rr; i ? ctx.lineTo(px, py) : ctx.moveTo(px, py); }
      ctx.closePath(); fs(ctx, '#fff', OL, lw);
      this.tail(ctx, ccx, ccy, ax, ay, tw, th, lw, '#fff');
    } else if (b.type === 'thought') {
      blob(ctx, ccx, ccy, Math.max(tw, th) * 0.6, 12, 0.08, 1, '#fff', OL, lw);
    } else {
      if (b.type === 'radio') { rect(ctx, bx, by, tw, th, fsz * 0.3, '#e7f5ff', OL, lw); }
      else rect(ctx, bx, by, tw, th, fsz * 0.8, '#fff', OL, lw);
      if (b.type === 'whisper') { ctx.save(); ctx.setLineDash([lw * 2, lw * 2]); ctx.strokeStyle = '#868e96'; ctx.lineWidth = lw * 0.6; U.roundRect(ctx, bx + lw * 2, by + lw * 2, tw - lw * 4, th - lw * 4, fsz * 0.6); ctx.stroke(); ctx.restore(); }
      if (b.type !== 'radio') this.tail(ctx, ccx, ccy, ax, ay, tw, th, lw, '#fff');
      else HUD.text(ctx, '📻', bx + tw - fsz * 0.2, by + fsz * 0.2, fsz * 0.8, '#000', 'right', null, 400);
    }
    ctx.fillStyle = OL; ctx.textAlign = b.type === 'caption' ? 'left' : 'center'; ctx.textBaseline = 'top';
    ctx.font = font;
    let left = n;
    lines.forEach((l, i) => {
      const part = l.slice(0, Math.max(0, left)); left -= l.length + 1;
      const x = b.type === 'caption' ? bx + fsz * 0.6 : ccx;
      ctx.fillText(part, x, by + fsz * 0.45 + i * fsz * 1.22);
    });
    ctx.restore();
  },
  tail(ctx, cx, cy, ax, ay, tw, th, lw, col) {
    const dx = ax - cx, dy = ay - cy;
    const d = Math.hypot(dx, dy);
    if (d < Math.min(tw, th) * 0.55) return;
    const a = Math.atan2(dy, dx);
    // точка выхода из пузыря
    const ex = cx + Math.cos(a) * tw * 0.35, ey = cy + Math.sin(a) * th * 0.35;
    const w = Math.min(tw, th) * 0.18;
    const px = -Math.sin(a) * w, py = Math.cos(a) * w;
    const tx = ax - Math.cos(a) * th * 0.1, ty = ay - Math.sin(a) * th * 0.1;
    ctx.beginPath(); ctx.moveTo(ex + px, ey + py); ctx.quadraticCurveTo((ex + tx) / 2 + px * 0.3, (ey + ty) / 2 + py * 0.3, tx, ty); ctx.lineTo(ex - px, ey - py); ctx.closePath();
    fs(ctx, col, OL, lw);
    // закрываем шов
    ctx.beginPath(); ctx.moveTo(ex + px * 0.85, ey + py * 0.85); ctx.lineTo(ex - px * 0.85, ey - py * 0.85); ctx.lineWidth = lw * 1.6; ctx.strokeStyle = col; ctx.stroke();
  },
};

  <script>
'use strict';
// ============================================================
//  ИНТЕРФЕЙС: главное меню, выбор уровня, фото Никиты, помощь,

// ============================================================
const LEVEL_ICONS = ['coccus', 'flask', 'keycard', 'gear', 'car', 'rat', 'minitank', 'fish', 'volcano', 'earthp', 'saturn', 'brainbot'];
const LEVEL_ICON_V = [0, 1, 'yellow', 1, 0, 0, 0, 0, 0, 0, 0, 0];
const COMIC_FOR = ['intro', 'table', 'corridors', 'workshop', 'city', 'sewer', 'base', 'ocean', 'volcano', 'earth', 'space', 'final'];

const UI = {
  buttons: [], hover: null,
  btn(ctx, id, x, y, w, h, label, o = {}) {
    const hov = Game.input.mx >= x && Game.input.mx <= x + w && Game.input.my >= y && Game.input.my <= y + h;
    if (hov && !o.disabled) this.hover = id;
    const k = hov && !o.disabled ? 1.05 : 1;
    ctx.save();
    ctx.translate(x + w / 2, y + h / 2); ctx.scale(k, k);
    const col = o.disabled ? '#495057' : (o.col || '#9b5cff');
    rect(ctx, -w / 2, -h / 2 + 5, w, h, h * 0.3, U.shade(col, -0.45), null);
    rect(ctx, -w / 2, -h / 2, w, h, h * 0.3, lg(ctx, 0, -h / 2, 0, h / 2, [U.shade(col, 0.25), col]), OL, 3);
    HUD.text(ctx, label, 0, h * 0.13, (o.fs || h * 0.42), o.disabled ? '#aaa' : '#fff', 'center');
    ctx.restore();
    this.buttons.push({ id, x, y, w, h, disabled: o.disabled, cb: o.cb });
  },
  clickAt(x, y) {
    for (let i = this.buttons.length - 1; i >= 0; i--) {
      const b = this.buttons[i];
      if (!b.disabled && x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h) { Sound.play('select'); if (b.cb) b.cb(); return true; }
    }
    return false;
  },
  begin() { this.buttons = []; this.hover = null; },

  // ---------------- главное меню ----------------
  menu(ctx, sw, sh, t) {
    const g = ctx.createRadialGradient(sw * 0.35, sh * 0.45, 0, sw * 0.5, sh * 0.5, Math.max(sw, sh));
    g.addColorStop(0, '#5b2a9e'); g.addColorStop(0.6, '#24124a'); g.addColorStop(1, '#0d0820');
    ctx.fillStyle = g; ctx.fillRect(0, 0, sw, sh);
    BG.skyStars(ctx, 0, 0, sw, sh, t);
    const sc = Math.min(sw, sh) / 800;
    // летящая в рот еда
    const nx = sw * (sw > sh ? 0.3 : 0.5), ny = sh * (sw > sh ? 0.55 : 0.42), nr = Math.min(sw, sh) * 0.17;
    const foods = ['donut', 'pizza', 'car', 'fish', 'building', 'earthp', 'flask', 'gear', 'shawarma', 'saturn', 'coccus', 'tree', 'bus', 'microscope'];
    let chomp = 0;

      const ph = (t * 0.22 + i / 9) % 1;

      const x = U.lerp(sx, nx, U.ease.inQuad(ph)), y = U.lerp(sy, ny + nr * 0.4, U.ease.inQuad(ph));
      const s = nr * 0.28 * (1 - ph * 0.7);
      if (ph > 0.9) chomp = Math.max(chomp, (ph - 0.9) * 10);
      Sprites.draw(ctx, foods[(i + Math.floor(t * 0.22 + i / 9)) % foods.length], i % 4, x, y, s, t * (i % 2 ? 1 : -1), 1);

    for (let i = 0; i < title.length; i++) {
      const ch = title[i], w = ctx.measureText(ch).width;
      ctx.save(); ctx.translate(cx + w / 2, ty + Math.sin(t * 3 + i * 0.6) * fsz * 0.06); ctx.rotate(Math.sin(t * 2 + i) * 0.06);
      HUD.text(ctx, ch, 0, 0, fsz, ['#ff6bd6', '#ffd43b', '#69db7c', '#4dabf7', '#ff922b', '#b197fc'][i % 6], 'center');
      ctx.restore();
      cx += w;
    }
    HUD.text(ctx, 'ЕСТ ВСЁ', tx, ty + fsz * 0.85, fsz * 0.55, '#fff', 'center');
    HUD.text(ctx, 'Учёные НИИ «Мозгоправ» против бесконечного аппетита', tx, ty + fsz * 1.3, Math.max(12, fsz * 0.17), '#d0bfff', 'center', OL, 700);
    // кнопки
    const bw = Math.min(320 * sc * 1.1, sw * 0.8), bh = Math.max(44, 58 * sc);

    if (sw <= sh) by = sh * 0.66;
    const save = Game.save;
    const cont = save.unlocked > 0;
    this.btn(ctx, 'play', bx, by, bw, bh, cont ? '▶ Продолжить' : '▶ Играть', { col: '#ff6bd6', cb: () => Game.startLevel(Math.min(save.unlocked, LEVELS.length - 1)) });
    by += bh * 1.22;
    this.btn(ctx, 'levels', bx, by, bw, bh, '🗺 Выбор уровня', { col: '#4dabf7', cb: () => Game.go('levels') });
    by += bh * 1.22;
    this.btn(ctx, 'photo', bx, by, bw * 0.48, bh, '📷 Фото', { col: '#20c997', fs: bh * 0.36, cb: () => Game.go('photo') });
    this.btn(ctx, 'help', bx + bw * 0.52, by, bw * 0.48, bh, '❓ Как играть', { col: '#ff922b', fs: Math.min(bh * 0.32, bw * 0.055), cb: () => Game.go('help') });
    by += bh * 1.22;
    this.btn(ctx, 'sound', bx, by, bw * 0.48, bh * 0.8, Game.save.settings.mute ? '🔇 Звук' : '🔊 Звук', { col: '#868e96', fs: bh * 0.3, cb: () => Game.toggleMute() });
    this.btn(ctx, 'credits', bx + bw * 0.52, by, bw * 0.48, bh * 0.8, '🎬 Титры', { col: '#868e96', fs: bh * 0.3, cb: () => Game.go('credits') });
    if (document.fullscreenEnabled || document.webkitFullscreenEnabled) this.btn(ctx, 'fs', sw - 64, 14, 50, 50, '⛶', { col: '#495057', fs: 26, cb: () => Game.toggleFullscreen() });
    // учёные внизу
    if (sw > sh) {
      const who = ['egor', 'danya', 'pylypyuk', 'dima', 'kirill', 'natasha', 'molgelevich'];
      const sp = sw * 0.09;
      who.forEach((w, i) => {
        const x = sw * 0.06 + i * sp * 0.62 + (i > 5 ? sp * 0.2 : 0), y = sh * 0.98;
        Chars.draw(ctx, w, { x, y, scale: sh * 0.0016 * (w === 'molgelevich' ? 1.1 : 1), t: t + i, expr: w === 'molgelevich' ? 'evil' : w === 'kirill' ? 'crazy' : 'determined', pose: i % 2 ? 'point' : 'stand', flip: false });
      });
    }
    if (!Chars.photoCanvas) HUD.text(ctx, '💡 Вставь фото Никиты: кнопка «Фото» или файл assets/nikita.jpg', sw / 2, sh - 10, Math.max(11, 13 * sc), '#ffe066', 'center', OL, 700);
  },

  // ---------------- выбор уровня ----------------
  levels(ctx, sw, sh, t) {
    const g = ctx.createLinearGradient(0, 0, 0, sh); g.addColorStop(0, '#1b1440'); g.addColorStop(1, '#3b1d6b'); ctx.fillStyle = g; ctx.fillRect(0, 0, sw, sh);
    BG.skyStars(ctx, 0, 0, sw, sh, t);
    const sc = Math.min(sw, sh) / 800;
    HUD.text(ctx, 'КАРТА ПОХОЖДЕНИЙ НИКИТЫ', sw / 2, 52 * sc, 36 * sc, '#ffd43b', 'center');

      const best = Game.save.best[L.id];
      const hov = !locked && U.dist(Game.input.mx, Game.input.my, x, y) < R * 1.1;
      const k = hov ? 1.1 + Math.sin(t * 8) * 0.02 : 1;
      ctx.save(); ctx.translate(x, y); ctx.scale(k, k);
      if (L.chapter !== chap) { chap = L.chapter; }
      const medalCol = best ? ['#ffd43b', '#dee2e6', '#e8a35a'][best.medal] : null;
      circ(ctx, 0, 6, R, 'rgba(0,0,0,0.35)', null);
      circ(ctx, 0, 0, R, locked ? '#343a40' : rg(ctx, 0, 0, R, ['#b197fc', '#7048e8', '#3b1d8f']), medalCol || OL, medalCol ? R * 0.12 : 3);
      if (!locked) Sprites.draw(ctx, LEVEL_ICONS[i], LEVEL_ICON_V[i], 0, -R * 0.05, R * 0.6, Math.sin(t * 2 + i) * 0.15, 1);
      else HUD.text(ctx, '🔒', 0, R * 0.25, R * 0.7, '#fff', 'center', null);
      HUD.text(ctx, String(i + 1), -R * 0.75, -R * 0.6, R * 0.38, '#ffd43b', 'center');
      ctx.restore();
      HUD.text(ctx, L.name, x, y + R + 18 * sc, Math.max(11, 15 * sc), locked ? '#777' : '#fff', 'center', OL, 800);
      if (L.mech) HUD.text(ctx, L.mech.icon + ' ' + L.mech.name, x, y + R + 35 * sc, Math.max(10, 12 * sc), locked ? '#666' : '#ffd43b', 'center', OL, 800);
      if (best) HUD.text(ctx, '⏱ ' + U.formatTime(best.time) + '  ★ ' + best.score.toLocaleString('ru-RU'), x, y + R + 51 * sc, Math.max(10, 12 * sc), '#d0bfff', 'center', OL, 700);
      this.buttons.push({ id: 'lv' + i, x: x - R, y: y - R, w: R * 2, h: R * 2, disabled: locked, cb: () => Game.startLevel(i) });
      if (hov) {
        ctx.save();
        const tw = Math.min(380 * sc, sw * 0.8);
        const tx = U.clamp(x - tw / 2, 10, sw - tw - 10), ty = y - R - 90 * sc < 70 * sc ? y + R + 50 * sc : y - R - 90 * sc;
        rect(ctx, tx, ty, tw, 88 * sc, 12, 'rgba(20,18,40,0.94)', '#ffd43b', 2);
        HUD.text(ctx, L.chapter + (L.mech ? '   ·   ' + L.mech.icon + ' ' + L.mech.name : ''), tx + 12, ty + 22 * sc, 12 * sc, '#ffd43b', 'left', null, 800);
        ctx.font = `700 ${12 * sc}px ${FONT}`;
        U.wrapText(ctx, L.mech ? L.mech.text : L.desc, tw - 24).slice(0, 3).forEach((ln, j) => HUD.text(ctx, ln, tx + 12, ty + (42 + j * 16) * sc, 12 * sc, '#fff', 'left', null, 700));
        ctx.restore();
      }
    }
    const bh = Math.max(40, 50 * sc);
    this.btn(ctx, 'back', 20 * sc, sh - bh - 20 * sc, 200 * sc, bh, '◀ Меню', { col: '#868e96', cb: () => Game.go('menu') });
    if (Game.save.unlocked < LEVELS.length - 1) this.btn(ctx, 'unlockall', sw - 240 * sc, sh - bh - 20 * sc, 220 * sc, bh, '🔓 Открыть все', { col: '#495057', fs: bh * 0.32, cb: () => { Game.save.unlocked = LEVELS.length - 1; Game.store(); } });
  },

  // ---------------- фото Никиты ----------------
  photo(ctx, sw, sh, t) {
    const g = ctx.createLinearGradient(0, 0, sw, sh); g.addColorStop(0, '#0b3d3a'); g.addColorStop(1, '#14102b'); ctx.fillStyle = g; ctx.fillRect(0, 0, sw, sh);
    const sc = Math.min(sw, sh) / 800;
    HUD.text(ctx, 'ЛИЦО НИКИТЫ', sw / 2, 56 * sc, 38 * sc, '#69db7c', 'center');
    const R = Math.min(sw, sh) * 0.22;
    const cx = sw / 2, cy = sh * 0.42;
    // превью: слизень и голова
    Chars.nikita(ctx, cx - R * 1.6, cy, R * 0.75, { t, chomp: Math.abs(Math.sin(t * 2)) * 0.5 });
    circ(ctx, cx + R * 0.3, cy, R + 6, '#fff', null);
    ctx.save(); ctx.beginPath(); ctx.arc(cx + R * 0.3, cy, R, 0, TAU); ctx.clip();
    if (Chars.photo) {
      const img = Chars.photo, iw = img.naturalWidth || img.width, ih = img.naturalHeight || img.height;
      const base = (R * 2) / Math.min(iw, ih) * Chars.crop.s;
      const w = iw * base, h = ih * base;
      ctx.drawImage(img, cx + R * 0.3 - w / 2 + Chars.crop.x * R * 2, cy - h / 2 + Chars.crop.y * R * 2, w, h);
    } else { Chars.face(ctx, cx + R * 0.3, cy, R, 'happy', t); }
    ctx.restore();
    circ(ctx, cx + R * 0.3, cy, R, null, OL, 5);
    Chars.draw(ctx, 'nikita', { x: cx + R * 1.95, y: cy + R, scale: R * 0.016, t, expr: 'happy', pose: 'wave' });
    this.photoArea = { x: cx + R * 0.3, y: cy, r: R };
    const fsz = Math.max(12, 15 * sc);
    const lines = Chars.photo ? ['Тяни фото мышкой/пальцем, чтобы сдвинуть. Колёсико или кнопки +/− — масштаб.'] : ['Фото ещё нет. Загрузи его кнопкой ниже —', 'или положи файл в папку игры: assets/nikita.jpg (или .png)'];
    lines.forEach((l, i) => HUD.text(ctx, l, sw / 2, cy + R + 40 * sc + i * fsz * 1.4, fsz, '#fff', 'center', OL, 700));
    const bh = Math.max(42, 52 * sc), bw = Math.min(260 * sc, sw * 0.42);
    const by = sh - bh * 2.6;
    this.btn(ctx, 'upload', sw / 2 - bw - 10, by, bw, bh, '📁 Загрузить фото', { col: '#20c997', fs: bh * 0.34, cb: () => document.getElementById('photoInput').click() });
    this.btn(ctx, 'zin', sw / 2 + 10, by, bh, bh, '+', { col: '#4dabf7', cb: () => { Chars.crop.s = Math.min(5, Chars.crop.s * 1.12); Chars.renderPhoto(); } });
    this.btn(ctx, 'zout', sw / 2 + 20 + bh, by, bh, bh, '−', { col: '#4dabf7', cb: () => { Chars.crop.s = Math.max(0.5, Chars.crop.s / 1.12); Chars.renderPhoto(); } });
    this.btn(ctx, 'reset', sw / 2 + 30 + bh * 2, by, bh * 1.8, bh, 'Сброс', { col: '#868e96', fs: bh * 0.32, cb: () => { Chars.crop = { x: 0, y: 0, s: 1 }; Chars.renderPhoto(); } });
    this.btn(ctx, 'save', sw / 2 - bw - 10, by + bh * 1.25, bw, bh, '✔ Готово', { col: '#9b5cff', cb: () => { Game.savePhoto(); Game.go('menu'); } });
    if (Game.save.photoData) this.btn(ctx, 'del', sw / 2 + 10, by + bh * 1.25, bw, bh, '🗑 Убрать фото', { col: '#c92a2a', fs: bh * 0.32, cb: () => { Game.save.photoData = null; Game.store(); Chars.photo = null; Chars.photoCanvas = null; Game.loadAssetPhoto(); } });
  },

  // ---------------- помощь ----------------
  help(ctx, sw, sh, t) {
    ctx.fillStyle = '#16122e'; ctx.fillRect(0, 0, sw, sh);
    const sc = Math.min(sw, sh) / 800;
    HUD.text(ctx, 'КАК ИГРАТЬ', sw / 2, 52 * sc, 36 * sc, '#ffd43b', 'center');
    const items = [
      ['🖱', 'Мышь — Никита ползёт за курсором. Можно и WASD / стрелки. На телефоне — веди пальцем.'],
      ['⚡', 'ПРОБЕЛ, Shift или правая кнопка мыши — РЫВОК (двойной тап на телефоне). Разбивает треснувшие стены и бьёт боссов.'],
      ['😋', 'Ешь всё, что МЕНЬШЕ тебя. Чем больше съел — тем больше стал. Большие предметы сначала не по зубам.'],
      ['💥', 'Шипы, лазеры, лава, сетки и укусы уменьшают Никиту. Ранят на минимальном размере — растёт шкала поимки!'],
      ['🗺', 'У каждой карты своя механика: классика, краски, лабиринт, паркур, светофоры, стелс, сапёр, плавание, извержение, обстрел, гравитация и босс.'],
      ['🦘', 'Паркур: вокруг пропасть — ПРОБЕЛ = прыжок. Лабиринт: карта открывается там, где ты был, ключ-карты лежат в тупиках.'],
      ['🌶', 'Бонусы: перец — скорость, магнит — еда летит к тебе, щит — защита, гриб — рост, пирожок от Наташи.'],
      ['🏅', 'Медали за время: золото, серебро, бронза. Комбо за быстрое поедание дают больше очков.'],
      ['⌨', 'Esc / P — пауза. M — мини-карта. Между уровнями — комиксы (клик — дальше, Esc — пропустить).'],
    ];
    const fsz = Math.max(12, Math.min(17 * sc, sw * 0.022));
    let y = 100 * sc;
    const x = Math.max(20, sw * 0.12), w = sw - x * 2;
    ctx.font = `700 ${fsz}px ${FONT}`;
    for (const [ic, tx] of items) {
      const lines = U.wrapText(ctx, tx, w - fsz * 3);
      HUD.text(ctx, ic, x, y + fsz, fsz * 1.6, '#fff', 'left', null, 400);
      lines.forEach((l, i) => HUD.text(ctx, l, x + fsz * 2.6, y + fsz * 0.9 + i * fsz * 1.35, fsz, '#fff', 'left', null, 700));
      y += Math.max(fsz * 2.2, lines.length * fsz * 1.35 + fsz * 0.9);
    }
    const bh = Math.max(40, 50 * sc);
    this.btn(ctx, 'back', sw / 2 - 110 * sc, sh - bh - 20 * sc, 220 * sc, bh, '◀ Понятно!', { col: '#9b5cff', cb: () => Game.go('menu') });
  },

  // ---------------- пауза ----------------
  pause(ctx, sw, sh, t) {
    ctx.fillStyle = 'rgba(10,8,25,0.86)'; ctx.fillRect(0, 0, sw, sh);
    const sc = Math.min(sw, sh) / 800;
    HUD.text(ctx, 'ПАУЗА', sw / 2, sh * 0.25, 54 * sc, '#ffd43b', 'center');
    const L = Game.world;
    if (L) {
      const objs = L.objectives.map(o => (o.done ? '✔ ' : '• ') + o.text).join('   ');
      HUD.text(ctx, L.def.name + ' — ' + objs, sw / 2, sh * 0.25 + 40 * sc, Math.max(12, 15 * sc), '#fff', 'center', OL, 700);
      if (L.def.mech) HUD.text(ctx, 'Механика: ' + L.def.mech.icon + ' ' + L.def.mech.name + ' — ' + L.def.mech.text, sw / 2, sh * 0.25 + 64 * sc, Math.max(11, 13 * sc), '#ffd43b', 'center', OL, 700);
    }
    const bw = Math.min(300 * sc, sw * 0.7), bh = Math.max(44, 54 * sc);
    let y = sh * 0.38;
    this.btn(ctx, 'resume', sw / 2 - bw / 2, y, bw, bh, '▶ Продолжить', { col: '#ff6bd6', cb: () => Game.resume() }); y += bh * 1.25;
    this.btn(ctx, 'restart', sw / 2 - bw / 2, y, bw, bh, '↻ Заново', { col: '#4dabf7', cb: () => Game.playLevel(Game.levelIdx) }); y += bh * 1.25;
    this.btn(ctx, 'mute', sw / 2 - bw / 2, y, bw * 0.62, bh, Game.save.settings.mute ? '🔇 Звук выкл' : '🔊 Звук вкл', { col: '#868e96', fs: bh * 0.36, cb: () => Game.toggleMute() });
    this.btn(ctx, 'fs2', sw / 2 - bw / 2 + bw * 0.66, y, bw * 0.34, bh, '⛶', { col: '#868e96', cb: () => Game.toggleFullscreen() }); y += bh * 1.25;
    this.btn(ctx, 'tomenu', sw / 2 - bw / 2, y, bw, bh, '⌂ В меню', { col: '#495057', cb: () => Game.go('menu') });
  },

  // ---------------- результаты ----------------
  results(ctx, sw, sh, t) {
    const R = Game.result;
    const g = ctx.createRadialGradient(sw / 2, sh * 0.4, 0, sw / 2, sh / 2, Math.max(sw, sh) * 0.7);
    g.addColorStop(0, R.win ? '#5b2a9e' : '#5e1a1a'); g.addColorStop(1, '#0d0820'); ctx.fillStyle = g; ctx.fillRect(0, 0, sw, sh);
    BG.panel.sunburst(ctx, 0, 0, 0, 0, t);
    const sc = Math.min(sw, sh) / 800;
    const lt = t - R.t0;
    if (R.win) {
      // лучи
      ctx.save(); ctx.globalAlpha = 0.12; ctx.translate(sw / 2, sh * 0.32);
      for (let i = 0; i < 16; i++) { ctx.rotate(TAU / 16); poly(ctx, [0, 0, -40 * sc, -sh, 40 * sc, -sh], '#ffd43b', null); }
      ctx.restore();
      ctx.save(); ctx.translate(sw / 2, sh * 0.32); ctx.rotate(t * 0.3);
      ctx.restore();
      const k = U.ease.outElastic(U.clamp(lt / 1.2, 0, 1));
      ctx.save(); ctx.translate(sw / 2, sh * 0.13); ctx.scale(k, k);
      HUD.text(ctx, R.final ? 'ПОБЕДА!' : 'УРОВЕНЬ ПРОЙДЕН!', 0, 0, 44 * sc, '#ffd43b', 'center');
      ctx.restore();
      HUD.text(ctx, R.name, sw / 2, sh * 0.13 + 34 * sc, 18 * sc, '#d0bfff', 'center', OL, 700);
      // медаль
      const mk = U.ease.outBack(U.clamp((lt - 0.4) / 0.6, 0, 1));
      const mcol = ['#ffd43b', '#dee2e6', '#e8a35a'][R.medal];
      const mname = ['ЗОЛОТО', 'СЕРЕБРО', 'БРОНЗА'][R.medal];
      ctx.save(); ctx.translate(sw / 2, sh * 0.34); ctx.scale(mk, mk); ctx.rotate(Math.sin(t * 2) * 0.05);
      poly(ctx, [-30 * sc, -70 * sc, -10 * sc, -20 * sc, 10 * sc, -20 * sc, 30 * sc, -70 * sc], '#e03131');
      circ(ctx, 0, 0, 62 * sc, rg(ctx, 0, 0, 62 * sc, [U.shade(mcol, 0.5), mcol, U.shade(mcol, -0.35)]), OL, 4);
      U.starPath(ctx, 0, 0, 5, 36 * sc, 16 * sc); fs(ctx, U.shade(mcol, 0.35), U.shade(mcol, -0.4), 3);
      ctx.restore();
      HUD.text(ctx, mname, sw / 2, sh * 0.34 + 90 * sc, 24 * sc, mcol, 'center');
      const rows = [['Время', U.formatTime(R.time)], ['Очки', R.score.toLocaleString('ru-RU')], ['Съедено', R.eaten + ' шт.'], ['Размер', R.size]];
      rows.forEach(([a, b], i) => {
        const y = sh * 0.56 + i * 30 * sc;
        const a2 = U.clamp((lt - 0.8 - i * 0.15) * 3, 0, 1);
        ctx.save(); ctx.globalAlpha = a2;
        HUD.text(ctx, a, sw / 2 - 10, y, 20 * sc, '#d0bfff', 'right', OL, 700);
        HUD.text(ctx, b, sw / 2 + 10, y, 20 * sc, '#fff', 'left');
        ctx.restore();
      });
      if (R.record && lt > 1.6) HUD.text(ctx, '★ НОВЫЙ РЕКОРД! ★', sw / 2, sh * 0.56 - 30 * sc, 18 * sc * (1 + Math.sin(t * 8) * 0.05), '#ff6bd6', 'center');
      Chars.nikita(ctx, sw * 0.18, sh * 0.62, Math.min(sw, sh) * 0.12, { t, chomp: Math.abs(Math.sin(t * 4)), dir: 0 });
      const host = LEVELS[R.idx].host;
      if (sw > 700) Chars.draw(ctx, host, { x: sw * 0.83, y: sh * 0.85, scale: sh * 0.0035, t, expr: host === 'molgelevich' ? 'sad' : 'shock', pose: 'scared', flip: true });
    } else {
      const k = U.ease.outBack(U.clamp(lt / 0.8, 0, 1));
      ctx.save(); ctx.translate(sw / 2, sh * 0.25); ctx.scale(k, k);
      HUD.text(ctx, 'НИКИТУ ПОЙМАЛИ!', 0, 0, 44 * sc, '#ff6b6b', 'center');
      ctx.restore();
      HUD.text(ctx, 'Но ни одна банка не удержит голодного Никиту. Попробуй ещё раз!', sw / 2, sh * 0.25 + 40 * sc, 16 * sc, '#fff', 'center', OL, 700);
      Chars.nikita(ctx, sw / 2, sh * 0.47, Math.min(sw, sh) * 0.12, { t, hurt: Math.sin(t * 4) > 0.8, stun: true });
      ctx.save(); ctx.globalAlpha = 0.45; rect(ctx, sw / 2 - Math.min(sw, sh) * 0.16, sh * 0.47 - Math.min(sw, sh) * 0.18, Math.min(sw, sh) * 0.32, Math.min(sw, sh) * 0.32, 20, '#a5d8ff', '#fff', 4); ctx.restore();
    }
    const bw = Math.min(240 * sc, sw * 0.28), bh = Math.max(44, 54 * sc), y = sh - bh - 34 * sc;
    if (lt > 0.8) {
      if (R.win) {
        this.btn(ctx, 'next', sw / 2 + bw * 0.55, y, bw, bh, R.final ? 'Финал ▶' : 'Дальше ▶', { col: '#ff6bd6', cb: () => Game.next() });
        this.btn(ctx, 'retry', sw / 2 - bw * 0.5, y, bw, bh, '↻ Ещё раз', { col: '#4dabf7', fs: bh * 0.36, cb: () => Game.playLevel(R.idx) });
        this.btn(ctx, 'menu', sw / 2 - bw * 1.55, y, bw, bh, '⌂ Меню', { col: '#495057', cb: () => Game.go('menu') });
      } else {
        this.btn(ctx, 'retry', sw / 2 + 10, y, bw, bh, '↻ Заново', { col: '#ff6bd6', cb: () => Game.playLevel(R.idx) });
        this.btn(ctx, 'menu', sw / 2 - bw - 10, y, bw, bh, '⌂ Меню', { col: '#495057', cb: () => Game.go('menu') });
      }
    }
  },

  // ---------------- титры ----------------
  credits(ctx, sw, sh, t) {
    const lt = t - (Game.creditsT0 || 0);
    ctx.fillStyle = '#0d0820'; ctx.fillRect(0, 0, sw, sh);
    BG.skyStars(ctx, 0, 0, sw, sh, t);
    const sc = Math.min(sw, sh) / 800;
    const lines = [
      ['НИКИТА ЕСТ ВСЁ', 44, '#ffd43b'], ['', 20], ['В РОЛЯХ', 22, '#b197fc'], ['', 10],
      ['Никита — голодный стажёр', 20, '#fff', 'nikita'], ['Егор — глава лаборатории', 20, '#fff', 'egor'], ['Даня — инженер-робототехник', 20, '#fff', 'danya'],
      ['Пилипюк — химик и его усы', 20, '#fff', 'pylypyuk'], ['Дима — охрана, пилот и танкист', 20, '#fff', 'dima'], ['Кирилл — гений в своём мире', 20, '#fff', 'kirill'],
      ['Наташа — няня Кирилла, святой человек', 20, '#fff', 'natasha'], ['Проф. Молгелевич — злой гений (тоже с причудами)', 20, '#fff', 'molgelevich'],
      ['', 20], ['12 уровней · 3 босса · 13 комиксов', 20, '#69db7c'], ['Вся графика, музыка и звуки — нарисованы и сыграны кодом', 16, '#d0bfff'],
      ['', 20], ['Ни один учёный не пострадал. Их всех выплюнули.', 16, '#ffa8a8'], ['', 30], ['Спасибо за игру!', 30, '#ff6bd6'],
    ];
    let y = sh + 40 - lt * 45 * sc;
    for (const [s, size, col, who] of lines) {
      if (who && y > -100 && y < sh + 100) { Chars.portrait(ctx, who, sw / 2 - Math.min(sw * 0.35, 330 * sc), y - size * sc * 0.4, 26 * sc, { expr: who === 'molgelevich' ? 'evil' : 'happy', t }); }
      if (s) HUD.text(ctx, s, sw / 2, y, size * sc, col, 'center', OL, 800);
      y += (size + 22) * sc * (who ? 1.6 : 1);
    }
    if (y < -50) Game.creditsT0 = t;
    const bh = Math.max(40, 50 * sc);
    this.btn(ctx, 'back', 20 * sc, sh - bh - 20 * sc, 200 * sc, bh, '◀ Меню', { col: '#868e96', cb: () => Game.go('menu') });
  },
};
