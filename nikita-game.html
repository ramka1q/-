'use strict';
// ============================================================
//  Утилиты: математика, рандом, easing, цвета, геометрия, текст
// ============================================================
const TAU = Math.PI * 2;

const U = {
  clamp: (v, a, b) => (v < a ? a : v > b ? b : v),
  lerp: (a, b, t) => a + (b - a) * t,
  invLerp: (a, b, v) => (v - a) / (b - a),
  dist: (ax, ay, bx, by) => Math.hypot(bx - ax, by - ay),
  dist2: (ax, ay, bx, by) => { const dx = bx - ax, dy = by - ay; return dx * dx + dy * dy; },
  angle: (ax, ay, bx, by) => Math.atan2(by - ay, bx - ax),
  angDiff(a, b) { let d = (b - a) % TAU; if (d > Math.PI) d -= TAU; if (d < -Math.PI) d += TAU; return d; },
  approach(v, target, step) { return v < target ? Math.min(target, v + step) : Math.max(target, v - step); },
  damp(a, b, k, dt) { return b + (a - b) * Math.exp(-k * dt); },
  sign: v => (v < 0 ? -1 : 1),

  // Детерминированный генератор (mulberry32): карты одинаковые при каждом запуске
  rng(seed) {
    let a = seed >>> 0;
    const f = () => {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
    f.range = (lo, hi) => lo + f() * (hi - lo);
    f.int = (lo, hi) => Math.floor(lo + f() * (hi - lo + 1));
    f.pick = arr => arr[Math.floor(f() * arr.length)];
    f.chance = p => f() < p;
    return f;
  },
  rand: (lo, hi) => lo + Math.random() * (hi - lo),
  randInt: (lo, hi) => Math.floor(lo + Math.random() * (hi - lo + 1)),
  pick: arr => arr[Math.floor(Math.random() * arr.length)],

  ease: {
    linear: t => t,
    inQuad: t => t * t,
    outQuad: t => 1 - (1 - t) * (1 - t),
    inCubic: t => t * t * t,
    outCubic: t => 1 - Math.pow(1 - t, 3),
    inOutCubic: t => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2),
    outBack: t => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); },
    outElastic: t => (t === 0 ? 0 : t === 1 ? 1 : Math.pow(2, -10 * t) * Math.sin((t * 10 - 0.75) * (TAU / 3)) + 1),
    outBounce(t) {
      const n1 = 7.5625, d1 = 2.75;
      if (t < 1 / d1) return n1 * t * t;
      if (t < 2 / d1) return n1 * (t -= 1.5 / d1) * t + 0.75;
      if (t < 2.5 / d1) return n1 * (t -= 2.25 / d1) * t + 0.9375;
      return n1 * (t -= 2.625 / d1) * t + 0.984375;
    },
  },

  // ---------- цвета ----------
  hexToRgb(hex) {
    hex = hex.replace('#', '');
    if (hex.length === 3) hex = hex.split('').map(c => c + c).join('');
    const n = parseInt(hex, 16);
    return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
  },
  rgbToHex(r, g, b) {
    return '#' + [r, g, b].map(v => U.clamp(Math.round(v), 0, 255).toString(16).padStart(2, '0')).join('');
  },
  // amt > 0 — светлее, < 0 — темнее
  shade(hex, amt) {
    if (!hex || hex[0] !== '#') return hex;
    const [r, g, b] = U.hexToRgb(hex);
    if (amt >= 0) return U.rgbToHex(r + (255 - r) * amt, g + (255 - g) * amt, b + (255 - b) * amt);
    return U.rgbToHex(r * (1 + amt), g * (1 + amt), b * (1 + amt));
  },
  rgba(hex, a) { const [r, g, b] = U.hexToRgb(hex); return `rgba(${r},${g},${b},${a})`; },
  mix(h1, h2, t) {
    const a = U.hexToRgb(h1), b = U.hexToRgb(h2);
    return U.rgbToHex(U.lerp(a[0], b[0], t), U.lerp(a[1], b[1], t), U.lerp(a[2], b[2], t));
  },
  hsl: (h, s, l, a = 1) => `hsla(${h},${s}%,${l}%,${a})`,

  // ---------- геометрия ----------
  // Точка -> отрезок
  segDist(px, py, x1, y1, x2, y2) {
    const dx = x2 - x1, dy = y2 - y1;
    const l2 = dx * dx + dy * dy;
    let t = l2 ? ((px - x1) * dx + (py - y1) * dy) / l2 : 0;
    t = U.clamp(t, 0, 1);
    return Math.hypot(px - (x1 + dx * t), py - (y1 + dy * t));
  },
  // Окружность vs прямоугольник: вектор выталкивания или null
  circleRect(cx, cy, r, x, y, w, h) {
    const nx = U.clamp(cx, x, x + w), ny = U.clamp(cy, y, y + h);
    let dx = cx - nx, dy = cy - ny;
    const d2 = dx * dx + dy * dy;
    if (d2 > r * r) return null;
    if (d2 > 1e-9) {
      const d = Math.sqrt(d2);
      return { nx: dx / d, ny: dy / d, depth: r - d };
    }
    // центр внутри прямоугольника — выталкиваем по ближайшей стороне
    const l = cx - x, rr = x + w - cx, t = cy - y, b = y + h - cy;
    const m = Math.min(l, rr, t, b);
    if (m === l) return { nx: -1, ny: 0, depth: r + l };
    if (m === rr) return { nx: 1, ny: 0, depth: r + rr };
    if (m === t) return { nx: 0, ny: -1, depth: r + t };
    return { nx: 0, ny: 1, depth: r + b };
  },
  rectsOverlap(a, b) { return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y; },
  pointInRect(px, py, x, y, w, h) { return px >= x && px <= x + w && py >= y && py <= y + h; },

  // Гладкий шум для волнистости
  noise1(x) {
    const i = Math.floor(x), f = x - i;
    const h = n => { const s = Math.sin(n * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); };
    const u = f * f * (3 - 2 * f);
    return U.lerp(h(i), h(i + 1), u) * 2 - 1;
  },

  // ---------- рисование ----------
  roundRect(ctx, x, y, w, h, r) {
    r = Math.min(r, Math.abs(w) / 2, Math.abs(h) / 2);
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  },
  starPath(ctx, cx, cy, spikes, outer, inner, rot = -Math.PI / 2) {
    ctx.beginPath();
    for (let i = 0; i < spikes * 2; i++) {
      const r = i % 2 ? inner : outer;
      const a = rot + (i * Math.PI) / spikes;
      const x = cx + Math.cos(a) * r, y = cy + Math.sin(a) * r;
      i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
    }
    ctx.closePath();
  },

  // ---------- текст ----------
  wrapText(ctx, text, maxW) {
    const out = [];
    for (const para of String(text).split('\n')) {
      const words = para.split(' ');
      let line = '';
      for (const w of words) {
        const test = line ? line + ' ' + w : w;
        if (ctx.measureText(test).width > maxW && line) { out.push(line); line = w; }
        else line = test;
      }
      out.push(line);
    }
    return out;
  },

  // Размер Никиты в человеческих единицах
  formatSize(m) {
    const f = (v, u) => (v >= 100 ? Math.round(v) : v >= 10 ? v.toFixed(1) : v.toFixed(2)).toString().replace('.', ',') + ' ' + u;
    if (m < 1e-3) return f(m * 1e6, 'мкм');
    if (m < 1e-2) return f(m * 1e3, 'мм');
    if (m < 1) return f(m * 100, 'см');
    if (m < 1000) return f(m, 'м');
    if (m < 1e9) return Math.round(m / 1000).toLocaleString('ru-RU') + ' км';
    return f(m / 1e9, 'млн км');
  },
  formatTime(s) {
    s = Math.max(0, s);
    const m = Math.floor(s / 60), r = Math.floor(s % 60);
    return m + ':' + String(r).padStart(2, '0');
  },
};

  <script>
'use strict';
// ============================================================
//  Звук: всё синтезируется WebAudio — ни одного файла
// ============================================================
const Sound = {
  ctx: null, master: null, sfxGain: null, musicGain: null, noiseBuf: null,
  musicVol: 0.5, sfxVol: 0.7, muted: false,
  theme: null, step: 0, nextTime: 0, timer: null, lastPlay: {},

  init() {
    if (this.ctx) { if (this.ctx.state === 'suspended') this.ctx.resume(); return; }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    this.ctx = new AC();
    this.master = this.ctx.createGain();
    this.master.gain.value = this.muted ? 0 : 1;
    this.master.connect(this.ctx.destination);
    // лёгкий компрессор, чтобы ничего не хрипело
    const comp = this.ctx.createDynamicsCompressor();
    comp.threshold.value = -14; comp.ratio.value = 4;
    comp.connect(this.master);
    this.sfxGain = this.ctx.createGain(); this.sfxGain.gain.value = this.sfxVol; this.sfxGain.connect(comp);
    this.musicGain = this.ctx.createGain(); this.musicGain.gain.value = this.musicVol * 0.55; this.musicGain.connect(comp);
    const len = this.ctx.sampleRate * 1.5;
    this.noiseBuf = this.ctx.createBuffer(1, len, this.ctx.sampleRate);
    const d = this.noiseBuf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    if (this.pendingTheme) { const t = this.pendingTheme; this.pendingTheme = null; this.playMusic(t); }
  },

  setMuted(m) { this.muted = m; if (this.master) this.master.gain.value = m ? 0 : 1; },
  setMusicVol(v) { this.musicVol = v; if (this.musicGain) this.musicGain.gain.value = v * 0.55; },
  setSfxVol(v) { this.sfxVol = v; if (this.sfxGain) this.sfxGain.gain.value = v; },

  // ---------- примитивы ----------
  tone(freq, dur, type = 'square', vol = 0.2, slideTo = 0, delay = 0, dest = null, attack = 0.005) {
    if (!this.ctx) return;
    const t0 = this.ctx.currentTime + delay;
    const o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.type = type;
    o.frequency.setValueAtTime(freq, t0);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(Math.max(20, slideTo), t0 + dur);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(vol, t0 + attack);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g); g.connect(dest || this.sfxGain);
    o.start(t0); o.stop(t0 + dur + 0.02);
  },
  noise(dur, vol = 0.2, freq = 2000, type = 'lowpass', delay = 0, freqTo = 0, dest = null, q = 1) {
    if (!this.ctx) return;
    const t0 = this.ctx.currentTime + delay;
    const s = this.ctx.createBufferSource(); s.buffer = this.noiseBuf;
    const f = this.ctx.createBiquadFilter(); f.type = type; f.frequency.setValueAtTime(freq, t0); f.Q.value = q;
    if (freqTo) f.frequency.exponentialRampToValueAtTime(freqTo, t0 + dur);
    const g = this.ctx.createGain();
    g.gain.setValueAtTime(vol, t0);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    s.connect(f); f.connect(g); g.connect(dest || this.sfxGain);
    s.start(t0, Math.random() * 0.5); s.stop(t0 + dur + 0.02);
  },

  // Ограничитель частоты: одинаковые звуки не чаще, чем раз в minGap сек
  gate(name, minGap) {
    const now = performance.now() / 1000;
    if (this.lastPlay[name] && now - this.lastPlay[name] < minGap) return false;
    this.lastPlay[name] = now; return true;
  },

  play(name, p = 0) {
    if (!this.ctx || this.muted) return;
    const r = Math.random;
    switch (name) {
      case 'eat': { // p — относительный размер съеденного 0..1
        if (!this.gate('eat', 0.035)) return;
        const base = 520 - p * 300 + r() * 120;
        this.tone(base, 0.09, 'square', 0.09, base * 1.9);
        this.noise(0.05, 0.08, 1800, 'bandpass');
        break;
      }
      case 'bigeat':
        this.tone(160, 0.25, 'sawtooth', 0.14, 60);
        this.noise(0.22, 0.25, 900, 'lowpass', 0, 200);
        this.tone(300, 0.12, 'square', 0.08, 700, 0.05);
        break;
      case 'grow': [0, 4, 7, 12].forEach((s, i) => this.tone(440 * Math.pow(2, s / 12), 0.12, 'triangle', 0.12, 0, i * 0.05)); break;
      case 'hurt':
        if (!this.gate('hurt', 0.15)) return;
        this.tone(380, 0.3, 'sawtooth', 0.16, 90); this.noise(0.18, 0.18, 1200); break;
      case 'dash': this.noise(0.25, 0.18, 400, 'bandpass', 0, 3000, null, 2); this.tone(200, 0.15, 'sine', 0.08, 500); break;
      case 'power': [0, 5, 9, 12, 17, 21].forEach((s, i) => this.tone(600 * Math.pow(2, s / 12), 0.1, 'square', 0.06, 0, i * 0.04)); break;
      case 'key': this.tone(880, 0.12, 'triangle', 0.18); this.tone(1320, 0.3, 'triangle', 0.16, 0, 0.1); break;
      case 'door': this.tone(110, 0.5, 'sawtooth', 0.12, 55); this.noise(0.5, 0.12, 400, 'lowpass', 0, 120); break;
      case 'click': this.tone(1200, 0.04, 'square', 0.06); break;
      case 'button': this.tone(660, 0.07, 'square', 0.1); this.tone(990, 0.1, 'square', 0.08, 0, 0.06); break;
      case 'bonk': if (!this.gate('bonk', 0.25)) return; this.tone(140, 0.12, 'sine', 0.18, 70); break;
      case 'laser': if (!this.gate('laser', 0.08)) return; this.tone(1800, 0.15, 'sawtooth', 0.06, 200); break;
      case 'shoot': if (!this.gate('shoot', 0.06)) return; this.tone(900, 0.12, 'square', 0.07, 250); break;
      case 'splash': this.noise(0.35, 0.2, 1500, 'lowpass', 0, 300); this.tone(300, 0.1, 'sine', 0.1, 900); break;
      case 'boom':
        this.noise(0.8, 0.45, 1200, 'lowpass', 0, 60); this.tone(90, 0.6, 'sine', 0.35, 30); break;
      case 'win':
        [0, 4, 7, 12, 7, 12, 16, 19].forEach((s, i) => this.tone(392 * Math.pow(2, s / 12), 0.18, i < 4 ? 'square' : 'triangle', 0.1, 0, i * 0.09));
        break;
      case 'lose': [7, 5, 3, 0].forEach((s, i) => this.tone(330 * Math.pow(2, s / 12), 0.28, 'sawtooth', 0.09, 0, i * 0.2)); break;
      case 'page': this.noise(0.28, 0.12, 3000, 'highpass', 0, 800); break;
      case 'type': if (!this.gate('type', 0.045)) return; this.tone(700 + r() * 300, 0.025, 'square', 0.025); break;
      case 'alarm': this.tone(700, 0.25, 'square', 0.08, 1100); this.tone(1100, 0.25, 'square', 0.08, 700, 0.25); break;
      case 'bosshit': this.noise(0.4, 0.35, 2000, 'lowpass', 0, 100); this.tone(70, 0.4, 'square', 0.2, 35); this.tone(1400, 0.2, 'sawtooth', 0.06, 300); break;
      case 'chime': [0, 7, 12].forEach((s, i) => this.tone(784 * Math.pow(2, s / 12), 0.35, 'sine', 0.12, 0, i * 0.08)); break;
      case 'stun': [0, 3, 0, 3].forEach((s, i) => this.tone(500 * Math.pow(2, s / 12), 0.08, 'square', 0.07, 0, i * 0.07)); break;
      case 'freeze': this.tone(2000, 0.4, 'sine', 0.08, 600); this.noise(0.3, 0.1, 6000, 'highpass'); break;
      case 'teleport': this.tone(300, 0.35, 'sine', 0.12, 1800); this.tone(450, 0.35, 'triangle', 0.08, 2400, 0.05); break;
      case 'select': this.tone(520, 0.06, 'square', 0.08); this.tone(780, 0.08, 'square', 0.07, 0, 0.05); break;
      case 'crunch': this.noise(0.18, 0.3, 700, 'lowpass', 0, 150); this.tone(120, 0.12, 'square', 0.1, 60); break;
      case 'warn': if (!this.gate('warn', 0.3)) return; this.tone(440, 0.12, 'square', 0.06); break;
      case 'pop': this.tone(300, 0.08, 'sine', 0.15, 900); break;
    }
  },

  // ============================================================
  //  Музыка: процедурный секвенсор (у каждой главы своя тема)
  // ============================================================
  themes: {
    menu:    { bpm: 112, root: 60, scale: [0, 2, 4, 5, 7, 9, 11], chords: [0, 5, 3, 4], lead: 'square', bass: 'triangle', seed: 7, drums: 'pop', swing: 0 },
    lab:     { bpm: 122, root: 57, scale: [0, 2, 3, 5, 7, 8, 10], chords: [0, 5, 2, 6], lead: 'square', bass: 'square', seed: 21, drums: 'pop', swing: 0.1 },
    city:    { bpm: 116, root: 53, scale: [0, 2, 4, 5, 7, 9, 10], chords: [0, 3, 4, 3], lead: 'sawtooth', bass: 'square', seed: 33, drums: 'funk', swing: 0.15 },
    dark:    { bpm: 88, root: 50, scale: [0, 2, 3, 5, 7, 8, 10], chords: [0, 5, 6, 4], lead: 'triangle', bass: 'sawtooth', seed: 44, drums: 'sparse', swing: 0 },
    base:    { bpm: 132, root: 52, scale: [0, 2, 3, 5, 7, 8, 10], chords: [0, 0, 5, 6], lead: 'sawtooth', bass: 'sawtooth', seed: 55, drums: 'march', swing: 0 },
    ocean:   { bpm: 98, root: 52, scale: [0, 2, 3, 5, 7, 9, 10], chords: [0, 3, 6, 4], lead: 'triangle', bass: 'triangle', seed: 66, drums: 'soft', swing: 0.1 },
    volcano: { bpm: 140, root: 48, scale: [0, 1, 3, 5, 7, 8, 10], chords: [0, 1, 0, 6], lead: 'sawtooth', bass: 'square', seed: 77, drums: 'rock', swing: 0 },
    earth:   { bpm: 120, root: 55, scale: [0, 2, 4, 5, 7, 9, 11], chords: [0, 4, 5, 3], lead: 'square', bass: 'triangle', seed: 88, drums: 'pop', swing: 0 },
    space:   { bpm: 92, root: 47, scale: [0, 2, 3, 5, 7, 8, 10], chords: [0, 5, 3, 6], lead: 'sine', bass: 'triangle', seed: 99, drums: 'soft', swing: 0 },
    boss:    { bpm: 156, root: 52, scale: [0, 1, 3, 5, 7, 8, 11], chords: [0, 5, 6, 4], lead: 'sawtooth', bass: 'sawtooth', seed: 111, drums: 'rock', swing: 0 },
    comic:   { bpm: 100, root: 55, scale: [0, 2, 4, 5, 7, 9, 11], chords: [0, 3, 5, 4], lead: 'triangle', bass: 'triangle', seed: 123, drums: 'soft', swing: 0.1 },
    ending:  { bpm: 104, root: 60, scale: [0, 2, 4, 5, 7, 9, 11], chords: [0, 5, 3, 4], lead: 'triangle', bass: 'square', seed: 140, drums: 'pop', swing: 0.08 },
  },

  buildPatterns(th) {
    const rnd = U.rng(th.seed);
    const sc = th.scale;
    const deg = d => { const o = Math.floor(d / 7); return sc[((d % 7) + 7) % 7] + 12 * o; };
    th.mel = []; th.bassP = [];
    for (let bar = 0; bar < 4; bar++) {
      const c = th.chords[bar];
      const chordTones = [c, c + 2, c + 4, c + 7];
      const bars = [];
      let last = c + 7;
      for (let s = 0; s < 16; s++) {
        let note = null;
        const strong = s % 4 === 0;
        if (strong ? rnd() < 0.85 : rnd() < 0.45) {
          if (strong) last = rnd.pick(chordTones) + 7;
          else last = last + rnd.pick([-2, -1, 1, 2, 0]);
          last = U.clamp(last, c + 2, c + 14);
          note = deg(last);
        }
        bars.push(note);

const Sprites = {
  cache: new Map(),
  buckets: [12, 32, 80, 200],
  PAD: 1.3, // запас вокруг радиуса 50
  get(name, v, pxR) {
    let b = this.buckets[this.buckets.length - 1];
    for (const s of this.buckets) if (s >= pxR) { b = s; break; }
    const key = name + '|' + v + '|' + b;
    let cv = this.cache.get(key);
    if (cv) return cv;
    const fn = S[name];
    const size = Math.ceil(b * 2 * this.PAD);
    cv = document.createElement('canvas'); cv.width = cv.height = size;
    const c = cv.getContext('2d');
    c.translate(size / 2, size / 2);
    c.scale(b / 50, b / 50);
    c.lineJoin = 'round'; c.lineCap = 'round';
    if (fn) { try { fn(c, v); } catch (e) { console.warn('sprite', name, e); } }

    this.cache.set(key, cv);
    return cv;
  },
  // Рисует спрайт в текущих (мировых) координатах. zoom — пикселей на единицу.
  draw(ctx, name, v, x, y, r, rot, zoom) {
    const pxR = r * zoom;
    if (pxR < 0.6) { // крошечное — точкой
      ctx.fillStyle = '#0003'; ctx.fillRect(x - r, y - r, r * 2, r * 2); return;
    }
    const cv = this.get(name, v, pxR);
    const half = r * this.PAD;
    if (rot) {
      ctx.save(); ctx.translate(x, y); ctx.rotate(rot);
      ctx.drawImage(cv, -half, -half, half * 2, half * 2);
      ctx.restore();
    } else ctx.drawImage(cv, x - half, y - half, half * 2, half * 2);
  },
  // Доминирующий цвет для крошек при поедании
  colorOf(name, v) {
    const key = 'col|' + name + '|' + v;
    if (this.cache.has(key)) return this.cache.get(key);
    let col = '#ffd43b';
    if (!S[name]) { this.cache.set(key, col); return col; }
    try {
      const cv = this.get(name, v, 12);
      const d = cv.getContext('2d').getImageData(0, 0, cv.width, cv.height).data;
      let r = 0, g = 0, b = 0, n = 0;
      for (let i = 0; i < d.length; i += 16) if (d[i + 3] > 200) { r += d[i]; g += d[i + 1]; b += d[i + 2]; n++; }
      if (n) col = U.rgbToHex(r / n, g / n, b / n);
    } catch (e) { /* ignore */ }
    this.cache.set(key, col);
    return col;
  },
};

// ---------- поведения ----------
const BEH = {
  drift(it, dt, L) {
    const s = it.spd * it.r;
    if (L.moveActor(it, Math.cos(it.heading) * s, Math.sin(it.heading) * s, dt)) it.heading += Math.PI * (0.6 + Math.random() * 0.8);
    if (it.rotMode === 'dir') it.rot = it.heading;
  },
  wander(it, dt, L) {
    it.heading += U.noise1(L.time * 0.6 + it.uid * 7.3) * dt * 2.2;
    const s = it.spd * it.r;
    if (L.moveActor(it, Math.cos(it.heading) * s, Math.sin(it.heading) * s, dt)) it.heading += Math.PI * (0.6 + Math.random() * 0.8);
    if (it.rotMode === 'dir') it.rot = it.heading;
  },
  flee(it, dt, L) {
    const P = L.P;
    const d = U.dist(it.x, it.y, P.x, P.y);
    if (d < Math.max(P.r * 6, it.r * 8) && L.canEat(it)) {
      const away = U.angle(P.x, P.y, it.x, it.y);
      it.heading += U.angDiff(it.heading, away + U.noise1(L.time + it.uid) * 0.6) * Math.min(1, dt * 6);
      const s = it.spd * it.r * 1.15;
      if (L.moveActor(it, Math.cos(it.heading) * s, Math.sin(it.heading) * s, dt)) it.heading += (Math.random() - 0.5) * 2.5;
      if (it.rotMode === 'dir') it.rot = it.heading;
      if (it.panic && !it.say && Math.random() < dt * 0.3) it.say = { text: U.pick(it.panic), t: 1.6 };
    } else { const sp = it.spd; it.spd = sp * 0.35; BEH.wander(it, dt, L); it.spd = sp; }
  },
  chase(it, dt, L) {
    const P = L.P;
    const d = U.dist(it.x, it.y, P.x, P.y);
    const canEat = L.canEat(it);
    if (!canEat && d < (it.aggro || 8) * it.r + P.r * 4) {
      const to = U.angle(it.x, it.y, P.x, P.y);
      it.heading += U.angDiff(it.heading, to) * Math.min(1, dt * 4);
      const s = it.spd * it.r;
      L.moveActor(it, Math.cos(it.heading) * s, Math.sin(it.heading) * s, dt);
      if (it.rotMode === 'dir') it.rot = it.heading;
      if (it.taunt && !it.say && Math.random() < dt * 0.15) it.say = { text: U.pick(it.taunt), t: 2 };
    } else if (canEat && d < P.r * 6) BEH.flee(it, dt, L);
    else { const sp = it.spd; it.spd = sp * 0.4; BEH.wander(it, dt, L); it.spd = sp; }
  },
  patrol(it, dt, L) {
    const path = it.path; if (!path) return;
    const i = it.data.pi || 0, [tx, ty] = path[i % path.length];
    const a = U.angle(it.x, it.y, tx, ty), d = U.dist(it.x, it.y, tx, ty);
    const s = it.spd * it.r * (L.flags.alarm && it.alarmSpd ? it.alarmSpd : 1);
    it.x += Math.cos(a) * Math.min(s * dt, d); it.y += Math.sin(a) * Math.min(s * dt, d);
    if (d < s * dt + 1) it.data.pi = (i + 1) % path.length;
    if (it.rotMode === 'dir') it.rot += U.angDiff(it.rot, a) * Math.min(1, dt * 5);
    it.heading = a;
    if (it.cone) BEH.coneCheck(it, dt, L, a);
    if (it.hz && !L.canEat(it)) { /* урон через касание обрабатывает playerVsItems */ }
  },
  traffic(it, dt, L) { BEH.patrol(it, dt, L); },
  // Машина с соблюдением ПДД: стоит на красный, не въезжает в машину впереди
  car(it, dt, L) {
    const path = it.path, i = it.data.pi || 0, [tx, ty] = path[i % path.length];
    const a = U.angle(it.x, it.y, tx, ty), d = U.dist(it.x, it.y, tx, ty);
    const hx = Math.cos(a), hy = Math.sin(a);
    let stop = false;
    if (L.data.inters) for (const I of L.data.inters) {
      const dx = I.x - it.x, dy = I.y - it.y;
      const along = dx * hx + dy * hy;
      if (along < 95 || along > 95 + it.r + 70) continue;
      if (Math.abs(-dx * hy + dy * hx) > 140) continue;
      if (cityLight(L, I, Math.abs(hx) > Math.abs(hy)) !== 'green') { stop = true; break; }
    }
    if (!stop) for (const o of L.items) {
      if (o === it || o.dead || o.beh !== 'car') continue;
      const dx = o.x - it.x, dy = o.y - it.y; if (Math.abs(dx) > 260 || Math.abs(dy) > 260) continue;
      const along = dx * hx + dy * hy;
      if (along > 0 && along < it.r + o.r + 25 && Math.abs(-dx * hy + dy * hx) < 45) { stop = true; break; }
    }
    it.data.k = U.approach(it.data.k === undefined ? 1 : it.data.k, stop ? 0 : 1, dt * 3);
    const s = it.spd * it.r * it.data.k;
    it.x += hx * Math.min(s * dt, d); it.y += hy * Math.min(s * dt, d);
    if (d < s * dt + 1) it.data.pi = (i + 1) % path.length;
    it.rot += U.angDiff(it.rot, a) * Math.min(1, dt * 5);
    it.heading = a;
  },
  orbit(it, dt, L) {
    const o = it.orbit;
    let cx = o.cx, cy = o.cy;
    if (o.parent) { const p = L.byId[o.parent]; if (p && !p.dead) { cx = p.x; cy = p.y; } else { it.beh = 'drift'; return; } }
    o.a += o.w * dt;
    it.x = cx + Math.cos(o.a) * o.R; it.y = cy + Math.sin(o.a) * o.R;
    if (it.rotMode === 'dir') it.rot = o.a + Math.PI / 2 * Math.sign(o.w);
  },
  turret(it, dt, L) {
    const P = L.P;
    const d = U.dist(it.x, it.y, P.x, P.y);
    const a = U.angle(it.x, it.y, P.x, P.y);
    it.data.aim = it.data.aim === undefined ? a : it.data.aim + U.angDiff(it.data.aim, a) * Math.min(1, dt * 3);
    it.data.cd = (it.data.cd || it.rate * Math.random()) - dt;
    if (d < (it.range || 900) && !L.canEat(it) && it.data.cd <= 0 && !it.data.off) {
      it.data.cd = it.rate || 2.5;
      const sh = it.shot || {};
      const r = sh.r || Math.max(4, P.r * 0.35);
      L.shoot(it.x + Math.cos(it.data.aim) * it.r, it.y + Math.sin(it.data.aim) * it.r, it.data.aim + (Math.random() - 0.5) * (sh.spread || 0.1), sh.speed || P.r * 9, Object.assign({ r, life: 3 }, sh, { r }));
      Sound.play('shoot');
    }
  },
  // Учёный в мире: держит дистанцию, стреляет, убегает если Никита большой
  sci(it, dt, L) {
    const P = L.P;
    const d = U.dist(it.x, it.y, P.x, P.y);
    const canEat = L.canEat(it);
    it.data.t = (it.data.t || 0) + dt;
    let vx = 0, vy = 0;
    const s = it.spd * it.r;
    if (canEat) {
      if (d < P.r * 8) { const a = U.angle(P.x, P.y, it.x, it.y); vx = Math.cos(a) * s * 1.2; vy = Math.sin(a) * s * 1.2; it.pose = 'run'; it.expr = 'shock'; if (!it.say && Math.random() < dt * 0.5) it.say = { text: U.pick(it.scared || ['Аааа!', 'Никита, нет!', 'Я невкусный!']), t: 1.8 }; }
      else { it.pose = 'stand'; it.expr = 'shock'; }
    } else {
      const want = it.keep || 7;
      if (d < (it.range || 1200)) {
        const a = U.angle(it.x, it.y, P.x, P.y);
        const k = d > want * it.r ? 1 : d < want * it.r * 0.6 ? -1 : 0;
        vx = Math.cos(a) * s * k; vy = Math.sin(a) * s * k;
        it.pose = k ? 'run' : 'point'; it.expr = it.angry || 'determined';
        it.data.cd = (it.data.cd === undefined ? 2 : it.data.cd) - dt;
        if (it.shot && it.data.cd <= 0 && d < want * it.r * 1.8) {
          it.data.cd = it.rate || 3;
          const sh = it.shot; const r = sh.r || Math.max(4, P.r * 0.45);
          L.shoot(it.x, it.y - it.r * 0.3, a, sh.speed || P.r * 8, Object.assign({}, sh, { r, life: 3 }));
          Sound.play('shoot');
        }
        if (!it.say && it.lines && Math.random() < dt * 0.12) it.say = { text: U.pick(it.lines), t: 2.6 };
      } else { it.heading += U.noise1(L.time + it.uid) * dt; vx = Math.cos(it.heading) * s * 0.3; vy = Math.sin(it.heading) * s * 0.3; it.pose = 'stand'; it.expr = 'normal'; }
    }
    if (L.moveActor(it, vx, vy, dt)) it.heading += 1.5;
    if (Math.abs(vx) > 1) it.flip = vx < 0;
    if (it.rotMode === 'dir' && Math.hypot(vx, vy) > 1) it.rot += U.angDiff(it.rot, Math.atan2(vy, vx)) * Math.min(1, dt * 4);
  },
  kirill(it, dt, L) {
    it.data.ct = (it.data.ct || 0) - dt;
    if (it.data.ct <= 0) { it.data.ct = 0.5 + Math.random() * 1.2; it.heading = Math.random() * TAU; }
    const s = it.spd * it.r * (it.data.free ? 1.6 : 1);
    if (L.canEat(it) && U.dist(it.x, it.y, L.P.x, L.P.y) < L.P.r * 6) { const a = U.angle(L.P.x, L.P.y, it.x, it.y); it.heading = a; it.expr = 'shock'; }
    else it.expr = 'crazy';
    if (L.moveActor(it, Math.cos(it.heading) * s, Math.sin(it.heading) * s, dt)) it.heading += Math.PI;
    it.flip = Math.cos(it.heading) < 0; it.pose = Math.sin(L.time * 3) > 0.6 ? 'armsUp' : 'run';
    it.data.press = (it.data.press === undefined ? 5 : it.data.press) - dt;
    if (it.data.press <= 0) { it.data.press = (it.data.free ? 3 : 6) + Math.random() * 4; if (L.def.events && L.def.events.kirillPress) L.def.events.kirillPress(L, it); }
    if (!it.say && Math.random() < dt * 0.2) it.say = { text: U.pick(it.lines || ['Пёсик!']), t: 2.4 };
  },
  natasha(it, dt, L) {
    const k = L.byId.kirill;
    const P = L.P;
    it.data.rage = Math.max(0, (it.data.rage || 0) - dt);
    let tx, ty, s = it.spd * it.r;
    if (it.data.rage > 0 && !L.canEat(it)) { tx = P.x; ty = P.y; s *= 1.5; it.expr = 'angry'; it.pose = 'run'; it.hz = 0.12; it.accName = 'broom'; }
    else if (k && !k.dead) { tx = k.x - Math.cos(k.heading) * k.r * 2; ty = k.y - Math.sin(k.heading) * k.r * 2; it.expr = 'tired'; it.pose = 'run'; it.hz = 0; it.accName = 'bag'; if (!it.say && Math.random() < dt * 0.15) it.say = { text: U.pick(it.lines), t: 2.4 }; }
    else { tx = it.x; ty = it.y; it.pose = 'stand'; }
    if (L.canEat(it) && U.dist(it.x, it.y, P.x, P.y) < P.r * 6) { const a = U.angle(P.x, P.y, it.x, it.y); tx = it.x + Math.cos(a) * 100; ty = it.y + Math.sin(a) * 100; it.expr = 'shock'; }
    const d = U.dist(it.x, it.y, tx, ty);
    if (d > it.r * 0.5) { const a = U.angle(it.x, it.y, tx, ty); L.moveActor(it, Math.cos(a) * Math.min(s, d * 3), Math.sin(a) * Math.min(s, d * 3), dt); it.flip = Math.cos(a) < 0; }
    else it.pose = 'stand';
  },
  // Горелка: огонь включается и выключается
  burner(it, dt, L) {
    it.data.t = (it.data.t || it.phase || 0) + dt;
    const cyc = (it.on || 2) + (it.off || 1.5);
    it.data.lit = (it.data.t % cyc) < (it.on || 2);
    it.hz = it.data.lit ? 0.1 : 0;
    it.solid = true;
  },
  geyser(it, dt, L) {
    it.data.t = (it.data.t || it.phase || 0) + dt;
    const cyc = it.cyc || 5;
    const ph = it.data.t % cyc;
    it.data.state = ph < cyc - 1.6 ? 0 : ph < cyc - 0.8 ? 1 : 2;
    if (it.data.state === 2) {
      const P = L.P;
      if (U.dist(it.x, it.y, P.x, P.y) < it.r * 2.6 + P.r && !(P.r > it.r * 3)) L.hurt(0.1, it.x, it.y, 'geyser');
      if (Math.random() < 0.5) L.part('smoke', it.x + (Math.random() - 0.5) * it.r, it.y + (Math.random() - 0.5) * it.r, (Math.random() - 0.5) * it.r * 3, (Math.random() - 0.5) * it.r * 3, it.r * 0.6, it.lava ? 'rgba(255,120,0,0.5)' : 'rgba(255,255,255,0.5)', 0.8);
    }
  },
  // Дрон-прожектор (стелс)
  drone(it, dt, L) {
    it.cone.a = it.heading + Math.sin(L.time * 1.2 + it.uid) * 0.5;
    if (L.flags.alarm > 0 && !L.canEat(it)) {
      const P = L.P, a = U.angle(it.x, it.y, P.x, P.y);
      const s = it.spd * it.r * 1.4;
      L.moveActor(it, Math.cos(a) * s, Math.sin(a) * s, dt);
      it.heading = a; it.cone.a = a;
      it.data.cd = (it.data.cd || 1) - dt;
      if (it.data.cd <= 0 && U.dist(it.x, it.y, P.x, P.y) < it.cone.len) { it.data.cd = 1.8; L.shoot(it.x, it.y, a, P.r * 7, { k: 'net', r: P.r * 0.4, eff: 'stun', hz: 0, col: '#fff', stunT: 1.2 }); Sound.play('shoot'); }
    } else if (it.path) BEH.patrol(it, dt, L);
    if (L.flags.alarm <= 0) BEH.coneCheck(it, dt, L, it.cone.a);
  },
  coneCheck(it, dt, L, a) {
    const P = L.P;
    if (!it.cone || L.canEat(it)) return;
    const d = U.dist(it.x, it.y, P.x, P.y);
    if (d > it.cone.len + P.r) return;
    const da = Math.abs(U.angDiff(it.cone.a, U.angle(it.x, it.y, P.x, P.y)));
    if (da < it.cone.w + Math.atan2(P.r, d)) {
      if (!(L.flags.alarm > 0)) { L.toast('ТРЕВОГА! Тебя заметили!', '#ff6b6b', 2); Sound.play('alarm'); if (L.def.onAlarm) L.def.onAlarm(L, it); }
      L.flags.alarm = 5;
    }
  },
  spinner(it, dt, L) { it.rot += (it.spinSpd || 1) * dt; },
  searchlight(it, dt, L) {
    it.cone.a = it.base + Math.sin(L.time * (it.sweepSpd || 0.6) + it.uid) * (it.sweep || 1.2);
    if (!(L.flags.alarm > 0)) BEH.coneCheck(it, dt, L, it.cone.a);
  },
  orbitTurret(it, dt, L) { BEH.orbit(it, dt, L); if (it.beh === 'orbitTurret') BEH.turret(it, dt, L); },
  follow(it, dt, L) {
    const f = L.byId[it.target]; if (!f || f.dead) { it.beh = 'wander'; return; }
    const d = U.dist(it.x, it.y, f.x, f.y);
    if (d > (it.dist || f.r * 2)) { const a = U.angle(it.x, it.y, f.x, f.y); L.moveActor(it, Math.cos(a) * it.spd * it.r, Math.sin(a) * it.spd * it.r, dt); if (it.rotMode === 'dir') it.rot = a; }
  },
  // Гравитационный колодец (планеты): притягивает Никиту
  grav(it, dt, L) {
    const P = L.P;
    if (L.canEat(it)) return;
    const d = U.dist(it.x, it.y, P.x, P.y);
    const R = it.r * (it.gravR || 5);
    if (d < R && d > it.r) { const f = (1 - d / R) * P.r * BASE_SPD * (it.gstr || 0.5); L.pushX += (it.x - P.x) / d * f; L.pushY += (it.y - P.y) / d * f; }
  },
};

// ---------- особые отрисовки предметов ----------
const Draws = {
  sci(ctx, it, t, z, L) {
    if (it.r * z < 2) { circ(ctx, it.x, it.y, it.r, CH[it.who] ? CH[it.who].color : '#fff', null); return; }
    Chars.draw(ctx, it.who, { x: it.x, y: it.y + it.r * 0.95, scale: it.r / 52, t: t + it.uid, pose: it.pose || 'stand', expr: it.expr || 'normal', flip: it.flip, accName: it.accName, talking: !!it.say });
    if (it.hz && !L.canEat(it)) { ctx.save(); ctx.globalAlpha = 0.25 + 0.15 * Math.sin(t * 8); circ(ctx, it.x, it.y, it.r * 1.1, null, '#ff4d4d', it.r * 0.06); ctx.restore(); }
  },
  burner(ctx, it, t, z) {
    Sprites.draw(ctx, 'burner', 0, it.x, it.y, it.r, 0, z);
    if (it.data.lit) {
      const r = it.r;
      for (let i = 0; i < 3; i++) {
        const fl = 1 + Math.sin(t * 20 + i * 2) * 0.12;
        ctx.save(); ctx.globalAlpha = 0.7 - i * 0.15;

        ctx.restore();

    } else {

      if (k > (it.off || 1.5) - 0.5) { ctx.save(); ctx.globalAlpha = 0.5 + 0.5 * Math.sin(t * 40); circ(ctx, it.x, it.y, it.r * 0.3, '#4dabf7', null); ctx.restore(); }
    }
  },
  geyser(ctx, it, t, z) {
    const st = it.data.state || 0;
    circ(ctx, it.x, it.y, it.r, it.lava ? '#3d2b1f' : '#5c5048', OL, it.r * 0.1);
    circ(ctx, it.x, it.y, it.r * 0.6, it.lava ? '#ff6b00' : '#74c0fc', null);
    if (st >= 1) { ctx.save(); ctx.globalAlpha = st === 1 ? 0.3 + 0.3 * Math.sin(t * 30) : 0.5; circ(ctx, it.x, it.y, it.r * 2.6, it.lava ? '#ff6b00' : '#e7f5ff', st === 1 ? null : '#fff', it.r * 0.1); ctx.restore(); }
    if (st === 2) { for (let i = 0; i < 6; i++) { const a = t * 5 + i; circ(ctx, it.x + Math.cos(a) * it.r * 1.4, it.y + Math.sin(a) * it.r * 1.4, it.r * 0.6, it.lava ? '#ffd43b' : '#fff', null); } }
  },
  drone(ctx, it, t, z, L) {
    const c = it.cone;
    ctx.save(); ctx.globalAlpha = L.flags.alarm > 0 ? 0.28 : 0.16;
    ctx.fillStyle = L.flags.alarm > 0 ? '#ff4d4d' : '#fff3bf';
    ctx.beginPath(); ctx.moveTo(it.x, it.y); ctx.arc(it.x, it.y, c.len, c.a - c.w, c.a + c.w); ctx.closePath(); ctx.fill();
    ctx.restore();
    const r = it.r;
    for (let i = 0; i < 4; i++) { const a = i * TAU / 4 + Math.PI / 4; line(ctx, it.x, it.y, it.x + Math.cos(a) * r, it.y + Math.sin(a) * r, OL, r * 0.18); ctx.save(); ctx.globalAlpha = 0.5; circ(ctx, it.x + Math.cos(a) * r, it.y + Math.sin(a) * r, r * 0.42, '#adb5bd', null); ctx.restore(); }
    circ(ctx, it.x, it.y, r * 0.5, '#ff922b', OL, r * 0.08);
    circ(ctx, it.x + Math.cos(c.a) * r * 0.25, it.y + Math.sin(c.a) * r * 0.25, r * 0.2, L.flags.alarm > 0 ? '#ff4d4d' : '#fff3bf', OL, r * 0.05);
  },
  turret(ctx, it, t, z) {
    const r = it.r, a = it.data.aim || 0;
    circ(ctx, it.x, it.y, r, it.col || '#495057', OL, r * 0.1);
    ctx.save(); ctx.translate(it.x, it.y); ctx.rotate(a);
    rect(ctx, 0, -r * 0.22, r * 1.3, r * 0.44, r * 0.1, it.col2 || '#868e96', OL, r * 0.08);
    ctx.restore();
    circ(ctx, it.x, it.y, r * 0.55, it.col2 || '#868e96', OL, r * 0.08);
    circ(ctx, it.x, it.y, r * 0.2, it.eye || '#ff4d4d', null);
  },
  jeep(ctx, it, t, z) { // джип Димы
    Sprites.draw(ctx, 'jeep', 0, it.x, it.y, it.r, it.rot, z);
    if (it.r * z > 6) Chars.portrait(ctx, 'dima', it.x, it.y - it.r * 0.1, it.r * 0.42, { expr: it.expr || 'determined', t });
  },
  sub(ctx, it, t, z) { // подлодка Егора
    ctx.save(); ctx.translate(it.x, it.y); ctx.rotate(it.rot);
    const r = it.r;
    ell(ctx, 0, 0, r, r * 0.45, 0, lg(ctx, 0, -r * 0.45, 0, r * 0.45, ['#ffe066', '#fab005', '#e67700']), OL, r * 0.06);
    rect(ctx, -r * 0.2, -r * 0.2, r * 0.45, r * 0.4, r * 0.1, '#fab005', OL, r * 0.05);
    for (let i = 0; i < 3; i++) circ(ctx, -r * 0.5 + i * r * 0.35, r * 0.05, r * 0.1, '#a5d8ff', OL, r * 0.04);
    ctx.save(); ctx.rotate(t * 10); for (let i = 0; i < 3; i++) { ctx.rotate(TAU / 3); ell(ctx, -r * 1.05, 0, r * 0.06, r * 0.2, 0, '#868e96', OL, r * 0.03); } ctx.restore();

  },
  searchlight(ctx, it, t, z, L) {
    const c = it.cone;
    ctx.save(); ctx.globalAlpha = L.flags.alarm > 0 ? 0.3 : 0.18; ctx.fillStyle = L.flags.alarm > 0 ? '#ff4d4d' : '#fff3bf';
    ctx.beginPath(); ctx.moveTo(it.x, it.y); ctx.arc(it.x, it.y, c.len, c.a - c.w, c.a + c.w); ctx.closePath(); ctx.fill(); ctx.restore();

  lasersat(ctx, it, t, z) {

    ctx.save(); ctx.globalAlpha = 0.5 + 0.5 * Math.sin(t * 6 + it.uid); circ(ctx, it.x, it.y, it.r * 0.25, '#ff3b3b', null); ctx.restore();
  },
  sun(ctx, it, t, z, L) {
    const r = it.r;
    const g = ctx.createRadialGradient(it.x, it.y, r * 0.3, it.x, it.y, r * 2.2);
    g.addColorStop(0, 'rgba(255,243,191,1)'); g.addColorStop(0.45, 'rgba(255,212,59,0.9)'); g.addColorStop(0.6, 'rgba(255,146,43,0.35)'); g.addColorStop(1, 'rgba(255,107,0,0)');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(it.x, it.y, r * 2.2, 0, TAU); ctx.fill();
    ctx.beginPath();
    for (let i = 0; i <= 60; i++) { const a = i / 60 * TAU; const rr = r * (1 + 0.04 * Math.sin(a * 9 + t * 3) + 0.03 * Math.sin(a * 5 - t * 2)); i ? ctx.lineTo(it.x + Math.cos(a) * rr, it.y + Math.sin(a) * rr) : ctx.moveTo(it.x + Math.cos(a) * rr, it.y + Math.sin(a) * rr); }
    ctx.closePath(); ctx.fillStyle = rg(ctx, it.x, it.y, r, ['#fffbe6', '#ffd43b', '#ff922b']); ctx.fill();

  },
};

// ---------- зоны ----------
const ZoneDraw = {
  current(ctx, z, zm, t) {
    ctx.save();
    if (z.shape === 'circ') { ctx.beginPath(); ctx.arc(z.x, z.y, z.r, 0, TAU); ctx.clip(); } else { ctx.beginPath(); ctx.rect(z.x, z.y, z.w, z.h); ctx.clip(); }
    const bx = z.shape === 'circ' ? z.x - z.r : z.x, by = z.shape === 'circ' ? z.y - z.r : z.y, bw = z.shape === 'circ' ? z.r * 2 : z.w, bh = z.shape === 'circ' ? z.r * 2 : z.h;
    ctx.fillStyle = z.col || 'rgba(116,192,252,0.18)'; ctx.fillRect(bx, by, bw, bh);
    const s = z.step || Math.max(60, Math.min(bw, bh) * 0.25);
    const off = (t * s * 1.2) % s;
    ctx.strokeStyle = z.arrow || 'rgba(255,255,255,0.45)'; ctx.lineWidth = s * 0.08;
    const a = Math.atan2(z.dy, z.dx);
    ctx.translate(bx + bw / 2, by + bh / 2); ctx.rotate(a);
    const R = Math.hypot(bw, bh) / 2;
    for (let x = -R - s + off; x < R + s; x += s) for (let y = -R; y < R; y += s) { ctx.beginPath(); ctx.moveTo(x - s * 0.2, y - s * 0.2); ctx.lineTo(x + s * 0.1, y); ctx.lineTo(x - s * 0.2, y + s * 0.2); ctx.stroke(); }
    ctx.restore();
  },
  conveyor(ctx, z, zm, t) {
    ctx.save(); ctx.beginPath(); ctx.rect(z.x, z.y, z.w, z.h); ctx.clip();
    ctx.fillStyle = '#343a40'; ctx.fillRect(z.x, z.y, z.w, z.h);
    const horiz = Math.abs(z.dx) > Math.abs(z.dy);
    const s = (horiz ? z.h : z.w) * 0.6;
    const dir = horiz ? Math.sign(z.dx) : Math.sign(z.dy);
    const off = ((t * s * 1.5 * dir) % s + s) % s;
    ctx.strokeStyle = '#ffd43b'; ctx.lineWidth = s * 0.15;
    if (horiz) for (let x = z.x - s + off; x < z.x + z.w + s; x += s) { ctx.beginPath(); ctx.moveTo(x - dir * s * 0.25, z.y + z.h * 0.25); ctx.lineTo(x + dir * s * 0.1, z.y + z.h / 2); ctx.lineTo(x - dir * s * 0.25, z.y + z.h * 0.75); ctx.stroke(); }
    else for (let y = z.y - s + off; y < z.y + z.h + s; y += s) { ctx.beginPath(); ctx.moveTo(z.x + z.w * 0.25, y - dir * s * 0.25); ctx.lineTo(z.x + z.w / 2, y + dir * s * 0.1); ctx.lineTo(z.x + z.w * 0.75, y - dir * s * 0.25); ctx.stroke(); }
    ctx.restore();
    ctx.strokeStyle = '#212529'; ctx.lineWidth = Math.min(z.w, z.h) * 0.06; ctx.strokeRect(z.x, z.y, z.w, z.h);
  },
  ice(ctx, z, zm, t) {
    ctx.save(); ctx.globalAlpha = 0.75;
    if (z.shape === 'circ') { ctx.beginPath(); ctx.arc(z.x, z.y, z.r, 0, TAU); ctx.clip(); BG.fillPattern(ctx, 'ice', 300, z.x - z.r, z.y - z.r, z.r * 2, z.r * 2, zm); }
    else { ctx.beginPath(); ctx.rect(z.x, z.y, z.w, z.h); ctx.clip(); BG.fillPattern(ctx, 'ice', 300, z.x, z.y, z.w, z.h, zm); }
    ctx.restore();
  },
  slow(ctx, z, zm, t) {
    ctx.save(); ctx.globalAlpha = 0.7;
    const col = z.col || '#94d82d';
    if (z.shape === 'circ') { blob(ctx, z.x, z.y, z.r, 12, 0.1, z.x, col, U.shade(col, -0.3), z.r * 0.05); for (let i = 0; i < 4; i++) circ(ctx, z.x + Math.cos(i * 1.7 + t) * z.r * 0.5, z.y + Math.sin(i * 2.3) * z.r * 0.5, z.r * 0.08 * (1 + Math.sin(t * 3 + i) * 0.5), U.shade(col, 0.4), null); }
    else { ctx.fillStyle = col; ctx.fillRect(z.x, z.y, z.w, z.h); }
    ctx.restore();
  },
  paint(ctx, z, zm, t) {
    const col = PAINT[z.color];
    blob(ctx, z.x, z.y, z.r, 11, 0.16, z.x * 0.01, col, U.shade(col, -0.4), z.r * 0.06);
    for (let i = 0; i < 6; i++) { const a = i * 1.05 + 0.3; circ(ctx, z.x + Math.cos(a) * z.r * 1.15, z.y + Math.sin(a) * z.r * 1.15, z.r * 0.1, col, null); }
    hl(ctx, z.x - z.r * 0.3, z.y - z.r * 0.3, z.r * 0.3, z.r * 0.12, 0.45);
    // ведро
    const bx = z.x + z.r * 0.8, by = z.y - z.r * 0.8, br = z.r * 0.35;
    poly(ctx, [bx - br, by - br, bx + br, by - br, bx + br * 0.8, by + br, bx - br * 0.8, by + br], '#dee2e6', OL, br * 0.12);
    rect(ctx, bx - br, by - br * 0.3, br * 2, br * 0.5, br * 0.1, col, null);
  },
  lava(ctx, z, zm, t) {
    ctx.save();
    if (z.shape === 'circ') { ctx.beginPath(); ctx.arc(z.x, z.y, z.r, 0, TAU); } else { ctx.beginPath(); ctx.rect(z.x, z.y, z.w, z.h); }
    ctx.clip();
    const bx = z.shape === 'circ' ? z.x - z.r : z.x, by = z.shape === 'circ' ? z.y - z.r : z.y, bw = z.shape === 'circ' ? z.r * 2 : z.w, bh = z.shape === 'circ' ? z.r * 2 : z.h;
    if (z.frozen) {
      BG.fillPattern(ctx, 'ice', 300, bx, by, bw, bh, zm);
      ctx.fillStyle = 'rgba(255,107,0,0.15)'; ctx.fillRect(bx, by, bw, bh);
    } else {
      const g = ctx.createLinearGradient(bx, by, bx + bw, by + bh); g.addColorStop(0, '#ff6b00'); g.addColorStop(0.5, '#ffd43b'); g.addColorStop(1, '#ff3b00'); ctx.fillStyle = g; ctx.fillRect(bx, by, bw, bh);
      const s = Math.max(60, Math.min(bw, bh) * 0.3);
      for (let x = bx; x < bx + bw; x += s) for (let y = by; y < by + bh; y += s) {
        const k = ((x * 13 + y * 7) % 100) / 100;
        const ph = (t * 0.6 + k * 5) % 1;
        ctx.globalAlpha = 1 - ph; circ(ctx, x + s * k, y + s * ((k * 3) % 1), s * 0.18 * ph + 2, '#fff3bf', '#ff8c00', s * 0.03);
      }
      ctx.globalAlpha = 0.25; ctx.fillStyle = '#7a1f00';
      for (let x = bx; x < bx + bw; x += s * 1.3) { ctx.beginPath(); ctx.ellipse(x + Math.sin(t + x) * s * 0.2, by + bh / 2 + Math.cos(t * 0.7 + x) * bh * 0.3, s * 0.4, s * 0.12, 0.4, 0, TAU); ctx.fill(); }
    }
    ctx.restore();
  },
  hazard(ctx, z, zm, t) {
    const col = z.col || '#3bc9db';
    const k = z.life !== undefined && z.maxLife ? z.life / z.maxLife : 1;
    ctx.save(); ctx.globalAlpha = 0.55 * Math.min(1, k * 3);
    if (z.shape === 'circ') { blob(ctx, z.x, z.y, z.r, 12, 0.12, z.x * 0.03, col, U.shade(col, -0.35), z.r * 0.05); ctx.globalAlpha *= 0.6; circ(ctx, z.x, z.y, z.r * (0.6 + 0.3 * Math.sin(t * 4)), null, '#fff', z.r * 0.04); }
    else { ctx.fillStyle = col; ctx.fillRect(z.x, z.y, z.w, z.h); }
    ctx.restore();
  },
  vortex(ctx, z, zm, t) {
    ctx.save(); ctx.globalAlpha = 0.6;
    for (let i = 0; i < 5; i++) { ctx.beginPath(); for (let k = 0; k <= 40; k++) { const a = k * 0.25 + i * TAU / 5 - t * 2, d = z.r * (1 - k / 40); k ? ctx.lineTo(z.x + Math.cos(a) * d, z.y + Math.sin(a) * d) : ctx.moveTo(z.x + Math.cos(a) * d, z.y + Math.sin(a) * d); } ctx.lineWidth = z.r * 0.04; ctx.strokeStyle = i % 2 ? '#a5d8ff' : '#fff'; ctx.stroke(); }
    circ(ctx, z.x, z.y, z.r * 0.15, '#0b3d75', null);
    ctx.restore();
  },
  water(ctx, z, zm, t) { // декоративная вода
    ctx.save(); ctx.beginPath(); ctx.rect(z.x, z.y, z.w, z.h); ctx.clip(); BG.fillPattern(ctx, 'ocean', 600, z.x, z.y, z.w, z.h, zm); ctx.restore();
  },
};

// ---------- триггеры ----------
const TrigDraw = {
  button(ctx, tr, z, t) {
    const r = tr.r, col = tr.col || '#e03131';
    circ(ctx, tr.x, tr.y, r, '#495057', OL, r * 0.1);
    const press = tr.flashT > 0 ? 0.6 : 1;
    if (tr.flashT > 0) tr.flashT -= 1 / 60;
    circ(ctx, tr.x, tr.y - r * 0.1 * press, r * 0.7, tr.pressed ? U.shade(col, 0.3) : col, OL, r * 0.08);
    hl(ctx, tr.x - r * 0.2, tr.y - r * 0.35, r * 0.25, r * 0.1, 0.5);
    if (tr.minR) { ctx.fillStyle = '#fff'; ctx.font = `900 ${r * 0.5}px sans-serif`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('⚖', tr.x, tr.y); }
  },
  plate(ctx, tr, z, t) {
    const r = tr.r;
    rect(ctx, tr.x - r, tr.y - r, r * 2, r * 2, r * 0.2, tr.active ? '#69db7c' : '#868e96', OL, r * 0.08);
    rect(ctx, tr.x - r * 0.75, tr.y - r * 0.75, r * 1.5, r * 1.5, r * 0.15, tr.active ? '#b2f2bb' : '#adb5bd', null);
    ctx.save(); ctx.globalAlpha = tr.active ? 0.9 : 0.5;
    for (let i = 0; i < 4; i++) { ctx.save(); ctx.translate(tr.x, tr.y); ctx.rotate(i * Math.PI / 2); poly(ctx, [-r * 0.2, -r * 0.65, r * 0.2, -r * 0.65, 0, -r * 0.4], OL, null); ctx.restore(); }
    ctx.restore();
  },
  hold(ctx, tr, z, t) { // вентиль
    const r = tr.r;
    circ(ctx, tr.x, tr.y, r, tr.done ? '#2b8a3e' : '#495057', OL, r * 0.08);
    ctx.save(); ctx.translate(tr.x, tr.y); ctx.rotate((tr.p || 0) * TAU * 2 + (tr.done ? 0 : 0));
    circ(ctx, 0, 0, r * 0.65, null, tr.col || '#e03131', r * 0.15);
    for (let i = 0; i < 4; i++) { ctx.rotate(Math.PI / 2); line(ctx, 0, 0, r * 0.65, 0, tr.col || '#e03131', r * 0.12); }
    ctx.restore();
    if (!tr.done && tr.p > 0) { ctx.beginPath(); ctx.arc(tr.x, tr.y, r * 1.15, -Math.PI / 2, -Math.PI / 2 + tr.p * TAU); ctx.lineWidth = r * 0.15; ctx.strokeStyle = '#ffd43b'; ctx.stroke(); }
  },
  sign(ctx, tr, z, t) {
    if (tr.hidden || tr.invisible) return;
    const r = Math.min(tr.r * 0.25, 20);
    ctx.save(); ctx.globalAlpha = tr.shown ? 0.4 : 0.9;
    circ(ctx, tr.x, tr.y + Math.sin(t * 3) * r * 0.2, r, '#ffd43b', OL, r * 0.12);
    ctx.fillStyle = OL; ctx.font = `900 ${r * 1.3}px sans-serif`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('?', tr.x, tr.y + Math.sin(t * 3) * r * 0.2 + r * 0.05);
    ctx.restore();
  },
  portal(ctx, tr, z, t) {
    const col = tr.col || '#b197fc';
    ctx.save();
    for (let i = 0; i < 3; i++) { ctx.globalAlpha = 0.5 - i * 0.12; circ(ctx, tr.x, tr.y, tr.r * (1 - i * 0.25), null, col, tr.r * 0.12); }
    ctx.globalAlpha = 0.8;
    for (let i = 0; i < 6; i++) { const a = t * 3 + i * TAU / 6; circ(ctx, tr.x + Math.cos(a) * tr.r * 0.7, tr.y + Math.sin(a) * tr.r * 0.7, tr.r * 0.08, '#fff', null); }
    circ(ctx, tr.x, tr.y, tr.r * 0.3, U.rgba(col, 0.7), null);
    ctx.restore();
  },
  simon(ctx, tr, z, t) {
    const lit = tr.lit;
    // консоль
    rect(ctx, tr.x - tr.r, tr.y - tr.r * 0.6, tr.r * 2, tr.r * 1.2, tr.r * 0.2, '#343a40', OL, tr.r * 0.06);
    rect(ctx, tr.x - tr.r * 0.8, tr.y - tr.r * 0.45, tr.r * 1.6, tr.r * 0.5, tr.r * 0.1, tr.state === 'done' ? '#69db7c' : '#1864ab', null);
    ctx.fillStyle = '#fff'; ctx.font = `900 ${tr.r * 0.25}px sans-serif`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(tr.state === 'done' ? 'ОТКРЫТО' : tr.state === 'input' ? (tr.step + '/' + tr.seq.length) : 'ПОВТОРИ', tr.x, tr.y - tr.r * 0.2);
    for (let i = 0; i < tr.pads.length; i++) {
      const p = tr.pads[i];
      const on = lit === i || (tr.pressT && tr.pressI === i && tr.pressT > 0);
      ctx.save();
      if (on) { ctx.globalAlpha = 0.5; circ(ctx, p.x, p.y, p.r * 1.5, p.col, null); ctx.globalAlpha = 1; }
      rect(ctx, p.x - p.r, p.y - p.r, p.r * 2, p.r * 2, p.r * 0.3, on ? U.shade(p.col, 0.45) : U.shade(p.col, -0.35), OL, p.r * 0.08);
      ctx.restore();
    }
  },
};

// ---------- снаряды ----------
const ProjDraw = {
  net(ctx, p, z, t) {

    c.fillStyle = '#a5d8ff'; c.fillRect(0, 0, N, N);
    for (let i = 0; i < 30; i++) line(c, r() * N, r() * N, r() * N, r() * N, 'rgba(255,255,255,0.7)', 3);
  },
});

const WALLSTYLE = {
  lab: { pat: 'officewall', T: 300, border: '#2b2d42' },
  office: { pat: 'officewall', T: 300, border: '#2b2d42' },
  brick: { pat: 'brick', T: 300, border: '#3d1c14' },
  hedge: { pat: 'hedge', T: 500, border: '#1b5e20' },
  rock: { pat: 'rockwall', T: 600, border: '#2b231e' },
  metal: { pat: 'metalwall', T: 300, border: '#1e2128' },
  pipe: { pat: 'pipewall', T: 300, border: '#1e2128' },
  sandbags: { pat: 'sandbags', T: 300, border: '#5c4d30' },
  crystal: { pat: 'crystalwall', T: 400, border: '#120a24' },
  station: { pat: 'station', T: 500, border: '#120a24' },
  ice: { pat: 'icewall', T: 300, border: '#1864ab' },
  books: { books: true, border: '#3b2412' },
};
const PAINT = { red: '#ff4d4d', blue: '#4d7cff', green: '#3ddc84', yellow: '#ffd23f', purple: '#b04dff' };

// ============================================================
class World {
  constructor(def) {
    this.def = def;
    this.rng = U.rng(def.seed || 12345);
    this.items = []; this.walls = []; this.lasers = []; this.zones = []; this.triggers = [];
    this.projs = []; this.parts = []; this.floats = []; this.eating = []; this.warns = []; this.floor = [];
    this.plats = []; this.checkpoint = { x: def.start.x, y: def.start.y };
    this.byId = {}; this.flags = {}; this.keys = {}; this.data = {}; this.uidc = 0; this.clearRects = [];
    this.time = 0; this.score = 0; this.combo = 0; this.comboT = 0; this.capture = 0;
    this.toasts = []; this.radioQ = []; this.radioCur = null; this.boss = null;
    this.won = false; this.failed = false; this.endT = 0; this.paused = false; this.pushX = 0; this.pushY = 0;
    this.wallsDirty = true; this.needSort = true; this.shownTips = {}; this.milestonesDone = {};
    this.stats = { eaten: 0, biggest: '', hurt: 0 };
    const st = def.start;
    this.P = { x: st.x, y: st.y, vx: 0, vy: 0, r: st.r, rd: st.r, dir: 0, spd01: 0, inv: 0, stun: 0, slow: 0, freeze: 0,
      dashT: 0, dashCD: 0, dashDir: 0, chomp: 0, air: 0, falling: 0, color: null, pw: { speed: 0, magnet: 0, shield: 0 }, hurtT: 0, lastPort: 0 };
    this.minR = st.r * (def.minK || 0.7);
    this.W = def.world.w; this.H = def.world.h;
    this.cam = { x: st.x, y: st.y, zoom: 1, shake: 0, sx: 0, sy: 0 };
    const b = new Builder(this);
    def.build(b);
    b.finish();
    this.objectives = (def.objectives || [{ type: 'size' }]).map(o => Object.assign({ n: 0, done: false }, o));
    for (const o of this.objectives) if (o.type === 'size') { o.target = o.target || def.goal.r; o.text = o.text || ('Вырасти до ' + this.sizeText(o.target)); }
    this.buildWallGrid();
    if (def.init) def.init(this);
    this.prewarm();
  }
  // Заранее рисуем спрайты мелких размеров, чтобы не было подтормаживаний
  prewarm() {
    const seen = new Set();
    for (const it of this.items) {
      if (it.draw) continue;
      const k = (it.spr || it.t) + '|' + it.v;
      if (seen.has(k)) continue;
      seen.add(k);
      Sprites.get(it.spr || it.t, it.v, 12); Sprites.get(it.spr || it.t, it.v, 32);
    }
    this.warmQ = [...seen];
  }

  // ---------- утилиты ----------
  sizeText(r) { return U.formatSize(r * 2 * this.def.unit); }
  toast(text, col = '#fff', dur = 2.6) {
    const ex = this.toasts.find(t => t.text === text);
    if (ex) { ex.t = Math.min(ex.t, 0.3); ex.dur = Math.max(ex.dur, dur); return; }
    this.toasts.push({ text, col, t: 0, dur }); if (this.toasts.length > 4) this.toasts.shift();
  }
  radio(who, text, expr = 'normal', dur = 0) {
    if (this.radioQ.length > 4) return;
    this.radioQ.push({ who, text, expr, dur: dur || Math.max(2.8, text.length * 0.055 + 1.5), t: 0 });
  }
  tip(key, text, col = '#ffe066') { if (this.shownTips[key]) return; this.shownTips[key] = true; this.toast(text, col, 4); }
  flag(name, v = true) { this.flags[name] = v; this.checkDoors(); }
  inWorld(x, y, pad = 0) {
    const w = this.def.world;
    if (w.shape === 'circle') return U.dist(x, y, w.w / 2, w.h / 2) <= w.w / 2 - pad;
    return x >= pad && y >= pad && x <= this.W - pad && y <= this.H - pad;
  }
  canEat(it) {
    if (it.dead || it.noEat) return false;
    if (it.alwaysEat) return true;
    if (it.ed && this.P.r < it.ed) return false;
    return it.r <= this.P.r * EAT;
  }

  // ---------- сетка стен (для быстрых столкновений) ----------
  buildWallGrid() {
    const G = this.gridSize = 500;
    this.wgrid = new Map();
    for (const w of this.walls) {
      if (w.dead) continue;
      for (let gx = Math.floor(w.x / G); gx <= Math.floor((w.x + w.w) / G); gx++)
        for (let gy = Math.floor(w.y / G); gy <= Math.floor((w.y + w.h) / G); gy++) {
          const k = gx * 10007 + gy;
          if (!this.wgrid.has(k)) this.wgrid.set(k, []);
          this.wgrid.get(k).push(w);
        }
    }
    this.wallsDirty = true;
  }
  wallsNear(x, y, r) {
    const G = this.gridSize, out = this._wn || (this._wn = []);
    out.length = 0; const seen = this._ws || (this._ws = new Set()); seen.clear();
    for (let gx = Math.floor((x - r) / G); gx <= Math.floor((x + r) / G); gx++)
      for (let gy = Math.floor((y - r) / G); gy <= Math.floor((y + r) / G); gy++) {
        const arr = this.wgrid.get(gx * 10007 + gy);
        if (arr) for (const w of arr) if (!seen.has(w)) { seen.add(w); out.push(w); }
      }
    return out;
  }
  wallBlocks(w, forPlayer) {
    if (w.dead) return false;
    if (w.door && w.door.open >= 1) return false;
    if (w.door && w.door.open > 0.6) return false;
    if (w.gate && forPlayer && this.P.color === w.gate) return false;
    return true;
  }
  // Выталкивание круга из стен. Возвращает true, если было касание.
  collideWalls(o, forPlayer = false) {
    let hit = false;
    for (const w of this.wallsNear(o.x, o.y, o.r)) {
      if (!this.wallBlocks(w, forPlayer)) continue;
      const res = U.circleRect(o.x, o.y, o.r, w.x, w.y, w.w, w.h);
      if (!res) continue;
      if (forPlayer && this.onPlayerWall(w)) continue;
      o.x += res.nx * res.depth; o.y += res.ny * res.depth;
      const vn = (o.vx || 0) * res.nx + (o.vy || 0) * res.ny;
      if (vn < 0) { o.vx -= vn * res.nx; o.vy -= vn * res.ny; }
      hit = w;
    }
    // граница мира
    const wd = this.def.world;
    if (wd.shape === 'circle') {
      const cx = wd.w / 2, cy = wd.h / 2, R = wd.w / 2;
      const d = U.dist(o.x, o.y, cx, cy);
      if (d > R - o.r) { const nx = (o.x - cx) / d, ny = (o.y - cy) / d; o.x = cx + nx * (R - o.r); o.y = cy + ny * (R - o.r); hit = hit || true; const vn = (o.vx || 0) * nx + (o.vy || 0) * ny; if (vn > 0) { o.vx -= vn * nx; o.vy -= vn * ny; } }
    } else {
      if (o.x < o.r) { o.x = o.r; if (o.vx < 0) o.vx = 0; hit = hit || true; }
      if (o.y < o.r) { o.y = o.r; if (o.vy < 0) o.vy = 0; hit = hit || true; }
      if (o.x > this.W - o.r) { o.x = this.W - o.r; if (o.vx > 0) o.vx = 0; hit = hit || true; }
      if (o.y > this.H - o.r) { o.y = this.H - o.r; if (o.vy > 0) o.vy = 0; hit = hit || true; }
    }
    return hit;
  }
  // Никита касается стены: съесть / открыть ключом / разбить рывком
  onPlayerWall(w) {
    const P = this.P;
    if (w.ed && P.r >= w.ed) { this.eatWall(w); return true; }
    if (w.door && w.door.need && w.door.need.startsWith('key:')) {
      const col = w.door.need.slice(4);
      if (this.keys[col] && !w.door.opening) { this.openDoor(w); return false; }
      if (!this.keys[col]) this.tip('needkey' + col, 'Нужна ' + ({ red: 'красная', blue: 'синяя', yellow: 'жёлтая', green: 'зелёная', purple: 'фиолетовая' }[col] || '') + ' ключ-карта!', PAINT[col]);
    }
    if (w.gate && P.color !== w.gate) this.tip('gate' + w.gate, 'Барьер пропускает только ' + ({ red: 'КРАСНОГО', blue: 'СИНЕГО', green: 'ЗЕЛЁНОГО', yellow: 'ЖЁЛТОГО', purple: 'ФИОЛЕТОВОГО' }[w.gate]) + ' Никиту. Найди лужу краски!', PAINT[w.gate]);
    if (w.dash && P.dashT > 0) { this.breakWall(w); return true; }
    if (w.dash) this.tip('dashwall', 'Треснувшая стена! Разбей её рывком (ПРОБЕЛ)');
    return false;
  }
  eatWall(w) {
    if (w.dead) return;
    w.dead = true; this.buildWallGrid();
    const P = this.P;
    const area = Math.min(w.w * w.h, P.r * P.r * 6) * 0.22 * (this.def.growK || 0.35);
    P.r = Math.sqrt(P.r * P.r + area);
    for (let i = 0; i < 18; i++) this.part('dot', w.x + Math.random() * w.w, w.y + Math.random() * w.h, (Math.random() - 0.5) * P.r * 6, (Math.random() - 0.5) * P.r * 6, P.r * 0.15, (WALLSTYLE[w.style] || {}).border || '#888', 0.8);
    Sound.play('crunch'); this.cam.shake = Math.max(this.cam.shake, 6);
    this.score += 50; P.chomp = 1;
  }
  breakWall(w) {
    if (w.dead) return;
    w.dead = true; this.buildWallGrid();
    for (let i = 0; i < 30; i++) this.part('dot', w.x + Math.random() * w.w, w.y + Math.random() * w.h, (Math.random() - 0.5) * 400, (Math.random() - 0.5) * 400, Math.min(w.w, w.h) * 0.25, '#8a8f99', 1);
    Sound.play('boom'); this.cam.shake = 14; this.toast('БАБАХ!', '#ffd43b', 1.2);
  }
  openDoor(w) {
    if (!w.door || w.door.opening) return;
    w.door.opening = true;
    Sound.play('door');
    this.toast(w.door.msg || 'Дверь открыта!', '#69db7c', 1.8);
  }
  checkDoors() {
    for (const w of this.walls) {
      if (!w.door || w.door.opening) continue;
      const need = w.door.need || '';
      if (need === 'plates') { const ps = this.triggers.filter(t => t.k === 'plate' && t.door === w.id); if (ps.length && ps.every(p => p.active)) this.openDoor(w); }
      else if (need.startsWith('flag:')) { if (this.flags[need.slice(5)]) this.openDoor(w); }
    }
  }

  // ---------- частицы ----------
  part(k, x, y, vx, vy, size, col, life = 0.8, extra) {
    if (this.parts.length > 700) this.parts.shift();
    const p = { k, x, y, vx, vy, s: size, col, life, max: life, rot: Math.random() * TAU };
    if (extra) Object.assign(p, extra);
    this.parts.push(p);
    return p;
  }
  floatText(x, y, text, col = '#fff', size = 1) { this.floats.push({ x, y, text, col, t: 0, size }); if (this.floats.length > 40) this.floats.shift(); }
  burst(x, y, n, col, speed, size, life = 0.7) {
    for (let i = 0; i < n; i++) { const a = Math.random() * TAU, s = speed * (0.3 + Math.random()); this.part('dot', x, y, Math.cos(a) * s, Math.sin(a) * s, size * (0.5 + Math.random() * 0.8), col, life * (0.6 + Math.random() * 0.6)); }
  }
  // Предупреждение-зона (капля/снаряд/лава): через dur сек «бабах»
  warn(x, y, r, dur, cb, col = '#ff4d4d', label = '') {
    const w = { x, y, r, t: 0, dur, cb, col, label };
    this.warns.push(w); return w;
  }

  // ---------- урон ----------
  hurt(amount, sx, sy, kind = 'hurt') {
    const P = this.P;
    if (this.won || this.failed) return false;
    if (P.inv > 0) return false;
    if (P.pw.shield > 0) { P.inv = 0.4; this.burst(P.x, P.y, 8, '#74c0fc', P.r * 4, P.r * 0.12); Sound.play('pop'); return false; }
    const atMin = P.r <= this.minR * 1.03;
    P.r = Math.max(this.minR, P.r * (1 - amount));
    P.inv = 1.1; P.hurtT = 0.35;
    if (sx !== undefined) { const a = U.angle(sx, sy, P.x, P.y); P.vx = Math.cos(a) * P.r * 9; P.vy = Math.sin(a) * P.r * 9; }
    this.burst(P.x, P.y, 14, P.color ? PAINT[P.color] : '#b07cff', P.r * 5, P.r * 0.14);
    this.cam.shake = Math.max(this.cam.shake, 10);
    Sound.play('hurt');
    this.stats.hurt++;
    this.combo = 0;
    if (atMin) {
      this.capture += 0.34;
      if (this.capture >= 1) { this.fail(); }
      else this.toast('Осторожно! Ещё немного — и Никиту поймают!', '#ff6b6b', 2.2);
    }
    if (this.def.onHurt) this.def.onHurt(this, kind);
    return true;
  }
  stunPlayer(t) { const P = this.P; if (P.pw.shield > 0 || P.inv > 0) return; P.stun = Math.max(P.stun, t); P.inv = Math.max(P.inv, 0.3); Sound.play('stun'); this.toast('Никиту опутало сеткой!', '#ffd43b', 1.5); }
  fail() { if (this.failed || this.won) return; this.failed = true; this.endT = 0; Sound.play('lose'); }
  win() { if (this.won || this.failed) return; this.won = true; this.endT = 0; Sound.play('win'); this.cam.shake = 12; }

  // ---------- поедание ----------
  eat(it) {
    const P = this.P;
    it.dead = true;
    this.eating.push({ it, t: 0, sx: it.x, sy: it.y });
    const k = (this.def.growK || 0.35) * (it.food === undefined ? 1 : it.food);
    const add = Math.min(it.r * it.r, P.r * P.r * 2.5) * k;
    const before = P.r;
    P.r = Math.sqrt(P.r * P.r + add);
    P.chomp = 1;
    const rel = it.r / P.r;
    this.combo = this.comboT > 0 ? this.combo + 1 : 1; this.comboT = 1.1;
    const pts = Math.ceil((it.pts || 10 * Math.sqrt(it.r / this.def.start.r)) * (1 + Math.min(this.combo, 20) * 0.1));
    this.score += pts;
    this.stats.eaten++;
    if (rel > 0.35 || it.pts) this.floatText(it.x, it.y - it.r, '+' + pts + (this.combo > 2 ? ' ×' + this.combo : ''), this.combo > 5 ? '#ffd43b' : '#fff', Math.max(0.6, rel));
    const col = it.col || Sprites.colorOf(it.spr || it.t, it.v);
    this.burst(it.x, it.y, rel > 0.4 ? 10 : 4, col, P.r * 2.5, Math.max(it.r * 0.25, P.r * 0.05), 0.5);
    if (rel > 0.55) { Sound.play('bigeat'); this.cam.shake = Math.max(this.cam.shake, 4 * rel); }
    else Sound.play('eat', U.clamp(rel, 0, 1));
    if (it.tag) for (const o of this.objectives) if (o.type === 'count' && o.tag === it.tag && !o.done) { o.n++; if (o.n >= o.target) { o.done = true; this.toast('✔ ' + o.text, '#69db7c', 2.5); Sound.play('chime'); } }
    if (it.key) { this.keys[it.key] = true; Sound.play('key'); this.toast('Найдена ' + ({ red: 'КРАСНАЯ', blue: 'СИНЯЯ', yellow: 'ЖЁЛТАЯ', green: 'ЗЕЛЁНАЯ', purple: 'ФИОЛЕТОВАЯ' }[it.key] || '') + ' ключ-карта!', PAINT[it.key], 2.5); }
    if (it.pw) this.powerup(it.pw);
    if (it.who) this.onEatScientist(it);
    if (it.onEat) it.onEat(this, it);
    if (this.def.onEat) this.def.onEat(this, it);
    // вехи
    for (const m of (this.def.milestones || [])) if (!this.milestonesDone[m.r] && before < m.r && P.r >= m.r) {
      this.milestonesDone[m.r] = true;
      if (m.who) this.radio(m.who, m.text, m.expr || 'shock'); else this.toast(m.text, '#ffe066', 3.5);
      Sound.play('grow');
    }
  }
  onEatScientist(it) {
    const name = CH[it.who] ? CH[it.who].name : it.who;
    this.toast(name + ' проглочен! (не волнуйся, его выплюнут)', '#ffa8a8', 3);
    if (it.who === 'kirill' && this.byId.natasha && !this.byId.natasha.dead) { this.byId.natasha.say = { text: 'КИРЮША!!!', t: 2.5 }; this.byId.natasha.data.rage = 15; }
    if (it.who === 'natasha' && this.byId.kirill && !this.byId.kirill.dead) { this.byId.kirill.say = { text: 'Наташа пропала! Ура, свобода!', t: 3 }; this.byId.kirill.data.free = true; }
  }
  powerup(k) {
    const P = this.P;
    Sound.play('power');
    switch (k) {
      case 'speed': P.pw.speed = 7; this.toast('ПЕРЕЦ! Скорость ×1.6', '#ff6b6b'); break;
      case 'magnet': P.pw.magnet = 9; this.toast('МАГНИТ! Еда летит к тебе', '#ff8787'); break;
      case 'shield': P.pw.shield = 8; this.toast('ЩИТ! Ловушки не страшны', '#74c0fc'); break;
      case 'grow': P.r *= 1.12; this.toast('ГРИБ РОСТА! +12% размера', '#69db7c'); this.burst(P.x, P.y, 20, '#69db7c', P.r * 4, P.r * 0.1); break;
      case 'time': this.time = Math.max(0, this.time - 15); this.toast('−15 секунд к таймеру!', '#ffd43b'); break;
      case 'pie': P.r *= 1.08; P.pw.shield = Math.max(P.pw.shield, 4); this.toast('Пирожок от Наташи! Вкусно и безопасно', '#ffc078'); break;
    }
  }

  // ============================================================
  //  ОБНОВЛЕНИЕ
  // ============================================================
  update(dt, input) {
    this.dtLast = dt;
    if (this.won || this.failed) { this.endT += dt; this.updateParts(dt); this.updateCamera(dt, input); return; }
    this.time += dt;
    const P = this.P;
    // таймеры
    P.inv -= dt; P.stun -= dt; P.slow -= dt; P.freeze -= dt; P.dashCD -= dt; P.hurtT -= dt; P.lastPort -= dt; P.air = Math.max(0, P.air - dt);
    for (const k in P.pw) P.pw[k] = Math.max(0, P.pw[k] - dt);
    P.chomp = Math.max(0, P.chomp - dt * 4);
    this.comboT -= dt; if (this.comboT <= 0) this.combo = 0;
    this.capture = Math.max(0, this.capture - dt * 0.04);

    if (this.def.pit) this.updatePlats(dt);
    this.updatePlayer(dt, input);
    if (this.def.pit) this.playerPlatform(dt);
    this.updateZones(dt);
    this.updateTriggers(dt);
    this.updateItems(dt);
    this.updateProjs(dt);
    this.updateLasers(dt);
    this.updateWarns(dt);
    this.updateDoors(dt);
    if (this.def.update) this.def.update(this, dt);
    this.respawn(dt);
    this.updateParts(dt);
    this.updateCamera(dt, input);
    // постепенно догреваем крупные версии спрайтов
    if (this.warmQ && this.warmQ.length) for (let i = 0; i < 2 && this.warmQ.length; i++) { const [n, v] = this.warmQ.pop().split('|'); Sprites.get(n, isNaN(+v) ? v : +v, 80); }
    // отображаемый радиус плавно догоняет реальный
    P.rd += (P.r - P.rd) * (1 - Math.exp(-6 * dt));
    // цели
    let all = true;
    for (const o of this.objectives) {
      if (o.type === 'size') { o.n = P.r; if (!o.done && P.r >= o.target) { o.done = true; } }
      if (o.type === 'flag') o.done = !!this.flags[o.flag];
      if (!o.done) all = false;
    }
    if (all) this.win();
    // радио
    if (!this.radioCur && this.radioQ.length) this.radioCur = this.radioQ.shift();
    if (this.radioCur) { this.radioCur.t += dt; if (this.radioCur.t > this.radioCur.dur) this.radioCur = null; }
    for (const t of this.toasts) t.t += dt;
    this.toasts = this.toasts.filter(t => t.t < t.dur);
  }

  updatePlayer(dt, input) {
    const P = this.P;
    if (P.falling > 0) { this.pushX = 0; this.pushY = 0; return; }
    let mx = 0, my = 0, mag = 0;
    if (P.stun <= 0) {
      if (input.kx || input.ky) { const l = Math.hypot(input.kx, input.ky); mx = input.kx / l; my = input.ky / l; mag = 1; }
      else if (input.mouse) {
        const dx = input.wx - P.x, dy = input.wy - P.y, d = Math.hypot(dx, dy);

    }
    let mult = 1;
    if (P.pw.speed > 0) mult *= 1.6;
    if (P.slow > 0) mult *= 0.55;
    if (P.freeze > 0) mult *= 0.35;
    if (this.zoneSlow) mult *= this.zoneSlow;
    const spd = P.r * BASE_SPD * mult;
    // рывок
    if (input.dash && P.dashCD <= 0 && P.stun <= 0) {

      P.dashDir = mag > 0.05 ? Math.atan2(my, mx) : P.dir;
      Sound.play('dash');
    }
    let k = this.onIce ? 1.4 : (this.def.swim || 9);
    if (P.air > 0 && P.launch) {
      P.vx = P.launch.vx; P.vy = P.launch.vy;
      if (Math.random() < 0.4) this.part('dot', P.x, P.y, 0, 0, P.r * 0.25, '#ffd43b', 0.3);
    } else if (P.dashT > 0) {
      P.dashT -= dt;
      P.vx = Math.cos(P.dashDir) * spd * 3.1; P.vy = Math.sin(P.dashDir) * spd * 3.1;
      if (Math.random() < 0.6) this.part('dot', P.x, P.y, -P.vx * 0.1, -P.vy * 0.1, P.r * 0.3, P.color ? PAINT[P.color] : '#b07cff', 0.35);
    } else {
      const f = 1 - Math.exp(-k * dt);

      P.vy += (my * mag * spd - P.vy) * f;
    }
    if (P.stun > 0) { P.vx *= 0.9; P.vy *= 0.9; }
    // внешние силы (течения, гравитация, всасывание)
    P.x += (P.vx + this.pushX) * dt; P.y += (P.vy + this.pushY) * dt;

    P.spd01 = U.clamp(sp / (P.r * BASE_SPD), 0, 1.5);
    this.pushX = 0; this.pushY = 0;
    // столкновения
    this.collideWalls(P, true);
    this.playerVsItems(dt);
  }

  playerVsItems(dt) {
    const P = this.P;
    const magnet = P.pw.magnet > 0;
    const magR = P.r * 8;
    for (let i = 0; i < this.items.length; i++) {
      const it = this.items[i];
      if (it.dead || it.ghost) continue;
      const dx = it.x - P.x, dy = it.y - P.y;
      if (magnet && Math.abs(dx) < magR && Math.abs(dy) < magR && !it.static && this.canEat(it) && !it.noMag) {
        const d = Math.hypot(dx, dy) || 1;
        if (d < magR) { const pull = P.r * 7 * dt; it.x -= dx / d * pull; it.y -= dy / d * pull; }
      }
      const rr = P.r + it.r;
      if (dx > rr || dx < -rr || dy > rr || dy < -rr) continue;
      const d2 = dx * dx + dy * dy;
      if (d2 > rr * rr) continue;
      const d = Math.sqrt(d2) || 0.001;
      if (this.canEat(it)) {
        if (d < P.r + it.r * 0.35) this.eat(it);
        continue;
      }
      if (it.onTouch) it.onTouch(this, it);
      if (it.hz && !it.harmless) this.hurt(it.hz, it.x, it.y, 'touch');
      if (it.solid === false) continue;
      const nx = dx / d, ny = dy / d, over = rr - d;
      if (it.mov) {
        const mp = P.r * P.r, mi = (it.mass || it.r * it.r) * (it.heavy || 1);
        const share = mp / (mp + mi);
        it.x += nx * over * share; it.y += ny * over * share;
        it.vx = (it.vx || 0) + nx * 10; it.vy = (it.vy || 0) + ny * 10;
        this.collideWalls(it);
        const d3 = Math.hypot(it.x - P.x, it.y - P.y) || 0.001;
        const over2 = P.r + it.r - d3;
        if (over2 > 0) { P.x -= (it.x - P.x) / d3 * over2; P.y -= (it.y - P.y) / d3 * over2; }
      } else {
        P.x -= nx * over; P.y -= ny * over;
        const vn = P.vx * nx + P.vy * ny;
        if (vn > 0) { P.vx -= vn * nx; P.vy -= vn * ny; }
        if (vn > P.r * 2 && !it.hz) {
          it.flash = 0.35; Sound.play('bonk');
          if (!it.boss) this.tip('toobig', 'Это пока слишком большое — сначала подрасти!', '#ffa8a8');
        }
      }
      if (it.boss && P.dashT > 0 && it.onDashHit) it.onDashHit(this, it);
    }
  }

  updateZones(dt) {
    const P = this.P;

    let slow = 1;
    for (const z of this.zones) {
      if (z.off) continue;

      const inside = (x, y, r) => z.shape === 'circ' ? U.dist(x, y, z.x, z.y) < z.r + r * 0.3 : U.pointInRect(x, y, z.x - r * 0.3, z.y - r * 0.3, z.w + r * 0.6, z.h + r * 0.6);
      if (!inside(P.x, P.y, P.r)) continue;
      switch (z.k) {
        case 'current': case 'conveyor': { const s = (z.str || 1) * P.r * BASE_SPD * (z.abs ? 0 : 1) + (z.abs || 0); this.pushX += z.dx * s; this.pushY += z.dy * s; break; }
        case 'ice': this.onIce = true; break;
        case 'slow': slow = Math.min(slow, z.mult || 0.5); break;
        case 'paint': if (P.color !== z.color) { P.color = z.color; Sound.play('splash'); this.toast('Никита теперь ' + ({ red: 'КРАСНЫЙ', blue: 'СИНИЙ', green: 'ЗЕЛЁНЫЙ', yellow: 'ЖЁЛТЫЙ', purple: 'ФИОЛЕТОВЫЙ' }[z.color]) + '!', PAINT[z.color]); this.burst(P.x, P.y, 16, PAINT[z.color], P.r * 3, P.r * 0.15); } break;
        case 'lava': if (!z.frozen && !(z.safeR && P.r >= z.safeR)) this.hurt(z.hz || 0.1, P.x - P.vx, P.y - P.vy, 'lava'); break;
        case 'hazard': if (!(z.safeR && P.r >= z.safeR)) this.hurt(z.hz || 0.08, z.shape === 'circ' ? z.x : P.x - P.vx, z.shape === 'circ' ? z.y : P.y - P.vy, 'zone'); break;
        case 'vortex': { const d = U.dist(P.x, P.y, z.x, z.y) || 1; const s = P.r * BASE_SPD * (z.str || 0.6); this.pushX += (z.x - P.x) / d * s - (z.y - P.y) / d * s * 0.8; this.pushY += (z.y - P.y) / d * s + (z.x - P.x) / d * s * 0.8; if (d < z.r * 0.18 && z.to && P.lastPort <= 0) { P.x = z.to.x; P.y = z.to.y; P.lastPort = 2; Sound.play('teleport'); this.toast('Водоворот выплюнул Никиту!', '#74c0fc'); } break; }
      }

  }

  updateTriggers(dt) {
    const P = this.P;
    for (const tr of this.triggers) {
      tr.t = (tr.t || 0) + dt;
      const d = U.dist(P.x, P.y, tr.x, tr.y);
      const on = d < tr.r + P.r * 0.4;
      switch (tr.k) {
        case 'button':
          tr.cd = (tr.cd || 0) - dt;
          if (on && !tr.inside && tr.cd <= 0 && (!tr.minR || P.r >= tr.minR) && !(tr.once && tr.used)) {
            tr.pressed = !tr.pressed; tr.used = true; tr.cd = 0.6; tr.flashT = 0.4;
            Sound.play('button');
            this.fire(tr.act, tr);
          }
          if (on && tr.minR && P.r < tr.minR) this.tip('btnheavy' + tr.id, 'Слишком лёгкий! Кнопка нажмётся, когда Никита станет больше', '#ffa8a8');
          tr.inside = on;
          break;
        case 'plate': {
          let act = on && (!tr.minR || P.r >= tr.minR);
          if (!act) for (const it of this.items) if (it.mov && !it.dead && U.dist(it.x, it.y, tr.x, tr.y) < tr.r * 0.8) { act = true; break; }
          if (act !== tr.active) { tr.active = act; if (act) Sound.play('click'); this.checkDoors(); if (tr.act && act) this.fire(tr.act, tr); }
          break;
        }
        case 'hold':

          if (on && (!tr.minR || P.r >= tr.minR)) { tr.p = (tr.p || 0) + dt / (tr.need || 1.5); if (Math.random() < 0.3) Sound.play('click'); if (tr.p >= 1) { tr.done = true; Sound.play('chime'); this.fire(tr.act, tr); } }
          else tr.p = Math.max(0, (tr.p || 0) - dt * 0.5);
          break;
        case 'sign': if (on && !tr.shown) { tr.shown = true; if (tr.who) this.radio(tr.who, tr.text, tr.expr || 'normal'); else this.toast(tr.text, tr.col || '#ffe066', tr.dur || 4); } break;
        case 'event': if (on && !tr.done && (!tr.minR || P.r >= tr.minR)) { tr.done = true; this.fire(tr.act, tr); } break;
        case 'portal':

          }
          break;
        case 'simon': Puzzles.simonUpdate(this, tr, dt); break;
        case 'checkpoint': {

          if ((on || onPl) && !tr.active) { for (const q of this.triggers) if (q.k === 'checkpoint') q.active = false; tr.active = true; this.checkpoint = { x: tr.x, y: tr.y }; Sound.play('chime'); this.toast('Чекпоинт!', '#69db7c', 1.4); }
