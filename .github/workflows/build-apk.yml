name: Build Android APK

# Збирає самодостатній APK гри (вся гра всередині, працює офлайн)
# і кладе готовий файл у Releases (тег apk-latest) та в артефакти.

on:
  workflow_dispatch:        # можна запустити вручну з вкладки Actions
  push:
    branches: [ "claude/nice-einstein-ufg48j", "main" ]
    paths:
      - "js/**"
      - "css/**"
      - "assets/**"
      - "nikita-game.html"
      - "manifest.json"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Зібрати веб-теку (www/)
        run: |
          rm -rf www && mkdir -p www
          cp -r css js assets www/
          cp manifest.json www/ 2>/dev/null || true
          cp sw.js www/ 2>/dev/null || true
          # головною сторінкою застосунку робимо саму гру (без редіректу)
          cp nikita-game.html www/index.html
          cp nikita-game.html www/nikita-game.html
          ls -R www | head -40

      - name: Ініціалізувати Capacitor
        run: |
          npm init -y
          npm install --no-audit --no-fund @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          npx cap init "Nikita" "com.ramka1q.nikita" --web-dir=www
          npx cap add android

      - name: Зібрати debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Перейменувати APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk nikita-game.apk

      - name: Завантажити як артефакт
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nikita-game-apk
          path: nikita-game.apk
          if-no-files-found: warn

      - name: Опублікувати у Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: "Нікіта — APK (остання збірка)"
          files: nikita-game.apk
          body: |
            Самодостатній APK гри «НІКІТА: Пожирач планети».
            Завантаж `nikita-game.apk`, увімкни на телефоні «Встановлення з невідомих джерел» і встанови.
            Гра працює офлайн — нічого більше не потрібно.
