const ctx = cv.getContext('2d');
const W = 1280, H = 720;
let SC = 1, DPR = 1;

/* ============ UTILS ============ */
const rand = (a, b) => a + Math.random() * (b - a);

const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);

function rr(x, y, w, h, r) {
  r = Math.max(0, Math.min(r, w / 2, h / 2));
  ctx.beginPath(); ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}
function circ(x, y, r) { ctx.beginPath(); ctx.arc(x, y, Math.max(0, r), 0, Math.PI * 2); }
function ell(x, y, rx, ry) { ctx.beginPath(); ctx.ellipse(x, y, Math.max(0, rx), Math.max(0, ry), 0, 0, Math.PI * 2); }
function rectDist(px, py, r) { const cx = clamp(px, r.x, r.x + r.w), cy = clamp(py, r.y, r.y + r.h); return Math.hypot(px - cx, py - cy); }
function pushOut(o, r) {
  const cx = clamp(o.x, r.x, r.x + r.w), cy = clamp(o.y, r.y, r.y + r.h);
  const dx = o.x - cx, dy = o.y - cy, d = Math.hypot(dx, dy);
  if (d >= o.r) return false;
  if (d === 0) {
    const l = o.x - r.x, rt = r.x + r.w - o.x, t = o.y - r.y, b = r.y + r.h - o.y, m = Math.min(l, rt, t, b);
    if (m === l) o.x = r.x - o.r; else if (m === rt) o.x = r.x + r.w + o.r; else if (m === t) o.y = r.y - o.r; else o.y = r.y + r.h + o.r;

}

}

  const vx = bx - ax, vy = by - ay, l2 = vx * vx + vy * vy || 1;
  const t = clamp(((px - ax) * vx + (py - ay) * vy) / l2, 0, 1);

/* ============ TEXT ============ */
const FONT = '"Segoe UI","Trebuchet MS",Roboto,Arial,sans-serif';
const MEME = 'Impact,"Arial Black","Segoe UI",Roboto,sans-serif';

function txt(s, x, y, o = {}) {
  ctx.font = `${o.weight || 'bold'} ${o.size || 18}px ${o.fam || FONT}`;
  ctx.textAlign = o.align || 'center'; ctx.textBaseline = o.base || 'middle';
  if (o.stroke) { ctx.lineJoin = 'round'; ctx.lineWidth = o.sw || 4; ctx.strokeStyle = o.stroke; ctx.strokeText(s, x, y); }
  ctx.fillStyle = o.color || '#fff'; ctx.fillText(s, x, y);
}
function wrapLines(s, maxW, size, fam = FONT, w = 'bold') {
  ctx.font = `${w} ${size}px ${fam}`;
  const out = [];
  for (const para of String(s).split('\n')) {
    let line = '';
    for (const word of para.split(' ')) {
      const t = line ? line + ' ' + word : word;
      if (ctx.measureText(t).width > maxW && line) { out.push(line); line = word; } else line = t;
    }
    out.push(line);
  }
  return out;
}
function txtWrap(s, x, y, maxW, o = {}) {
  const size = o.size || 18, lh = o.lh || size * 1.3;
  const lines = wrapLines(s, maxW, size, o.fam || FONT, o.weight || 'bold');
  const y0 = o.vcenter ? y - (lines.length - 1) * lh / 2 : y;
  lines.forEach((l, i) => txt(l, x, y0 + i * lh, o));

}

  ctx.font = `bold ${size}px ${FONT}`;
  if (ctx.measureText(s).width <= maxW) return s;
  while (s.length > 2 && ctx.measureText(s + '…').width > maxW) s = s.slice(0, -1);
  return s + '…';
}
function emo(e, x, y, size) {
  ctx.font = `${size}px ${EMO}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillStyle = '#000'; ctx.fillText(e, x, y);
}

  ctx.fillStyle = bg; rr(x, y, w, h, h / 2); ctx.fill();

}

/* ============ NET (состояние соединения) ============ */
const NET = {
  mode: 'local', me: 0, kind: '', peer: null, conn: null, ws: null,
  open: false, connected: false, code: '', status: '', fxQ: [], remote: null, remotePause: false,
  sendT: 0, lastRecv: 0, helloT: 0, disp: new Map(),
};
function mkRemote() { return { x: 0, y: 0, actN: 0, thrN: 0, dashN: 0, upN: 0, downN: 0, leftN: 0, rightN: 0, pad: false }; }
NET.remote = mkRemote();
const LAN = { ok: false, ips: [], port: 0 };

/* ============ INPUT ============ */
const keys = {};
const BIND = [
  { up: ['KeyW'], down: ['KeyS'], left: ['KeyA'], right: ['KeyD'], act: ['KeyF', 'KeyE'], thr: ['KeyG', 'KeyQ'], dash: ['Space', 'KeyR'] },
  { up: ['ArrowUp'], down: ['ArrowDown'], left: ['ArrowLeft'], right: ['ArrowRight'], act: ['Enter', 'NumpadEnter', 'Numpad0', 'KeyL'], thr: ['Slash', 'NumpadDecimal', 'KeyK'], dash: ['Period', 'Numpad1', 'KeyJ'] },
];
function mkIn() { return { x: 0, y: 0, actN: 0, thrN: 0, dashN: 0, upN: 0, downN: 0, leftN: 0, rightN: 0, actP: false, thrP: false, dashP: false, upP: false, downP: false, leftP: false, rightP: false, pad: false, g: {} }; }
const IN = [mkIn(), mkIn()];
let GP = { pause: false, mute: false, back: false };
const PREVENT = ['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space', 'Enter', 'Slash', 'Period', 'Tab', 'NumpadEnter', 'Backspace', 'Quote'];
function bindsOf(i) {
  if (NET.mode !== 'local') return i === NET.me ? BIND : [];
  if (G && G.solo) return i === 0 ? BIND : [];
  return [BIND[i]];
}
addEventListener('keydown', e => {
  const c = e.code;
  if (PREVENT.includes(c)) e.preventDefault();
  initAudio();
  if (G && G.scene === 'online' && G.menu && G.menu.entry != null) { handleCodeKey(e); return; }
  if (!e.repeat) {
    for (let i = 0; i < 2; i++) for (const b of bindsOf(i)) {
      const p = IN[i];
      if (b.act.includes(c)) p.actN++;
      if (b.thr.includes(c)) p.thrN++;
      if (b.dash.includes(c)) p.dashN++;
      if (b.up.includes(c)) p.upN++;
      if (b.down.includes(c)) p.downN++;
      if (b.left.includes(c)) p.leftN++;
      if (b.right.includes(c)) p.rightN++;
    }
    if (c === 'Escape' || c === 'KeyP') GP.pause = true;
    if (c === 'KeyM') GP.mute = true;
    if (c === 'Backspace') GP.back = true;
  }
  keys[c] = true;
});
addEventListener('keyup', e => { keys[e.code] = false; });
addEventListener('mousedown', () => initAudio());
addEventListener('blur', () => { for (const k in keys) keys[k] = false; if (G && NET.mode === 'local' && (G.scene === 'home' || G.scene === 'boss')) G.paused = true; });

function pollInput() {
  let pads = [];
  try { pads = navigator.getGamepads ? [...navigator.getGamepads()].filter(Boolean) : []; } catch (e) { pads = []; }
  for (let i = 0; i < 2; i++) {
    const p = IN[i];
    if (NET.mode !== 'local' && i !== NET.me) {
      if (NET.mode === 'host') {
        const r = NET.remote;
        p.x = r.x; p.y = r.y; p.pad = r.pad;
        p.actN += r.actN; p.thrN += r.thrN; p.dashN += r.dashN; p.upN += r.upN; p.downN += r.downN; p.leftN += r.leftN; p.rightN += r.rightN;
        r.actN = r.thrN = r.dashN = r.upN = r.downN = r.leftN = r.rightN = 0;
        if (NET.remotePause) { GP.pause = true; NET.remotePause = false; }
      } else { p.x = 0; p.y = 0; }
    } else {
      let x = 0, y = 0;
      for (const b of bindsOf(i)) {
        if (b.left.some(k => keys[k])) x -= 1;
        if (b.right.some(k => keys[k])) x += 1;
        if (b.up.some(k => keys[k])) y -= 1;
        if (b.down.some(k => keys[k])) y += 1;
      }
      x = clamp(x, -1, 1); y = clamp(y, -1, 1);
      const gi = NET.mode !== 'local' ? 0 : (G && G.solo ? (i === 0 ? 0 : -1) : i);
      const gp = gi >= 0 ? pads[gi] : null;
      if (gp) {
        const bt = n => !!(gp.buttons[n] && gp.buttons[n].pressed);
        const ax = gp.axes[0] || 0, ay = gp.axes[1] || 0;
        if (Math.hypot(ax, ay) > 0.3) { x += ax; y += ay; }
        const st = { a: bt(0), t: bt(2) || bt(3), d: bt(1) || bt(5) || bt(4), s: bt(9), u: bt(12) || ay < -0.6, dn: bt(13) || ay > 0.6, l: bt(14) || ax < -0.6, r: bt(15) || ax > 0.6, bk: bt(8) };
        if (bt(14)) x -= 1; if (bt(15)) x += 1; if (bt(12)) y -= 1; if (bt(13)) y += 1;
        const g = p.g;
        if (st.a && !g.a) { p.actN++; initAudio(); }
        if (st.t && !g.t) p.thrN++;
        if (st.d && !g.d) p.dashN++;
        if (st.u && !g.u) p.upN++;
        if (st.dn && !g.dn) p.downN++;
        if (st.l && !g.l) p.leftN++;
        if (st.r && !g.r) p.rightN++;
        if (st.s && !g.s) GP.pause = true;
        if (st.bk && !g.bk) GP.back = true;
        p.g = st; p.pad = true;
      }
      const l = Math.hypot(x, y); if (l > 1) { x /= l; y /= l; }
      p.x = x; p.y = y;
    }
    p.actP = p.actN > 0; p.thrP = p.thrN > 0; p.dashP = p.dashN > 0;
    p.upP = p.upN > 0; p.downP = p.downN > 0; p.leftP = p.leftN > 0; p.rightP = p.rightN > 0;
  }
}
function consumeInput() {
  for (const p of IN) { p.actN = p.thrN = p.dashN = p.upN = p.downN = p.leftN = p.rightN = 0; p.actP = p.thrP = p.dashP = p.upP = p.downP = p.leftP = p.rightP = false; }

}
const anyAct = () => IN[0].actP || IN[1].actP;
const anyThr = () => IN[0].thrP || IN[1].thrP || IN[0].dashP || IN[1].dashP;
const anyUp = () => IN[0].upP || IN[1].upP;
const anyDown = () => IN[0].downP || IN[1].downP;

function keyLabel(i) {

}
function handleCodeKey(e) {
  const m = G.menu;
  if (e.key >= '0' && e.key <= '9') { if (m.entry.length < 5) { m.entry += e.key; SFX.blip(); } }
  else if (e.code === 'Backspace') m.entry = m.entry.slice(0, -1);

/* ============ AUDIO ============ */
let AC = null, MASTER, SFXG, MUSG, NOISE, muted = false, pendingSong = null, curSong = null;
function initAudio() {
  if (AC) { if (AC.state === 'suspended') AC.resume(); return; }
  try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { AC = null; return; }
  MASTER = AC.createGain(); MASTER.gain.value = muted ? 0 : 0.55; MASTER.connect(AC.destination);
  SFXG = AC.createGain(); SFXG.connect(MASTER);
  MUSG = AC.createGain(); MUSG.gain.value = 0.2; MUSG.connect(MASTER);
  const len = AC.sampleRate; NOISE = AC.createBuffer(1, len, AC.sampleRate);

function tone(f, dur, type = 'square', vol = 0.15, slide = null, delay = 0, dest = null) {
  if (!AC) return;

  const o = AC.createOscillator(), g = AC.createGain();

  const f = AC.createBiquadFilter(); f.type = ftype; f.frequency.value = freq;
  const g = AC.createGain(); g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  s.connect(f); f.connect(g); g.connect(dest || SFXG); s.start(t); s.stop(t + dur + 0.05);
}
const SFX = {
  rimshot() { tone(210, 0.14, 'sine', 0.5, 90); noise(0.1, 0.35, 1800, 'bandpass'); tone(170, 0.14, 'sine', 0.5, 75, 0.2); noise(0.1, 0.35, 1800, 'bandpass', 0.2); noise(0.7, 0.22, 7000, 'highpass', 0.42); },

let song = null, songStep = 0, nextNoteT = 0;
function playSong(name) {
  name = name || null;
  curSong = name; pendingSong = name;
  if (G) G.song = name;
  if (!AC) return;
  song = name ? SONGS[name] : null; songStep = 0; nextNoteT = AC.currentTime + 0.08;
}
setInterval(() => {
  if (!AC || !song) return;
  const sp = 60 / song.bpm / 2;
  if (nextNoteT < AC.currentTime - 0.1) nextNoteT = AC.currentTime + 0.05;
  while (nextNoteT < AC.currentTime + 0.2) {
    const d = nextNoteT - AC.currentTime, i = songStep % song.bass.length;
    const b = song.bass[i], l = song.lead[i];
    if (b) tone(m2f(b), sp * 0.8, 'triangle', 0.5, null, d, MUSG);
    if (l) tone(m2f(l), sp * 0.9, 'square', 0.13, null, d, MUSG);
    if (song.kick) {
      if (i % 2 === 0) tone(130, 0.11, 'sine', 0.6, 40, d, MUSG);
      noise(0.03, 0.12, 8000, 'highpass', d, MUSG);
    } else if (i % 4 === 2) noise(0.04, 0.1, 6000, 'highpass', d, MUSG);
    nextNoteT += sp; songStep++;
  }
}, 50);

  toast: (title, sub, color) => { if (G.toasts.length < 4) G.toasts.push({ title, sub, color: color || '#ffd23f', t: 0, dur: 2.8 }); },
  say: (ref, text, dur) => { G.bubbles = G.bubbles.filter(b => b.ref !== ref); G.bubbles.push({ ref, text, t: 0, dur: dur || 2.6 }); },
  shake: v => { G.shake = Math.max(G.shake, v); },

};
function fx(n, ...a) {
  FX[n](...a);

}

function updateFx(dt) {
  G.shake = Math.max(0, G.shake - dt * 30);
  G.dox = Math.max(0, G.dox - dt);
  for (let i = G.parts.length - 1; i >= 0; i--) {
    const p = G.parts[i]; p.t += dt;
    if (p.t >= p.life) { G.parts.splice(i, 1); continue; }
    p.vy += (p.g || 0) * dt; p.x += p.vx * dt; p.y += p.vy * dt; if (p.grow) p.sz += p.grow * dt;
  }
  if (G.parts.length > 500) G.parts.splice(0, G.parts.length - 500);
  for (let i = G.floats.length - 1; i >= 0; i--) { const f = G.floats[i]; f.t += dt; f.y -= 38 * dt; if (f.t > f.dur) G.floats.splice(i, 1); }
  for (let i = G.bubbles.length - 1; i >= 0; i--) { const b = G.bubbles[i]; b.t += dt; if (b.t > b.dur || !refEnt(b.ref)) G.bubbles.splice(i, 1); }
  if (G.toasts.length) { const t = G.toasts[0]; t.t += dt; if (t.t > t.dur) G.toasts.shift(); }
  const tk = G.ticker; tk.t += dt;
  if (tk.kind === 'joke' && !tk.rim && tk.t > 2.8) { tk.rim = true; SFX.rimshot(); }
  if (tk.t > tk.dur) {

    G.ticker = { kind: 'tip', text: list[G.tipI % list.length], t: 0, dur: 7, rim: false };
  }
}

  if (G.stove.st === 'burnt') return { st: 'stove', act: true };
  if (G.stove.st === 'ready' && (p.hunger < 75 || o.hunger < 60)) return { st: 'stove', act: true };
  if (o.seat >= 0 && G.friend < 92) return { st: 'couch', act: true };
  if (G.friend < 40) return { st: 'couch', act: true };
  if (G.stove.st === 'empty' && G.money >= 10 && (p.hunger < 45 || (o.hunger < 35 && !o.carry))) return { st: 'fridge', act: true };
  if (G.solo && G.friend < 75 && G.fiveCd <= 0 && !o.carry && o.seat < 0 && dist(p, o) < 260 && AI.askT <= 0) return { askFive: true };
  const mess = G.items.filter(it => isMess(it.type) && it.fly <= 0);
  if (mess.length >= (G.robo ? 8 : 5)) { const it = mess.reduce((a, x) => dist(p, x) < dist(p, a) ? x : a); return { item: it.id }; }
  const late = G.dayT > DAY_LEN * 0.35;
  if (G.money < r + 30 && (late || G.money < 20) && !(o.mashT > 0 && o.mashSt === 'desk')) return { st: 'desk', act: true, mash: true };
  if (mess.length >= (G.robo ? 6 : 3)) { const it = mess.reduce((a, x) => dist(p, x) < dist(p, a) ? x : a); return { item: it.id }; }
  if (p.hunger > 18) { const busy = o.mashT > 0 && o.mashSt === 'bench'; return { st: busy ? 'bag' : 'bench', act: true, mash: true }; }
  return { st: 'desk', act: true, mash: true };
}
function aiPress(rate) { AI.mash -= 1 / 60; if (AI.mash <= 0) { AI.mash = rate ? rand(rate * 0.8, rate * 1.25) : 0.3; return 1; } return 0; }
function aiHome(p, inp, dt) {
  const o = G.players[0];
  AI.think -= dt; AI.sayCd -= dt; AI.askT -= dt;
  if (p.seat >= 0 && o.seat < 0) AI.couchT += dt; else if (p.seat < 0) AI.couchT = 0;
  if (o.fiveT > G.t - 0.3 && AI.fiveSeen !== o.fiveT && dist(p, o) < 95 && !p.carry && !o.carry && p.seat < 0) { AI.fiveSeen = o.fiveT; inp.actN = 1; return; }
  if (AI.think <= 0 || !AI.goal) { AI.goal = aiGoal(p); AI.think = 0.3; }
  if (AI.sayCd <= 0) { AI.sayCd = rand(30, 50); say('p1', pick(BOT_LINES), 2.2); }
  const g = AI.goal;
  if (g.stay) return;
  if (g.stand) { inp.actN = 1; AI.goal = null; return; }
  if (g.eat) { inp.actN = 1; AI.goal = null; AI.think = 0.2; return; }
  if (g.askFive) {
    AI.askT = 6;
    if (dist(p, o) > 70) { aiMove(p, inp, o, dt, 60); AI.think = 0.1; return; }
    if (!AI.asked) { AI.asked = true; say('p1', 'Дай п\'ять! Жми дію поруч!', 2.5); }
    p.emote = '✋'; p.emoteT = 0.4;
    inp.actN = aiPress(0.3); AI.waitFive = (AI.waitFive || 0) + dt;
    if (AI.waitFive > 3 || G.fiveCd > 0) { AI.goal = null; AI.asked = false; AI.waitFive = 0; AI.askT = 12; }
    return;
  }
  if (g.pass) {
    const d = dist(p, o) || 1; inp.x = (o.x - p.x) / d; inp.y = (o.y - p.y) / d; inp.thrN = 1;
    AI.goal = null; AI.think = 0.4; say('p1', 'Лови! Їж, бо схуднеш.', 1.8); return;
  }
  if (g.st) {
    const pt = AP[g.st];
    const here = aiMove(p, inp, pt, dt, 14);
    if (here && g.act) inp.actN = aiPress(g.mash ? 0.14 : 0.35);
    return;
  }
  if (g.ent === 'denis') {
    const d = G.denis; if (!d) { AI.goal = null; return; }
    const dd = dist(p, d);
    aiMove(p, inp, d, dt, 40);
    if (dd < 170 && dd > 50 && p.dashCd <= 0) inp.dashN = 1;
    if (dd < 62) inp.actN = aiPress(0.3);
    return;
  }
  if (g.roach) {
    const r = G.roaches.find(x => x.id === g.roach); if (!r) { AI.goal = null; AI.think = 0; return; }
    const dd = dist(p, r);
    aiMove(p, inp, r, dt, 20);
    if (dd < 110 && dd > 40 && p.dashCd <= 0 && Math.random() < 0.05) inp.dashN = 1;
    if (dd < 46) inp.actN = 1;
    return;
  }
  if (g.item) {
    const it = G.items.find(x => x.id === g.item); if (!it) { AI.goal = null; AI.think = 0; return; }
    aiMove(p, inp, it, dt, 20);
    if (p.target && p.target.k === 'item' && p.target.iid === g.item) inp.actN = 1;
  }
}
function aiDodge(p, inp, b) {
  if (AI.dodgeT > 0) { AI.dodgeT -= 1 / 60; inp.x = AI.dx; inp.y = AI.dy; return true; }
  const go = (x, y, dash) => {
    const l = Math.hypot(x, y) || 1; AI.dx = x / l; AI.dy = y / l; AI.dodgeT = 0.28; inp.x = AI.dx; inp.y = AI.dy;
    if (dash && p.dashCd <= 0) inp.dashN = 1; return true;
  };
  const db = dist(p, b) || 1;
  if (b.kind === 'egor' && b.st === 'slamTele' && b.t > 0.2) { const R = b.phase >= 2 ? 215 : 180; if (db < R + 40) return go(p.x - b.x, p.y - b.y, db < R); }
  if (b.st === 'chargeTele' && b.t > 0.2) {
    const lane = segDist(p.x, p.y, b.x, b.y, b.x + b.dx * 900, b.y + b.dy * 900);
    if (lane < b.r + 40) { const s = ((p.x - b.x) * b.dy - (p.y - b.y) * b.dx) > 0 ? 1 : -1; return go(b.dy * s, -b.dx * s, true); }
  }
  if (b.st === 'charge') {
    const lane = segDist(p.x, p.y, b.x, b.y, b.x + b.dx * 400, b.y + b.dy * 400);
    if (lane < b.r + 30) { const s = ((p.x - b.x) * b.dy - (p.y - b.y) * b.dx) > 0 ? 1 : -1; return go(b.dy * s, -b.dx * s, true); }
  }
  for (const m of G.marks) if (m.t > 0.2 && dist(p, m) < m.r + 26) return go(p.x - m.x || 1, p.y - m.y, m.t > m.dur * 0.7);
  for (const bm of G.beams) if (bm.pi === p.i && bm.st !== 'fire' && bm.t > 0.25) { const s = AI.side; return go(-Math.sin(bm.ang) * s, Math.cos(bm.ang) * s, bm.st === 'lock'); }
  for (const pr of G.proj) {
    if (pr.kind === 'manure') continue;
    const dx = p.x - pr.x, dy = p.y - pr.y, d = Math.hypot(dx, dy), v = Math.hypot(pr.vx, pr.vy) || 1;
    if (d < 150 && (dx * pr.vx + dy * pr.vy) / (d * v) > 0.85) { const s = (dx * pr.vy - dy * pr.vx) > 0 ? 1 : -1; return go(-pr.vy / v * s, pr.vx / v * s, d < 70); }
  }
  return false;
}
function aiBoss(p, inp, dt) {
  const b = G.boss, o = G.players[0];
  if (p.down || !b || b.st === 'dead') return;
  AI.throwCd -= dt; AI.sideT -= dt;
  if (AI.sideT <= 0) { AI.sideT = rand(1.5, 3); AI.side = Math.random() < 0.5 ? -1 : 1; }
  if (aiDodge(p, inp, b)) return;
  if (o.down) { if (aiMove(p, inp, o, dt, 50)) inp.actN = aiPress(0.12); return; }
  if (G.items.length) {
    const it = G.items.reduce((a, x) => dist(p, x) < dist(p, a) ? x : a);
    if (dist(p, it) < 220 && !(b.st === 'exposed')) { aiMove(p, inp, it, dt, 4); return; }
  }
  let tgt = b;
  if (b.kind === 'seva' && b.shield && G.routers.length) tgt = G.routers.reduce((a, r) => dist(p, r) < dist(p, a) ? r : a);
  const want = (tgt.r || 30) + p.r + 16, d = dist(p, tgt) || 1;
  if (d > want + 8) aiMove(p, inp, { x: tgt.x + (p.x - tgt.x) / d * want, y: tgt.y + (p.y - tgt.y) / d * want }, dt, 6);
  else { inp.x = -(tgt.y - p.y) / d * 0.35 * AI.side; inp.y = (tgt.x - p.x) / d * 0.35 * AI.side; }
  if (d < want + 20 && p.punchCd <= 0) inp.actN = 1;
  if (G.ammo > 3 && AI.throwCd <= 0 && d > 160) { inp.thrN = 1; AI.throwCd = rand(3.5, 5.5); }
}
function aiInput(dt) {
  const p = G.players[1], inp = IN[1];
  inp.x = 0; inp.y = 0; inp.actN = 0; inp.thrN = 0; inp.dashN = 0; inp.pad = false;
  if (G.scene === 'home') aiHome(p, inp, dt);
  else if (G.scene === 'boss') aiBoss(p, inp, dt);
  else AI.goal = null;
  const l = Math.hypot(inp.x, inp.y); if (l > 1) { inp.x /= l; inp.y /= l; }
  inp.actP = inp.actN > 0; inp.thrP = inp.thrN > 0; inp.dashP = inp.dashN > 0;
}

/* ============ ГОЛОВНИЙ ЦИКЛ ============ */
function update(dt) {
  G.t += dt; G.sceneT += dt;
  switch (G.scene) {
    case 'title': updateTitle(); break;
    case 'online': updateOnlineMenu(); break;
    case 'lan': updateLanMenu(); break;
    case 'cards':
      if (G.sceneT > 0.5 && anyAct()) { sfx('blip'); G.cardI++; G.sceneT = 0; if (G.cardI >= G.cards.length) cardsDone(); }
      break;
    case 'home': updateHome(dt); break;
    case 'summary':
      if (!G.summary.rim && G.sceneT > 2.4) { G.summary.rim = true; sfx('rimshot'); }
      if (G.sceneT > 1 && anyAct()) { if (G.friend <= 0) breakup(); else openShop(); }
      break;
    case 'shop': updateShop(); break;
    case 'boss': updateBoss(dt); break;
    case 'win': if (G.sceneT > 2 && anyAct()) toTitle(); break;
    case 'lose': if (G.sceneT > 1.2) { if (anyAct()) retryBoss(); else if (anyThr()) toTitle(); } break;
    case 'breakup': if (G.sceneT > 1.2) { if (anyAct()) retryDay(); else if (anyThr()) toTitle(); } break;
    case 'netlost': if (G.sceneT > 0.8 && anyAct()) toTitle(); break;
  }
  updateFx(dt);
}
function render(dt) {
  ctx.setTransform(SC * DPR, 0, 0, SC * DPR, 0, 0);
  ctx.fillStyle = '#120c18'; ctx.fillRect(0, 0, W, H);
  switch (G.scene) {
    case 'title': drawTitle(dt); break;
    case 'online': drawOnlineMenu(); break;
    case 'lan': drawLanMenu(); break;
    case 'cards': drawCards(); break;
    case 'home': drawHome(); break;
    case 'summary': drawHome(); drawSummary(); break;
    case 'shop': drawShop(); drawFx(); break;
    case 'boss': drawBoss(); break;
    case 'win': drawEnd('win'); drawFx(); break;
    case 'lose': case 'breakup': case 'netlost': drawEnd(G.scene); break;
  }
  if (G.paused) drawPause();
  if (muted) txt('🔇', W - 14, H - 54, { size: 18, align: 'right' });
}
let last = performance.now();
function frame(now) {
  const rdt = Math.max(0, (now - last) / 1000); last = now;
  const dt = Math.min(0.05, rdt);
  pollInput();
  if (GP.mute) toggleMute();
  if (NET.mode === 'guest' && NET.connected) {
    guestSendInput();
    if (G.paused && GP.back) toTitle();
    else { G.t += dt; G.sceneT += dt; guestSmooth(dt); updateFx(dt); }
  } else {
    if (G.solo && !G.paused) aiInput(dt);
    if (GP.pause && (G.scene === 'home' || G.scene === 'boss')) G.paused = !G.paused;
    if (G.paused && GP.back) toTitle();
    else if (!G.paused) update(dt);
    if (NET.mode === 'host' && NET.connected) {
      NET.sendT += rdt;
      if (NET.sendT >= 1 / 30) { NET.sendT = 0; netSendRaw('{"type":"s","fx":' + JSON.stringify(NET.fxQ) + ',"s":' + coreJSON() + '}'); NET.fxQ = []; }
    }
  }
  netWatchdog(rdt);
  render(G.paused ? 0 : dt);
  consumeInput();
  requestAnimationFrame(frame);
}
addEventListener('pagehide', () => { if (NET.mode !== 'local') netSendRaw('{"type":"bye"}'); });
addEventListener('beforeunload', () => { if (NET.mode !== 'local') netSendRaw('{"type":"bye"}'); });
newGame();
SAVE = readSave();
probeLan();
requestAnimationFrame(frame);
</script>
