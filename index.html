<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>🌯 Пилипюк: Месник Шаурми</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;overflow:hidden;user-select:none;-webkit-user-select:none}
#wrap{position:relative;display:inline-block}
canvas{display:block}
#touch{position:absolute;bottom:0;left:0;right:0;height:110px;display:flex;justify-content:space-between;align-items:flex-end;padding:8px 12px;pointer-events:none}
.tbtn{pointer-events:auto;background:rgba(255,255,255,.18);border:2px solid rgba(255,255,255,.35);border-radius:50%;color:#fff;font-size:18px;cursor:pointer;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:none;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.tleft,.tright{display:flex;gap:8px;align-items:flex-end}
@media(pointer:fine){#touch{display:none}}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="c"></canvas>
  <div id="touch">
    <div class="tleft">
      <div class="tbtn" id="btnL" style="width:58px;height:58px">&#9664;</div>
      <div class="tbtn" id="btnR" style="width:58px;height:58px">&#9654;</div>
    </div>
    <div class="tright">
      <div class="tbtn" id="btnAtk" style="width:52px;height:52px">&#128074;</div>
      <div class="tbtn" id="btnJump" style="width:62px;height:62px">&#128316;</div>
    </div>
  </div>
</div>
<script>

'use strict';
const GW=800,GH=450;
const cv=document.getElementById('c');
const cx=cv.getContext('2d');
cv.width=GW;cv.height=GH;
function resize(){
  const s=Math.min(window.innerWidth/GW,window.innerHeight/(GH+110));
  cv.style.width=GW*s+'px';cv.style.height=GH*s+'px';
  document.getElementById('wrap').style.width=GW*s+'px';
}
resize();window.addEventListener('resize',resize);

// INPUT
const K={},KP={};
window.addEventListener('keydown',e=>{if(!K[e.code])KP[e.code]=true;K[e.code]=true;if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code))e.preventDefault();});
window.addEventListener('keyup',e=>K[e.code]=false);
function bndTouch(id,code){
  const el=document.getElementById(id);if(!el)return;
  const dn=e=>{e.preventDefault();if(!K[code])KP[code]=true;K[code]=true;};
  const up=e=>{e.preventDefault();K[code]=false;};
  el.addEventListener('touchstart',dn,{passive:false});el.addEventListener('touchend',up,{passive:false});
  el.addEventListener('mousedown',dn);el.addEventListener('mouseup',up);
}
bndTouch('btnL','ArrowLeft');bndTouch('btnR','ArrowRight');bndTouch('btnJump','Space');bndTouch('btnAtk','KeyZ');
function clearKP(){for(const k in KP)delete KP[k];}

// UTILS
const rng=(a,b)=>Math.random()*(b-a)+a;
const ri=(a,b)=>Math.floor(rng(a,b+1));
const clamp=(v,lo,hi)=>Math.max(lo,Math.min(hi,v));
function ovlp(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;}
function rrect(x,y,w,h,r){cx.beginPath();cx.moveTo(x+r,y);cx.lineTo(x+w-r,y);cx.arcTo(x+w,y,x+w,y+r,r);cx.lineTo(x+w,y+h-r);cx.arcTo(x+w,y+h,x+w-r,y+h,r);cx.lineTo(x+r,y+h);cx.arcTo(x,y+h,x,y+h-r,r);cx.lineTo(x,y+r);cx.arcTo(x,y,x+r,y,r);cx.closePath();}
function wrapTxt(text,x,y,maxW,lh){const words=text.split(' ');let line='';for(const w of words){const t=line+w+' ';if(cx.measureText(t).width>maxW&&line){cx.fillText(line.trim(),x,y);line=w+' ';y+=lh;}else line=t;}cx.fillText(line.trim(),x,y);}

// PARTICLES
let parts=[];
function spawnP(x,y,col,n,sp){n=n||8;sp=sp||3;for(let i=0;i<n;i++)parts.push({x,y,vx:rng(-sp,sp),vy:rng(-4,-1),life:ri(28,50),maxL:50,col,sz:rng(2,6)});}
function tickParts(){parts=parts.filter(p=>p.life>0);for(const p of parts){p.x+=p.vx;p.y+=p.vy;p.vy+=0.15;p.life--;}}
function drawParts(ox,oy){for(const p of parts){cx.globalAlpha=p.life/p.maxL;cx.fillStyle=p.col;cx.fillRect(p.x-ox,p.y-oy,p.sz,p.sz);}cx.globalAlpha=1;}

// DIALOG
let dlg=null,dlgQ=[];
function showDlg(spk,txt,dur){dur=dur||220;dlg={spk,txt,t:dur,maxT:dur};}
function qDlg(spk,txt,dur){dur=dur||220;dlgQ.push({spk,txt,dur});}
function tickDlg(){if(!dlg)return;dlg.t--;if(dlg.t<=0){dlg=null;if(dlgQ.length){const n=dlgQ.shift();dlg={spk:n.spk,txt:n.txt,t:n.dur,maxT:n.dur};}}}
function drawDlg(){
  if(!dlg)return;
  const bx=10,by=GH-100,bw=GW-20,bh=88;
  cx.fillStyle='rgba(4,4,18,0.93)';rrect(bx,by,bw,bh,8);cx.fill();
  cx.strokeStyle='#f5a623';cx.lineWidth=2;rrect(bx,by,bw,bh,8);cx.stroke();
  cx.fillStyle='#f5a623';cx.font='bold 13px "Segoe UI",sans-serif';cx.textAlign='left';
  cx.fillText('\u25B6 '+dlg.spk,bx+12,by+18);
  cx.fillStyle='#eee';cx.font='13px "Segoe UI",sans-serif';
  wrapTxt(dlg.txt,bx+12,by+36,bw-24,18);
  cx.fillStyle='rgba(245,166,35,0.35)';cx.fillRect(bx+4,by+bh-8,(bw-8)*dlg.t/dlg.maxT|0,5);
}

// GAME STATE
let STATE='menu',lvlIdx=0,totalScore=0,totalCoins=0,frameN=0,deathMsg='';
const DEATH_UK=[
  '\uD83D\uDE31 \u0422\u0456\u0442\u043A\u0430 \u0413\u0430\u043B\u044F \u0434\u0456\u0437\u043D\u0430\u043B\u0430\u0441\u044C \u043F\u0440\u043E \u0442\u0432\u043E\u0457 \u043E\u0446\u0456\u043D\u043A\u0438!',
  '\uD83C\uDF72 \u0423\u043F\u0430\u0432 \u0443 \u0431\u043E\u0440\u0449... \u0421\u043C\u0430\u0447\u043D\u043E, \u0430\u043B\u0435 \u0431\u043E\u043B\u044F\u0447\u0435',
  '\uD83D\uDE22 \u0428\u0430\u0443\u0440\u043C\u0430 \u0432\u0436\u0435 \u0445\u043E\u043B\u043E\u0434\u043D\u0430...',
  '\uD83D\uDCD2 \u0414\u0438\u0440\u0435\u043A\u0442\u043E\u0440 \u0437\u0430\u043F\u0438\u0441\u0430\u0432: "\u041F\u0420\u041E\u0412\u0410\u041B\u0418\u0412\u0421\u042F"',
  '\uD83E\uDD26 \u041C\u0430\u043C\u0430 \u043A\u0430\u0437\u0430\u043B\u0430: "\u041D\u0435 \u0445\u043E\u0434\u0438 \u0437\u0430 \u0448\u0430\u0443\u0440\u043C\u043E\u044E!"',
  '\uD83D\uDC80 \u0417\u0430\u0433\u0438\u043D\u0443\u0432 \u044F\u043A \u0433\u0435\u0440\u043E\u0439. \u0410\u0431\u043E \u044F\u043A \u0456\u0434\u0456\u043E\u0442.',
  '\uD83C\uDF2F \u041D\u0430\u0432\u0456\u0442\u044C \u0448\u0430\u0443\u0440\u043C\u0430 \u0442\u0435\u0431\u0435 \u043D\u0435 \u0432\u0440\u044F\u0442\u0443\u0432\u0430\u043B\u0430',
  '\uD83D\uDE04 \u041D\u0430\u0441\u0442\u0443\u043F\u043D\u043E\u0433\u043E \u0440\u0430\u0437\u0443 \u0457\u0436 \u0432\u0434\u043E\u043C\u0430!'
];

// PHYSICS
const GRAV=0.55,JUMP=-11.5,SPD=3.8;
const P={x:100,y:200,w:26,h:36,vx:0,vy:0,onGr:false,hp:3,maxHp:3,ifr:0,face:1,atk:false,atkT:0,jumps:0,dead:false};
function resetP(x,y){P.x=x;P.y=y;P.vx=0;P.vy=0;P.onGr=false;P.ifr=0;P.atk=false;P.atkT=0;P.jumps=0;P.dead=false;}
function tickP(plats){
  if(P.dead)return;
  if(K['ArrowLeft']||K['KeyA']){P.vx=-SPD;P.face=-1;}
  else if(K['ArrowRight']||K['KeyD']){P.vx=SPD;P.face=1;}
  else P.vx*=0.75;
  if((KP['Space']||KP['ArrowUp']||KP['KeyW'])&&P.jumps<2){P.vy=JUMP+(P.jumps?1.8:0);P.jumps++;spawnP(P.x+P.w/2,P.y+P.h,'#88aaff',5);}
  if(KP['KeyZ']||KP['ShiftLeft']){P.atk=true;P.atkT=16;}
  if(P.atkT>0)P.atkT--;else P.atk=false;
  P.vy=Math.min(P.vy+GRAV,15);
  P.x+=P.vx;colX(P,plats);
  P.y+=P.vy;P.onGr=false;colY(P,plats);
  if(P.ifr>0)P.ifr--;
}
function colX(e,plats){for(const p of plats){if(!p.solid||!ovlp(e,p))continue;if(e.vx>0)e.x=p.x-e.w;else e.x=p.x+p.w;e.vx=0;}}
function colY(e,plats){
  for(const p of plats){
    if(!p.solid||!ovlp(e,p))continue;
    if(p.ow){if(e.vy<=0||e.y+e.h-e.vy>p.y+8)continue;}
    if(e.vy>0){e.y=p.y-e.h;e.vy=0;e.onGr=true;if(e===P)P.jumps=0;}
    else{e.y=p.y+p.h;e.vy=0;}
  }
}
function drawP(ox,oy){
  if(P.dead)return;
  if(P.ifr>0&&Math.floor(P.ifr/4)%2)return;
  const sx=P.x-ox,sy=P.y-oy;
  cx.fillStyle='rgba(0,0,0,0.3)';cx.beginPath();cx.ellipse(sx+P.w/2,sy+P.h+2,12,4,0,0,Math.PI*2);cx.fill();
  cx.fillStyle='#3498db';cx.fillRect(sx,sy+14,P.w,P.h-14);
  const lg=P.onGr?Math.sin(frameN*0.3)*3:0;
  cx.fillStyle='#2980b9';cx.fillRect(sx+2,sy+P.h-8,8,8+lg);cx.fillRect(sx+P.w-10,sy+P.h-8,8,8-lg);
  cx.fillStyle='#f0c080';cx.fillRect(sx+3,sy,20,22);
  cx.font='18px serif';cx.textAlign='center';cx.fillText(P.atk?'\uD83D\uDE24':'\uD83D\uDE0E',sx+P.w/2,sy+17);
  cx.fillStyle='#e74c3c';cx.fillRect(sx+2,sy+13,P.w-4,5);
  if(P.atk&&P.atkT>8){
    cx.fillStyle='rgba(255,220,0,0.45)';cx.fillRect(P.face>0?sx+P.w:sx-30,sy+6,30,P.h-12);
    cx.font='16px serif';cx.fillText('\uD83D\uDC4A',P.face>0?sx+P.w+6:sx-14,sy+P.h/2+4);
  }
}

// ENEMIES
let ENMs=[],PROJs=[],PKUPs=[];
function mkEnm(type,x,y,px1,px2){return {type,x,y,w:28,h:34,vx:1,vy:0,onGr:false,hp:type==='strong'?3:1,maxHp:type==='strong'?3:1,px1,px2,face:1,dead:false,ifr:0,shotT:0};}
function tickENMs(plats){
  for(const e of ENMs){
    if(e.dead)continue;
    e.vx=e.face*(e.type==='strong'?1.5:1.2);
    if(e.x<=e.px1){e.face=1;e.x=e.px1;}if(e.x+e.w>=e.px2){e.face=-1;e.x=e.px2-e.w;}
    if(e.type==='shooter'){e.shotT++;if(e.shotT%130===0){const dx=P.x-e.x;mkProj(e.x+e.w/2,e.y+e.h/2,Math.sign(dx)*3.5,0,true,1,'#e74c3c');}}
    e.vy=Math.min(e.vy+GRAV,14);e.x+=e.vx;colX(e,plats);e.y+=e.vy;e.onGr=false;colY(e,plats);
    if(e.ifr>0)e.ifr--;if(e.y>GH+100)e.dead=true;
    if(P.ifr===0&&ovlp(e,P)){hurtP(1);P.vx=Math.sign(P.x-e.x)*5;P.vy=-5;}
  }
}
function drawENMs(ox,oy){
  for(const e of ENMs){
    if(e.dead)continue;if(e.ifr>0&&Math.floor(e.ifr/3)%2)continue;
    const sx=e.x-ox,sy=e.y-oy;
    cx.fillStyle=e.type==='strong'?'#c0392b':e.type==='shooter'?'#8e44ad':'#e74c3c';cx.fillRect(sx,sy+12,e.w,e.h-12);
    cx.fillStyle='#f0c080';cx.fillRect(sx+4,sy,20,20);
    cx.font='15px serif';cx.textAlign='center';
    cx.fillText(e.type==='strong'?'\uD83D\uDE20':e.type==='shooter'?'\uD83E\uDD21':'\uD83D\uDE24',sx+e.w/2,sy+15);
    if(e.type==='strong'&&e.hp<e.maxHp){cx.fillStyle='#333';cx.fillRect(sx,sy-8,e.w,4);cx.fillStyle='#e74c3c';cx.fillRect(sx,sy-8,e.w*(e.hp/e.maxHp)|0,4);}
  }
}

// PROJECTILES
function mkProj(x,y,vx,vy,fromE,dmg,col,grav){PROJs.push({x,y,w:11,h:11,vx,vy,fromE,dmg,col,life:210,grav:!!grav});}
function tickPROJs(plats){
  PROJs=PROJs.filter(p=>{
    p.x+=p.vx;p.y+=p.vy;if(p.grav)p.vy+=0.2;p.life--;
    for(const pl of plats){if(pl.solid&&ovlp(p,pl)){spawnP(p.x,p.y,p.col,4);return false;}}
    if(p.fromE&&P.ifr===0&&ovlp(p,P)){hurtP(p.dmg);spawnP(p.x,p.y,'#f55',5);return false;}
    if(!p.fromE){
      for(const e of ENMs){if(!e.dead&&e.ifr===0&&ovlp(p,e)){hurtE(e,p.dmg);spawnP(p.x,p.y,'#ff0',5);return false;}}
      if(boss&&boss.hp>0&&boss.ifr===0&&ovlp(p,boss)){hurtBoss(p.dmg);spawnP(p.x,p.y,'#ff0',7);return false;}
    }
    return p.life>0;
  });
}
function drawPROJs(ox,oy){for(const p of PROJs){cx.fillStyle=p.col;cx.beginPath();cx.arc(p.x-ox+p.w/2,p.y-oy+p.h/2,p.w/2,0,Math.PI*2);cx.fill();}}

// PICKUPS
function mkPkup(type,x,y){PKUPs.push({type,x,y,w:18,h:18,vy:-4,life:280,static:false});}
function tickPKUPs(plats){
  PKUPs=PKUPs.filter(p=>{
    if(!p.static){p.vy=Math.min(p.vy+0.3,5);p.y+=p.vy;for(const pl of plats)if(pl.solid&&ovlp(p,pl)){p.y=pl.y-p.h;p.vy=0;p.static=true;}}
    p.life--;
    if(ovlp(p,P)){
      if(p.type==='coin'){totalCoins++;totalScore+=50;spawnP(p.x,p.y,'#ffd700',5);}
      else if(p.type==='heart'&&P.hp<P.maxHp){P.hp++;spawnP(p.x,p.y,'#f44',8);}
      else if(p.type==='shawarma'){totalScore+=300;spawnP(p.x,p.y,'#f90',10);showDlg('\uD83D\uDE0E \u041F\u0438\u043B\u0438\u043F\u044E\u043A',JKS[ri(0,JKS.length-1)]);}
      return false;
    }
    return p.life>0;
  });
}
function drawPKUPs(ox,oy){
  cx.textAlign='center';
  for(const p of PKUPs){
    const bob=Math.sin(frameN*0.08+p.x)*3;
    cx.font='18px serif';
    cx.fillText(p.type==='coin'?'\uD83E\uDE99':p.type==='heart'?'\u2764\uFE0F':'\uD83C\uDF2F',p.x-ox+p.w/2,p.y-oy+p.h+bob);
  }
}

// DAMAGE
function hurtP(amt){if(P.ifr>0)return;P.hp-=amt;P.ifr=90;spawnP(P.x+P.w/2,P.y+P.h/2,'#f55',10);if(P.hp<=0){P.dead=true;P.hp=0;deathMsg=DEATH_UK[ri(0,DEATH_UK.length-1)];}}
function hurtE(e,amt){e.hp-=amt;e.ifr=20;spawnP(e.x+e.w/2,e.y+e.h/2,'#ff0',6);if(e.hp<=0){e.dead=true;totalScore+=100;mkPkup('coin',e.x+e.w/2-9,e.y);}}
function checkAtkHit(){
  if(!P.atk||P.atkT<=8)return;
  const hb={x:P.face>0?P.x+P.w:P.x-28,y:P.y+4,w:28,h:P.h-8};
  for(const e of ENMs){if(!e.dead&&e.ifr===0&&ovlp(hb,e))hurtE(e,1);}
  if(boss&&boss.hp>0&&boss.ifr===0&&ovlp(hb,boss))hurtBoss(1);
}

// JOKES
const JKS=[
  '\uD83C\uDF2F \u0426\u044F \u0448\u0430\u0443\u0440\u043C\u0430 \u0441\u043C\u0430\u043A\u0443\u0454 \u044F\u043A \u043F\u0435\u0440\u0435\u043C\u043E\u0433\u0430!',
  '\uD83D\uDE04 \u041C\u0430\u043C\u0430 \u043D\u0435 \u0434\u0456\u0437\u043D\u0430\u0454\u0442\u044C\u0441\u044F... \u0441\u043F\u043E\u0434\u0456\u0432\u0430\u044E\u0441\u044C',
  '\uD83D\uDD25 \u0417\u0430 \u0423\u043A\u0440\u0430\u0457\u043D\u0443 \u0456 \u0437\u0430 \u0448\u0430\u0443\u0440\u043C\u0443!',
  '\uD83D\uDCAA \u042F \u0432\u0456\u0434\u0447\u0443\u0432\u0430\u044E \u0441\u0438\u043B\u0443... \u0456 \u043B\u0435\u0433\u043A\u0435 \u043E\u0442\u0440\u0443\u0454\u043D\u043D\u044F!',
  '\uD83E\uDDD5 \u041C\u02BC\u044F\u0441\u0430 \u043D\u0435\u043C\u0430\u0454 \u2014 \u0430\u043B\u0435 \u0432\u0441\u0435 \u043E\u0434\u043D\u043E \u0441\u043C\u0430\u0447\u043D\u043E!',
  '\uD83C\uDFC6 \u0428\u0430\u0443\u0440\u043C\u0430 \u2014 \u0442\u043E \u043D\u0435 \u0457\u0436\u0430, \u0442\u043E \u0441\u043F\u043E\u0441\u0456\u0431 \u0436\u0438\u0442\u0442\u044F!'
];

// LEVELS
function mp(x,y,w,h,ow){return {x,y,w,h,solid:true,ow:!!ow};}
function mspk(x,y,w){return {x,y,w,h:14,spike:true};}
const LVLS=[
  {name:'\u0420\u0456\u0432\u0435\u043D\u044C 1: \u0411\u0430\u0437\u0430\u0440 \uD83D\uDED2',bg:'#0e0e22',gCol:'#6d3a1a',pCol:'#4a2800',worldW:1250,
   spawnX:80,spawnY:340,exitX:1140,exitY:330,
   plats:[mp(0,390,1250,60),mp(200,330,110,16,true),mp(380,285,100,16,true),mp(570,330,110,16,true),mp(750,270,100,16,true),mp(920,320,120,16,true)],
   spikes:[],
   enDefs:[{t:'patrol',x:260,y:310,p1:200,p2:310},{t:'patrol',x:430,y:265,p1:380,p2:480},{t:'shooter',x:680,y:310,p1:570,p2:680},{t:'strong',x:870,y:250,p1:750,p2:920}],
   coins:[{x:225,y:298},{x:410,y:252},{x:600,y:298},{x:780,y:237}],
   hearts:[{x:490,y:348}],

function drawLevel(ox,oy){
  const L=curL;
  const g=cx.createLinearGradient(0,0,0,GH);g.addColorStop(0,L.bg);g.addColorStop(1,'#000');
  cx.fillStyle=g;cx.fillRect(0,0,GW,GH);
  cx.fillStyle='rgba(255,255,255,0.55)';
  for(let i=0;i<35;i++){const sx=((i*131+60)%L.worldW-ox)*0.25,sy=(i*83)%220;if(sx>-3&&sx<GW+3)cx.fillRect(sx,sy,1+(i%2),1+(i%2));}
  for(const p of lvlPlats){
    const px=p.x-ox,py=p.y-oy;if(px>GW+20||px+p.w<-20)continue;
    if(p.ow){cx.fillStyle=L.pCol||'#5D4037';cx.fillRect(px,py,p.w,p.h);cx.fillStyle='rgba(255,255,200,0.25)';cx.fillRect(px,py,p.w,4);}
    else{cx.fillStyle=L.gCol||'#6d3a1a';cx.fillRect(px,py,p.w,p.h);cx.fillStyle='#2ecc71';cx.fillRect(px,py,p.w,6);}
  }
  for(const s of lvlSpikes){
    const sx=s.x-ox,sy=s.y-oy;if(sx>GW||sx+s.w<0)continue;
    cx.fillStyle='#e74c3c';
    for(let i=0;i<Math.floor(s.w/16);i++){cx.beginPath();cx.moveTo(sx+i*16,sy+s.h);cx.lineTo(sx+i*16+8,sy);cx.lineTo(sx+i*16+16,sy+s.h);cx.closePath();cx.fill();}
  }
  const ex=exitDoor.x-ox,ey=exitDoor.y-oy;
  cx.fillStyle='#1a7a40';cx.fillRect(ex,ey,exitDoor.w,exitDoor.h);
  cx.fillStyle='#2ecc71';cx.fillRect(ex+3,ey+3,exitDoor.w-6,exitDoor.h-6);
  cx.font='24px serif';cx.textAlign='center';cx.fillText('\uD83D\uDEAA',ex+exitDoor.w/2,ey+exitDoor.h-6);
  const pulse=Math.sin(frameN*0.1)*4;
  cx.fillStyle='#2ecc71';cx.font='18px serif';cx.fillText('\u25B2',ex+exitDoor.w/2,ey-8+pulse);
}

function drawGameOver(){
  cx.fillStyle='rgba(0,0,0,0.88)';cx.fillRect(0,0,GW,GH);
  cx.fillStyle='#e74c3c';cx.font='bold 42px "Segoe UI",sans-serif';cx.textAlign='center';cx.fillText('\uD83D\uDC80 \u0413\u0420\u0410 \u0417\u0410\u041A\u0406\u041D\u0427\u0415\u041D\u0410 \uD83D\uDC80',GW/2,GH/2-65);
  cx.fillStyle='#fff';cx.font='16px "Segoe UI",sans-serif';cx.fillText(deathMsg,GW/2,GH/2-22);
  cx.fillStyle='#f5a623';cx.font='15px "Segoe UI",sans-serif';cx.fillText('\u041E\u0447\u043A\u0438: '+totalScore+'  |  \u041C\u043E\u043D\u0435\u0442\u0438: \uD83E\uDE99'+totalCoins,GW/2,GH/2+15);
  cx.fillStyle='#aaa';cx.font='13px "Segoe UI",sans-serif';cx.fillText('\u0420\u0456\u0432\u0435\u043D\u044C '+(lvlIdx+1)+' \u0437 3',GW/2,GH/2+40);
  if(Math.floor(frameN/28)%2){cx.fillStyle='#2ecc71';cx.font='bold 17px "Segoe UI",sans-serif';cx.fillText('\u25B6  \u041F\u0420\u041E\u0411\u0406\u041B / ENTER \u2014 \u0441\u043F\u0440\u043E\u0431\u0443\u0432\u0430\u0442\u0438 \u0437\u043D\u043E\u0432\u0443  \u25C4',GW/2,GH/2+80);}
  const tt=['\u041D\u0430\u0441\u0442\u0443\u043F\u043D\u043E\u0433\u043E \u0440\u0430\u0437\u0443 \u0457\u0436 \u0432\u0434\u043E\u043C\u0430 \uD83C\uDF7D\uFE0F','\u0421\u043F\u0440\u043E\u0431\u0430 \u2014 \u043D\u0435 \u043A\u0430\u0442\u0430\u0441\u0442\u0440\u043E\u0444\u0430! \u041D\u0443 \u043C\u0430\u0439\u0436\u0435 \uD83D\uDE05','\u0428\u0430\u0443\u0440\u043C\u0430 \u0447\u0435\u043A\u0430\u0454 \u043D\u0430 \u0433\u0435\u0440\u043E\u044F \uD83C\uDF2F'];
  cx.fillStyle='rgba(180,180,180,0.45)';cx.font='12px "Segoe UI",sans-serif';cx.fillText(tt[lvlIdx%tt.length],GW/2,GH-12);
}
function drawWin(){
  const g=cx.createLinearGradient(0,0,0,GH);g.addColorStop(0,'#0d2200');g.addColorStop(1,'#000');
  cx.fillStyle=g;cx.fillRect(0,0,GW,GH);
  for(let i=0;i<60;i++){const x=(i*131+frameN*(i%3+1))%GW,y=(i*89+frameN*(i%2+0.5))%GH;cx.fillStyle=['#f5a623','#2ecc71','#3498db','#e74c3c','#9b59b6'][i%5];cx.fillRect(x,y,4,4);}
  cx.fillStyle='#f5a623';cx.font='bold 38px "Segoe UI",sans-serif';cx.textAlign='center';cx.fillText('\uD83C\uDF89 \u041F\u0415\u0420\u0415\u041C\u041E\u0413\u0410! \uD83C\uDF89',GW/2,GH/2-100);
  cx.font='60px serif';cx.fillText('\uD83C\uDF2F',GW/2,GH/2-40+Math.sin(frameN*0.08)*5);
  cx.fillStyle='#fff';cx.font='bold 20px "Segoe UI",sans-serif';cx.fillText('\u041F\u0438\u043B\u0438\u043F\u044E\u043A \u0437\'\u0457\u0432 \u041B\u0435\u0433\u0435\u043D\u0434\u0430\u0440\u043D\u0443 \u0428\u0430\u0443\u0440\u043C\u0443!',GW/2,GH/2+30);
  cx.fillStyle='#f5a623';cx.font='15px "Segoe UI",sans-serif';cx.fillText('\u0424\u0456\u043D\u0430\u043B\u044C\u043D\u0438\u0439 \u0440\u0430\u0445\u0443\u043D\u043E\u043A: \u2B50 '+totalScore+'  |  \u041C\u043E\u043D\u0435\u0442\u0438: \uD83E\uDE99'+totalCoins,GW/2,GH/2+60);
  cx.fillStyle='rgba(200,200,200,0.8)';cx.font='13px "Segoe UI",sans-serif';
  ['\u0422\u0456\u0442\u043A\u0430 \u0413\u0430\u043B\u044F \u0432\u0441\u0435 \u0449\u0435 \u0441\u0435\u0440\u0434\u0438\u0442\u044C\u0441\u044F. \uD83D\uDE24','\u0414\u0438\u0440\u0435\u043A\u0442\u043E\u0440 \u0432\u0438\u0441\u0442\u0430\u0432\u0438\u0432 \u043E\u0446\u0456\u043D\u043A\u0443 "1" \u0437\u0430 \u043F\u0440\u043E\u0433\u0443\u043B. \uD83D\uDCCB','\u0428\u0430\u0443\u0440\u043C\u0435\u043D \u0432\u0456\u0434\u043A\u0440\u0438\u0432 \u043D\u043E\u0432\u0443 \u0448\u0430\u0443\u0440\u043C\u0435\u0440\u0456\u044E. \uD83C\uDF2F'].forEach((t,i)=>cx.fillText(t,GW/2,GH/2+90+i*20));
  if(Math.floor(frameN/32)%2){cx.fillStyle='#2ecc71';cx.font='bold 16px "Segoe UI",sans-serif';cx.fillText('\u25B6  \u041F\u0420\u041E\u0411\u0406\u041B / ENTER \u2014 \u0433\u0440\u0430\u0442\u0438 \u0437\u043D\u043E\u0432\u0443  \u25C4',GW/2,GH-20);}
}
function drawBossArena(){
  const cols=[['#1a0030','#000'],['#001230','#000'],['#200800','#000']];
  const c=cols[(LVLS[lvlIdx]&&LVLS[lvlIdx].bossIdx)||0]||cols[0];
  const g=cx.createLinearGradient(0,0,0,GH);g.addColorStop(0,c[0]);g.addColorStop(1,c[1]);
  cx.fillStyle=g;cx.fillRect(0,0,GW,GH);
  cx.fillStyle=['#5a1a80','#1a3a60','#602000'][(LVLS[lvlIdx]&&LVLS[lvlIdx].bossIdx)||0]||'#333';
  cx.fillRect(0,GH-60,GW,60);
  cx.fillStyle='rgba(255,255,255,0.07)';for(let i=0;i<GW;i+=40)cx.fillRect(i,GH-60,2,60);
  for(const p of BOSS_ARENA){if(p.ow){cx.fillStyle='rgba(255,255,255,0.2)';cx.fillRect(p.x,p.y,p.w,p.h);cx.fillStyle='rgba(255,255,255,0.4)';cx.fillRect(p.x,p.y,p.w,3);}}
  const bac=['rgba(150,0,200,0.04)','rgba(0,80,200,0.04)','rgba(200,80,0,0.05)'];
  cx.fillStyle=bac[(LVLS[lvlIdx]&&LVLS[lvlIdx].bossIdx)||0]||'rgba(100,100,100,0.04)';
  for(let i=0;i<5;i++){const rx=(frameN*0.5+i*80)%GW,ry=Math.sin(frameN*0.02+i)*40+GH/2;cx.beginPath();cx.arc(rx,ry,60+Math.sin(frameN*0.03+i)*20,0,Math.PI*2);cx.fill();}
}
function checkSpikes(){
  if(P.dead||P.ifr>0)return;
  for(const s of lvlSpikes){if(ovlp(P,{x:s.x,y:s.y,w:s.w,h:s.h})){hurtP(1);P.vy=-6;break;}}
}
function checkPit(){if(!P.dead&&P.y>GH+40){P.hp=0;P.dead=true;deathMsg=DEATH_UK[ri(0,DEATH_UK.length-1)];}}

// MAIN LOOP
let lastT=0;
function loop(ts){
  requestAnimationFrame(loop);
  const dt=ts-lastT;lastT=ts;if(dt>120)return;
  frameN++;
  cx.clearRect(0,0,GW,GH);
  tickDlg();tickParts();
  if(STATE==='menu'){
    drawMenu();
    if(KP['Space']||KP['Enter']){lvlIdx=0;totalScore=0;totalCoins=0;P.hp=3;P.maxHp=3;loadLevel(0);STATE='play';}
  } else if(STATE==='play'){
    tickP(lvlPlats);checkAtkHit();checkSpikes();checkPit();
    tickENMs(lvlPlats);tickPROJs(lvlPlats);tickPKUPs(lvlPlats);updateCam();
    drawLevel(camX,camY);drawParts(camX,camY);drawPKUPs(camX,camY);drawENMs(camX,camY);drawPROJs(camX,camY);drawP(camX,camY);drawHUD();drawDlg();
    if(ovlp(P,{x:exitDoor.x,y:exitDoor.y,w:exitDoor.w,h:exitDoor.h})){STATE='boss';startBoss(LVLS[lvlIdx].bossIdx);}
    if(P.dead){STATE='dying';}
  } else if(STATE==='dying'){
    updateCam();drawLevel(camX,camY);drawParts(camX,camY);drawPKUPs(camX,camY);drawENMs(camX,camY);drawHUD();drawDlg();
    if(frameN%60===0){STATE='gameover';frameN=0;}
  } else if(STATE==='boss'){
    tickP(lvlPlats);checkAtkHit();tickBoss();tickENMs(lvlPlats);tickPROJs(lvlPlats);
    drawBossArena();drawParts(0,0);drawENMs(0,0);drawPROJs(0,0);drawBoss();drawP(0,0);drawHPRow(10,8);drawDlg();
  } else if(STATE==='minigame'){
    tickMG();drawMG();
  } else if(STATE==='gameover'){
    drawGameOver();
    if(KP['Space']||KP['Enter']){lvlIdx=0;totalScore=0;totalCoins=0;P.hp=3;P.maxHp=3;loadLevel(0);STATE='play';}
  } else if(STATE==='win'){
    drawWin();
    if(KP['Space']||KP['Enter']){lvlIdx=0;totalScore=0;totalCoins=0;P.hp=3;P.maxHp=3;loadLevel(0);STATE='play';}
  }
  clearKP();
}
requestAnimationFrame(loop);

</script>
