'use strict';
/* =====================================================================
   ЖЕКА И САША: ХАТА НА ДВОИХ (и месть Егору)
   Игра на двоих за одним компом. Шутки: 0% смешные, 100% навоз.
   ===================================================================== */

/* ============ CANVAS ============ */
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
const W = 1280, H = 720;
let SC = 1, DPR = 1;
function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  SC = Math.min(innerWidth / W, innerHeight / H);
  cv.style.width = Math.floor(W * SC) + 'px';
  cv.style.height = Math.floor(H * SC) + 'px';
  cv.width = Math.max(1, Math.floor(W * SC * DPR));
  cv.height = Math.max(1, Math.floor(H * SC * DPR));
}
addEventListener('resize', resize);
resize();

/* ============ UTILS ============ */
const rand = (a, b) => a + Math.random() * (b - a);
const pick = a => a[Math.floor(Math.random() * a.length)];
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function rr(x, y, w, h, r) {
  r = Math.max(0, Math.min(r, w / 2, h / 2));
  ctx.beginPath(); ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}
function circ(x, y, r) { ctx.beginPath(); ctx.arc(x, y, Math.max(0, r), 0, Math.PI * 2); }
function ell(x, y, rx, ry) { ctx.beginPath(); ctx.ellipse(x, y, Math.max(0, rx), Math.max(0, ry), 0, 0, Math.PI * 2); }
function rectDist(px, py, r) { const cx = clamp(px, r.x, r.x + r.w), cy = clamp(py, r.y, r.y + r.h); return Math.hypot(px - cx, py - cy); }
// выталкивает круг o из прямоугольника r
function pushOut(o, r) {
  const cx = clamp(o.x, r.x, r.x + r.w), cy = clamp(o.y, r.y, r.y + r.h);
  const dx = o.x - cx, dy = o.y - cy, d = Math.hypot(dx, dy);
  if (d >= o.r) return false;
  if (d === 0) {
    const l = o.x - r.x, rt = r.x + r.w - o.x, t = o.y - r.y, b = r.y + r.h - o.y, m = Math.min(l, rt, t, b);
    if (m === l) o.x = r.x - o.r; else if (m === rt) o.x = r.x + r.w + o.r; else if (m === t) o.y = r.y - o.r; else o.y = r.y + r.h + o.r;
  } else { const k = (o.r - d) / d; o.x += dx * k; o.y += dy * k; }
  return true;
}
function separate(a, b) {
  const dx = b.x - a.x, dy = b.y - a.y, d = Math.hypot(dx, dy), m = a.r + b.r;
  if (d > 0 && d < m) { const k = (m - d) / d / 2; a.x -= dx * k; a.y -= dy * k; b.x += dx * k; b.y += dy * k; }
}

/* ============ TEXT ============ */
const FONT = '"Segoe UI","Trebuchet MS",Roboto,Arial,sans-serif';
const MEME = 'Impact,"Arial Black","Segoe UI",Roboto,sans-serif';
const EMO = '"Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji",sans-serif';
function txt(s, x, y, o = {}) {
  ctx.font = `${o.weight || 'bold'} ${o.size || 18}px ${o.fam || FONT}`;
  ctx.textAlign = o.align || 'center'; ctx.textBaseline = o.base || 'middle';
  if (o.stroke) { ctx.lineJoin = 'round'; ctx.lineWidth = o.sw || 4; ctx.strokeStyle = o.stroke; ctx.strokeText(s, x, y); }
  ctx.fillStyle = o.color || '#fff'; ctx.fillText(s, x, y);
}
function wrapLines(s, maxW, size, fam = FONT, w = 'bold') {
  ctx.font = `${w} ${size}px ${fam}`;
  const out = [];
  for (const para of String(s).split('\n')) {
    let line = '';
    for (const word of para.split(' ')) {
      const t = line ? line + ' ' + word : word;
      if (ctx.measureText(t).width > maxW && line) { out.push(line); line = word; } else line = t;
    }
    out.push(line);
  }
  return out;
}
function txtWrap(s, x, y, maxW, o = {}) {
  const size = o.size || 18, lh = o.lh || size * 1.3;
  const lines = wrapLines(s, maxW, size, o.fam || FONT, o.weight || 'bold');
  const y0 = o.vcenter ? y - (lines.length - 1) * lh / 2 : y;
  lines.forEach((l, i) => txt(l, x, y0 + i * lh, o));
  return lines.length * lh;
}
function emo(e, x, y, size) {
  ctx.font = `${size}px ${EMO}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillStyle = '#000'; ctx.fillText(e, x, y);
}
function bar(x, y, w, h, f, col, bg = 'rgba(0,0,0,.45)') {
  ctx.fillStyle = bg; rr(x, y, w, h, h / 2); ctx.fill();
  f = clamp(f, 0, 1);
  if (f > 0.005) { ctx.fillStyle = col; rr(x, y, Math.max(h, w * f), h, h / 2); ctx.fill(); }
  ctx.strokeStyle = 'rgba(255,255,255,.35)'; ctx.lineWidth = 1.5; rr(x, y, w, h, h / 2); ctx.stroke();
}

/* ============ INPUT ============ */
const keys = {};
const BIND = [
  { up: ['KeyW'], down: ['KeyS'], left: ['KeyA'], right: ['KeyD'], act: ['KeyF', 'KeyE', 'Space'], thr: ['KeyG', 'KeyQ'] },
  { up: ['ArrowUp'], down: ['ArrowDown'], left: ['ArrowLeft'], right: ['ArrowRight'], act: ['Enter', 'NumpadEnter', 'Numpad0', 'Period', 'KeyL'], thr: ['ShiftRight', 'NumpadDecimal', 'Slash', 'KeyK'] },
];
const IN = [0, 1].map(() => ({ x: 0, y: 0, act: false, thr: false, actN: 0, thrN: 0, actP: false, thrP: false, _ga: false, _gt: false, _gs: false, pad: false }));
let GP = { pause: false, mute: false, restart: false };
const PREVENT = ['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space', 'Enter', 'Slash', 'Period', 'Tab', 'NumpadEnter'];
addEventListener('keydown', e => {
  const c = e.code;
  if (PREVENT.includes(c)) e.preventDefault();
  initAudio();
  if (!e.repeat) {
    BIND.forEach((b, i) => { if (b.act.includes(c)) IN[i].actN++; if (b.thr.includes(c)) IN[i].thrN++; });
    if (c === 'Escape' || c === 'KeyP') GP.pause = true;
    if (c === 'KeyM') GP.mute = true;
    if (c === 'KeyR') GP.restart = true;
  }
  keys[c] = true;
});
addEventListener('keyup', e => { keys[e.code] = false; });
addEventListener('mousedown', () => initAudio());
addEventListener('blur', () => { for (const k in keys) keys[k] = false; if (G && (G.scene === 'home' || G.scene === 'boss')) G.paused = true; });

function pollInput() {
  let pads = [];
  try { pads = navigator.getGamepads ? [...navigator.getGamepads()].filter(Boolean) : []; } catch (e) { pads = []; }
  for (let i = 0; i < 2; i++) {
    const b = BIND[i], p = IN[i];
    let x = 0, y = 0;
    if (b.left.some(k => keys[k])) x -= 1;
    if (b.right.some(k => keys[k])) x += 1;
    if (b.up.some(k => keys[k])) y -= 1;
    if (b.down.some(k => keys[k])) y += 1;
    let act = b.act.some(k => keys[k]), thr = b.thr.some(k => keys[k]);
    const gp = pads[i];
    if (gp) {
      const bt = n => !!(gp.buttons[n] && gp.buttons[n].pressed);
      const ax = gp.axes[0] || 0, ay = gp.axes[1] || 0;
      if (Math.hypot(ax, ay) > 0.3) { x += ax; y += ay; }
      if (bt(14)) x -= 1; if (bt(15)) x += 1; if (bt(12)) y -= 1; if (bt(13)) y += 1;
      const ga = bt(0), gt = bt(2) || bt(1), gs = bt(9);
      if (ga && !p._ga) { p.actN++; initAudio(); }
      if (gt && !p._gt) p.thrN++;
      if (gs && !p._gs) GP.pause = true;
      p._ga = ga; p._gt = gt; p._gs = gs;
      act = act || ga; thr = thr || gt;
      p.pad = true;
    }
    const l = Math.hypot(x, y); if (l > 1) { x /= l; y /= l; }
    p.x = x; p.y = y; p.act = act; p.thr = thr;
    p.actP = p.actN > 0; p.thrP = p.thrN > 0;
  }
}
function consumeInput() { for (const p of IN) { p.actN = 0; p.thrN = 0; p.actP = false; p.thrP = false; } GP = { pause: false, mute: false, restart: false }; }
const anyAct = () => IN[0].actP || IN[1].actP;
const anyThr = () => IN[0].thrP || IN[1].thrP;
function keyLabel(i, kind) {
  if (IN[i].pad) return kind === 'act' ? 'A' : 'X';
  return i === 0 ? (kind === 'act' ? 'F' : 'G') : (kind === 'act' ? 'Enter' : 'Shift');
}

/* ============ AUDIO ============ */
let AC = null, MASTER, SFXG, MUSG, NOISE, muted = false, pendingSong = null;
function initAudio() {
  if (AC) { if (AC.state === 'suspended') AC.resume(); return; }
  try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { AC = null; return; }
  MASTER = AC.createGain(); MASTER.gain.value = muted ? 0 : 0.55; MASTER.connect(AC.destination);
  SFXG = AC.createGain(); SFXG.connect(MASTER);
  MUSG = AC.createGain(); MUSG.gain.value = 0.2; MUSG.connect(MASTER);
  const len = AC.sampleRate; NOISE = AC.createBuffer(1, len, AC.sampleRate);
  const d = NOISE.getChannelData(0); for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
  if (pendingSong !== null) { playSong(pendingSong); }
}
function tone(f, dur, type = 'square', vol = 0.15, slide = null, delay = 0, dest = null) {
  if (!AC) return;
  const t = AC.currentTime + Math.max(0, delay);
  const o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t);
  if (slide) o.frequency.exponentialRampToValueAtTime(slide, t + dur);
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(dest || SFXG); o.start(t); o.stop(t + dur + 0.05);
}
function noise(dur, vol = 0.2, freq = 1000, ftype = 'lowpass', delay = 0, dest = null) {
  if (!AC) return;
  const t = AC.currentTime + Math.max(0, delay);
  const s = AC.createBufferSource(); s.buffer = NOISE; s.loop = true;
  const f = AC.createBiquadFilter(); f.type = ftype; f.frequency.value = freq;
  const g = AC.createGain(); g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  s.connect(f); f.connect(g); g.connect(dest || SFXG); s.start(t); s.stop(t + dur + 0.05);
}
const SFX = {
  rimshot() { tone(210, 0.14, 'sine', 0.5, 90); noise(0.1, 0.35, 1800, 'bandpass'); tone(170, 0.14, 'sine', 0.5, 75, 0.2); noise(0.1, 0.35, 1800, 'bandpass', 0.2); noise(0.7, 0.22, 7000, 'highpass', 0.42); },
  trombone() {
    if (!AC) return;
    [293.66, 277.18, 261.63].forEach((f, i) => tone(f, 0.42, 'sawtooth', 0.1, null, i * 0.45));
    const t = AC.currentTime + 1.35, o = AC.createOscillator(), g = AC.createGain(), l = AC.createOscillator(), lg = AC.createGain(), fl = AC.createBiquadFilter();
    o.type = 'sawtooth'; o.frequency.setValueAtTime(246.94, t); o.frequency.linearRampToValueAtTime(233, t + 1.2);
    l.frequency.value = 6; lg.gain.value = 7; l.connect(lg); lg.connect(o.frequency);
    fl.type = 'lowpass'; fl.frequency.value = 1400;
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.11, t + 0.03); g.gain.setValueAtTime(0.11, t + 0.9); g.gain.exponentialRampToValueAtTime(0.0001, t + 1.3);
    o.connect(fl); fl.connect(g); g.connect(SFXG); o.start(t); l.start(t); o.stop(t + 1.35); l.stop(t + 1.35);
  },
  fart() {
    if (!AC) return;
    const t = AC.currentTime, o = AC.createOscillator(), l = AC.createOscillator(), lg = AC.createGain(), f = AC.createBiquadFilter(), g = AC.createGain();
    o.type = 'sawtooth'; o.frequency.setValueAtTime(rand(95, 125), t); o.frequency.exponentialRampToValueAtTime(50, t + 0.55);
    l.frequency.value = rand(22, 32); lg.gain.value = 35; l.connect(lg); lg.connect(o.frequency);
    f.type = 'lowpass'; f.frequency.value = 520;
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.35, t + 0.03); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.6);
    o.connect(f); f.connect(g); g.connect(SFXG); o.start(t); l.start(t); o.stop(t + 0.65); l.stop(t + 0.65);
  },
  punch() { noise(0.14, 0.6, 700, 'lowpass'); tone(150, 0.12, 'sine', 0.5, 45); },
  whoosh() { noise(0.22, 0.18, 1300, 'bandpass'); },
  pickup() { tone(620, 0.06, 'square', 0.08); tone(930, 0.09, 'square', 0.08, null, 0.06); },
  drop() { tone(320, 0.09, 'triangle', 0.15, 150); },
  cash() { tone(1318, 0.06, 'square', 0.07); tone(1760, 0.22, 'square', 0.07, null, 0.06); },
  type() { noise(0.03, 0.12, 4200, 'highpass'); },
  lift() { tone(170 + Math.random() * 70, 0.07, 'triangle', 0.14); },
  rep() { tone(523, 0.08, 'square', 0.08); tone(784, 0.13, 'square', 0.08, null, 0.07); },
  eat() { for (let i = 0; i < 3; i++) noise(0.07, 0.25, 900, 'bandpass', i * 0.11); },
  honk() { tone(349, 0.28, 'sawtooth', 0.1); tone(440, 0.28, 'sawtooth', 0.08); tone(349, 0.35, 'sawtooth', 0.1, null, 0.38); tone(440, 0.35, 'sawtooth', 0.08, null, 0.38); },
  five() { noise(0.08, 0.6, 2500, 'bandpass'); tone(880, 0.1, 'square', 0.08, null, 0.05); tone(1320, 0.22, 'square', 0.08, null, 0.12); },
  hurt() { tone(320, 0.2, 'square', 0.12, 90); },
  boom() { noise(0.6, 0.7, 300, 'lowpass'); tone(85, 0.5, 'sine', 0.6, 30); },
  alarm() { tone(880, 0.12, 'square', 0.08); tone(660, 0.12, 'square', 0.08, null, 0.13); },
  ding() { tone(1568, 0.35, 'sine', 0.18); tone(2093, 0.4, 'sine', 0.1, null, 0.08); },
  burn() { noise(0.9, 0.3, 600, 'lowpass'); },
  door() { noise(0.06, 0.5, 400, 'lowpass'); noise(0.06, 0.5, 400, 'lowpass', 0.16); },
  doxx() { for (let i = 0; i < 10; i++) tone(rand(900, 2400), 0.04, 'square', 0.05, null, i * 0.05); },
  ring() { for (let i = 0; i < 4; i++) { tone(1250, 0.07, 'square', 0.06, null, i * 0.16); tone(950, 0.07, 'square', 0.06, null, i * 0.16 + 0.08); } },
  revive() { [523, 659, 784, 1047].forEach((f, i) => tone(f, 0.12, 'square', 0.08, null, i * 0.07)); },
  fanfare() { [523, 659, 784, 1047].forEach((f, i) => tone(f, 0.25, 'square', 0.1, null, i * 0.14)); tone(1047, 0.9, 'square', 0.1, null, 0.6); tone(784, 0.9, 'square', 0.07, null, 0.6); },
  blip() { tone(520, 0.05, 'square', 0.05); },
  no() { tone(200, 0.12, 'square', 0.08); tone(150, 0.16, 'square', 0.08, null, 0.1); },
};

/* ---- музыка: очень простой секвенсор ---- */
const m2f = m => 440 * Math.pow(2, (m - 69) / 12);
const SONGS = {
  home: {
    bpm: 112, kick: false,
    bass: [48, 60, 48, 60, 55, 60, 48, 55, 45, 57, 45, 57, 52, 57, 45, 52, 41, 53, 41, 53, 48, 53, 41, 48, 43, 55, 43, 55, 50, 55, 43, 50],
    lead: [64, 0, 67, 0, 72, 0, 67, 64, 69, 0, 72, 0, 76, 0, 72, 69, 65, 0, 69, 0, 72, 0, 77, 76, 74, 0, 71, 0, 67, 0, 71, 74],
  },
  boss: {
    bpm: 152, kick: true,
    bass: [45, 45, 57, 45, 45, 57, 45, 55, 41, 41, 53, 41, 41, 53, 41, 52, 43, 43, 55, 43, 43, 55, 43, 50, 40, 40, 52, 40, 40, 52, 44, 47],
    lead: [69, 0, 72, 76, 0, 72, 69, 0, 65, 0, 69, 72, 0, 69, 77, 76, 67, 0, 71, 74, 0, 79, 77, 74, 76, 0, 75, 76, 0, 71, 68, 64],
  },
};
let song = null, songStep = 0, nextNoteT = 0;
function playSong(name) {
  pendingSong = name;
  if (!AC) return;
  song = name ? SONGS[name] : null; songStep = 0; nextNoteT = AC.currentTime + 0.08;
}
setInterval(() => {
  if (!AC || !song) return;
  const sp = 60 / song.bpm / 2;
  if (nextNoteT < AC.currentTime - 0.1) nextNoteT = AC.currentTime + 0.05;
  while (nextNoteT < AC.currentTime + 0.2) {
    const d = nextNoteT - AC.currentTime, i = songStep % song.bass.length;
    const b = song.bass[i], l = song.lead[i];
    if (b) tone(m2f(b), sp * 0.8, 'triangle', 0.5, null, d, MUSG);
    if (l) tone(m2f(l), sp * 0.9, 'square', 0.13, null, d, MUSG);
    if (song.kick) {
      if (i % 2 === 0) tone(130, 0.11, 'sine', 0.6, 40, d, MUSG);
      noise(0.03, 0.12, 8000, 'highpass', d, MUSG);
    } else if (i % 4 === 2) noise(0.04, 0.1, 6000, 'highpass', d, MUSG);
    nextNoteT += sp; songStep++;
  }
}, 50);
function toggleMute() { muted = !muted; if (MASTER) MASTER.gain.value = muted ? 0 : 0.55; }

function updateFx(dt) {
  G.shake = Math.max(0, G.shake - dt * 30);
  G.dox = Math.max(0, G.dox - dt);
  for (let i = G.parts.length - 1; i >= 0; i--) {
    const p = G.parts[i]; p.t += dt;
    if (p.t >= p.life) { G.parts.splice(i, 1); continue; }
    p.vy += (p.g || 0) * dt; p.x += p.vx * dt; p.y += p.vy * dt; if (p.grow) p.sz += p.grow * dt;
  }
  for (let i = G.floats.length - 1; i >= 0; i--) { const f = G.floats[i]; f.t += dt; f.y -= 38 * dt; if (f.t > f.dur) G.floats.splice(i, 1); }
  for (let i = G.bubbles.length - 1; i >= 0; i--) { const b = G.bubbles[i]; b.t += dt; if (b.t > b.dur || b.ent.gone) G.bubbles.splice(i, 1); }
  if (G.toasts.length) { const t = G.toasts[0]; t.t += dt; if (t.t > t.dur) G.toasts.shift(); }
  const tk = G.ticker; tk.t += dt;
  if (tk.kind === 'joke' && !tk.rim && tk.t > 2.8) { tk.rim = true; SFX.rimshot(); }
  if (tk.t > tk.dur) {
    G.tipI++;
    const list = G.scene === 'boss' ? BOSS_TIPS : TIPS;
    G.ticker = { kind: 'tip', text: list[G.tipI % list.length], t: 0, dur: 7, rim: false };
  }
}

    bgGrad('#312e81', '#1e1b4b');
    txt('ВЫ РАЗЪЕХАЛИСЬ 💔', 640, 130, { size: 72, fam: MEME, color: '#f9a8d4', stroke: '#000', sw: 10 });
    drawChar(420, 320, LOOK.zheka, { s: 2.4, mouth: 'sad', fx: -1 }); drawChar(860, 320, LOOK.sasha, { s: 2.4, mouth: 'sad', fx: 1 });
    emo('🫖', 340, 330, 40); emo('😤', 940, 280, 40);
    txtWrap('Жека забирает чайник, Саша — обиду.\nЕгору так и не досталось боя. Денис сдаёт хату Севе.', 640, 470, 900, { size: 24, vcenter: true, lh: 32 });
    if (G.sceneT > 1.2) blinkText('F / Enter — попробовать снова', 610, 24);
  }
}
function drawPause() {
  ctx.fillStyle = 'rgba(0,0,0,.65)'; ctx.fillRect(0, 0, W, H);
  txt('ПАУЗА', 640, 300, { size: 80, fam: MEME, color: '#ffd23f', stroke: '#000', sw: 10 });
  txt('Esc — продолжить · R — начать заново · M — звук ' + (muted ? '(выкл)' : '(вкл)'), 640, 390, { size: 22 });
  txt('Пока вы на паузе, Денис ничего не мусорит. Это единственный момент.', 640, 440, { size: 18, color: '#c4b5fd' });
}

/* ============ ГЛАВНЫЙ ЦИКЛ ============ */
function update(dt) {
  G.t += dt; G.sceneT += dt;
  switch (G.scene) {
    case 'title': if (anyAct()) { initAudio(); SFX.rimshot(); startCards(introCards(), 'day1'); } break;
    case 'cards':
      if (G.sceneT > 0.5 && anyAct()) {
        SFX.blip(); G.cardI++; G.sceneT = 0;
        if (G.cardI >= G.cards.length) { if (G.cardsNext === 'day1') startDay(1); else startBoss(false); }
      }
      break;
    case 'home': updateHome(dt); break;
    case 'summary':
      if (!G.summary.rim && G.sceneT > 2.4) { G.summary.rim = true; SFX.rimshot(); }
      if (G.sceneT > 1 && anyAct()) {
        if (G.friend <= 0) breakup();
        else if (G.day < DAYS) startDay(G.day + 1);
        else { playSong(null); startCards(bossCards(), 'boss'); }
      }
      break;
    case 'boss': updateBoss(dt); break;
    case 'win': if (G.sceneT > 1.5 && anyAct()) newGame(); break;
    case 'lose':
      if (G.sceneT > 1.2 && anyAct()) startBoss(true);
      else if (G.sceneT > 1.2 && anyThr()) newGame();
      break;
    case 'breakup': if (G.sceneT > 1.2 && anyAct()) newGame(); break;
  }
  updateFx(dt);
}
function render(dt) {
  ctx.setTransform(SC * DPR, 0, 0, SC * DPR, 0, 0);
  ctx.fillStyle = '#120c18'; ctx.fillRect(0, 0, W, H);
  switch (G.scene) {
    case 'title': drawTitle(dt); break;
    case 'cards': drawCards(); break;
    case 'home': drawHome(); break;
    case 'summary': drawHome(); drawSummary(); break;
    case 'boss': drawBoss(); break;
    case 'win': drawEnd('win'); drawFx(); break;
    case 'lose': drawEnd('lose'); break;
    case 'breakup': drawEnd('breakup'); break;
  }
  if (G.paused) drawPause();
  if (muted) txt('🔇', W - 14, H - 54, { size: 18, align: 'right' });
}
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, Math.max(0, (now - last) / 1000)); last = now;
  pollInput();
  if (GP.mute) toggleMute();
  if (GP.pause && (G.scene === 'home' || G.scene === 'boss')) G.paused = !G.paused;
  if (G.paused && GP.restart) { G.paused = false; playSong(null); newGame(); }
  if (!G.paused) update(dt);
  render(G.paused ? 0 : dt);
  consumeInput();
  requestAnimationFrame(frame);
}
newGame();
requestAnimationFrame(frame);
</script>
